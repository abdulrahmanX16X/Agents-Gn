                        src={activeAgent.creator.avatarUrl}
                        alt={activeAgent.creator.displayName || activeAgent.creator.username}
                        fallbackText={activeAgent.creator.username}
                        className="w-4 h-4 rounded-full border border-line bg-paper object-cover text-[9px] flex-shrink-0"
                      />
                      <span className="truncate" dir="ltr">@{activeAgent.creator.username}</span>
                    </button>
                  )}
                  {agentMemory && (
                    <button
                      type="button"
                      onClick={onOpenMemoryModal}
                      className="inline-flex items-center gap-1 px-2 py-0.5 bg-sageMist border border-line text-[10px] font-extrabold text-ink hover:bg-sageMist"
                    >
                      <Icon name="brain" className="w-3 h-3" /> {lang === "ar" ? "ذاكرة التقدم نشطة" : "Memory active"}
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2 flex-shrink-0">
                {activeAgent.isPublic !== false && (
                  <button
                    type="button"
                    onClick={() => onShareAgent(activeAgent)}
                    title={lang === "ar" ? "نسخ رابط الوكيل" : "Copy agent link"}
                    className="nb-btn px-3 py-1.5 bg-paper hover:bg-cream text-ink text-xs font-extrabold inline-flex items-center gap-1.5"
                  >
                    <Icon name="share" className="w-3.5 h-3.5" />
                    <span>{lang === "ar" ? "مشاركة" : "Share"}</span>
                  </button>
                )}
                <button
                  type="button"
                  onClick={onNewChat}
                  className="nb-btn px-3.5 py-1.5 bg-brandYellow text-ink text-xs font-extrabold inline-flex items-center gap-1.5"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>{lang === "ar" ? "شات جديد" : "New Chat"}</span>
                </button>
              </div>
            </div>

            {/* Mobile Chat Header */}
            <div className="md:hidden flex-shrink-0 flex items-center justify-between px-3 py-2 bg-paper border-b-2 border-line gap-2">
              <button
                type="button"
                onClick={onNavigateExplore}
                className="nb-btn flex items-center gap-1 text-xs font-extrabold text-ink py-1 px-2.5 bg-cream"
              >
                <Icon name="back" className="w-3.5 h-3.5" />
                <span>{lang === "ar" ? "رجوع" : "Back"}</span>
              </button>
              <div className="min-w-0 flex-1 flex items-center justify-center gap-1.5">
                <span className="font-extrabold text-sm text-ink truncate" dir="auto">
                  {activeAgent.name}
                </span>
                {activeAgent.isPublic === false && (
                  <span className="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-cream border border-line text-[10px] font-extrabold text-ink flex-shrink-0">
                    <Icon name="lock" className="w-2.5 h-2.5" /> {lang === "ar" ? "خاص" : "Private"}
                  </span>
                )}
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                {activeAgent.isPublic !== false && (
                  <button
                    type="button"
                    onClick={() => onShareAgent(activeAgent)}
                    aria-label={lang === "ar" ? "نسخ رابط الوكيل" : "Copy agent link"}
                    className="nb-btn w-8 h-8 flex items-center justify-center bg-paper text-ink"
                  >
                    <Icon name="share" className="w-4 h-4" />
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => setShowMobileHistory(true)}
                  aria-label={lang === "ar" ? "سجل المحادثات" : "Chat history"}
                  className="nb-btn w-8 h-8 flex items-center justify-center bg-brandYellow text-ink"
                >
                  <Icon name="chat" className="w-4 h-4" />
                </button>
                <button
                  type="button"
                  onClick={onNewChat}
                  title={lang === "ar" ? "شات جديد" : "New chat"}
                  aria-label={lang === "ar" ? "شات جديد" : "New chat"}
                  className="nb-btn w-8 h-8 flex items-center justify-center bg-brandBlue text-white"
                >
                  <Icon name="plus" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Messages Scroll Area */}
            <div ref={chatContainerRef} className="chat-scroll-area flex-1 min-h-0 px-3 sm:px-7 py-5 sm:py-7">
              <div className="max-w-3xl mx-auto">
                {loadingMessages ? (
                  <div className="nb-box p-8 text-center font-extrabold text-sm">
                    {lang === "ar" ? "جاري تحميل المحادثة..." : "Loading conversation..."}
                  </div>
                ) : messages.length === 0 ? (
                  <div className="py-6 sm:py-12 space-y-6">
                    <div className="nb-box-lg p-6 sm:p-8 text-center max-w-xl mx-auto">
                      <SafeAvatar
                        src={activeAgent.avatarUrl}
                        alt={activeAgent.name}
                        fallbackText={activeAgent.name}
                        className="w-20 h-20 mx-auto bg-cream border-2 border-line shadow-sm mb-4 text-2xl object-cover"
                      />
                      <h3 className="text-xl sm:text-2xl font-extrabold text-ink mb-2" dir="auto">
                        {activeAgent.name}
                      </h3>
                      {activeAgent.creator?.username && (
                        <button
                          type="button"
                          onClick={() => onOpenCreator(activeAgent.creator.username)}
                          className="inline-flex items-center gap-1.5 px-3 py-1 mb-3 rounded-full bg-cream hover:bg-brandYellow border border-line text-xs font-extrabold text-ink transition-colors"
                        >
                          <SafeAvatar
                            src={activeAgent.creator.avatarUrl}
                            alt={activeAgent.creator.displayName || activeAgent.creator.username}
                            fallbackText={activeAgent.creator.username}
                            className="w-4 h-4 rounded-full border border-line bg-paper object-cover text-[9px] flex-shrink-0"
                          />
                          <span>{lang === "ar" ? "بواسطة" : "by"}</span>
                          <span dir="ltr">@{activeAgent.creator.username}</span>
                        </button>
                      )}
                      <p className="text-xs sm:text-sm font-semibold text-neutral-700 leading-relaxed" dir="auto">
                        {activeAgent.description}
                      </p>
                      {agentMemory && (
                        <div className="mt-4 p-2.5 bg-brandYellow/40 border-2 border-line text-xs font-extrabold text-ink">
                          {lang === "ar" ? "لديك تقدّم محفوظ مع هذا الوكيل — اسأله: وين وصلنا؟" : "Your progress is saved — ask this agent where you left off."}
                        </div>
                      )}
                    </div>

                    {activeAgent.starterPrompts?.length > 0 && (
                      <div className="max-w-xl mx-auto">
                        <p className="text-xs font-extrabold uppercase tracking-wider text-ink mb-3 text-center">
                          {lang === "ar" ? "ابدأ بأحد هذه الاقتراحات:" : "Suggested Starters:"}
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {activeAgent.starterPrompts.map((prompt, idx) => (
                            <button
                              key={idx}
                              type="button"
                              onClick={() => onSendMessage(prompt)}
                              dir="auto"
                              className="nb-card text-start p-4 text-xs sm:text-sm font-bold text-ink hover:bg-brandYellow"
                            >
                              {prompt}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-5 pb-2">
                    {messages.map((msg, i) => {
                      if (sendingMessage && msg.role === "model" && !msg.text) return null;
                      const isUser = msg.role === "user";
                      const isLastStreaming = sendingMessage && !isUser && i === messages.length - 1;
                      return (
                        <div
                          key={msg._id || i}
                          dir={lang === "ar" ? "rtl" : "ltr"}
                          className={`flex gap-3 min-w-0 ${isUser ? "justify-start" : "justify-end"}`}
                        >
                          {isUser && (
                            <div className="w-8 h-8 flex-shrink-0 bg-brandYellow border-2 border-line shadow-sm flex items-center justify-center font-extrabold text-xs mt-1">
                              {lang === "ar" ? "أنت" : "You"}
                            </div>
                          )}
                          <div className={`min-w-0 flex flex-col ${isUser ? "items-start max-w-[86%] sm:max-w-[78%]" : "items-end max-w-[calc(100%-44px)] sm:max-w-[90%]"}`}>
                            <div
                              className={`chat-message-bubble min-w-0 w-full px-4 sm:px-5 py-3.5 border-2 border-line ${
                                isUser
                                  ? "user-bubble bg-brandBlue text-white shadow-sm"
                                  : "bg-paper text-ink shadow-sm"
                              }`}
                            >
                              <FormattedMessage text={msg.text} uiLang={lang} />
                              {isLastStreaming && (
                                <span className="inline-block w-2.5 h-4 mr-1 align-middle bg-brandYellow border border-line animate-pulse" />
                              )}
                            </div>
                            {!isUser && !isLastStreaming && msg.text && (
                              <CopyMessageButton text={msg.text} lang={lang} />
                            )}
                          </div>
                          {!isUser && (
                            <SafeAvatar
                              src={activeAgent.avatarUrl}
                              alt={activeAgent.name}
                              fallbackText={activeAgent.name}
                              className="w-8 h-8 bg-paper border-2 border-line shadow-sm flex-shrink-0 mt-1 object-cover text-xs"
                            />
                          )}
                        </div>
                      );
                    })}

                    {sendingMessage && messages[messages.length - 1]?.role === "model" && !messages[messages.length - 1]?.text && (
                      <div dir={lang === "ar" ? "rtl" : "ltr"} className="flex gap-3 justify-end">
                        <div className="nb-box px-4 py-3 flex items-center gap-1.5">
                          <span className="w-2.5 h-2.5 bg-brandYellow border border-line animate-bounce"></span>
                          <span className="w-2.5 h-2.5 bg-brandBlue border border-line animate-bounce" style={{ animationDelay: "150ms" }}></span>
                          <span className="w-2.5 h-2.5 bg-darkPanel animate-bounce" style={{ animationDelay: "300ms" }}></span>
                        </div>
                        <SafeAvatar
                          src={activeAgent.avatarUrl}
                          alt={activeAgent.name}
                          fallbackText={activeAgent.name}
                          className="w-8 h-8 bg-paper border-2 border-line flex-shrink-0 object-cover text-xs"
                        />
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* Chat Composer & Stop Button */}
            <div className="chat-composer-wrap flex-shrink-0 px-3 sm:px-7 pt-3 pb-4 bg-paper border-t-2 border-line">
              <div className="max-w-3xl mx-auto">
                <div className="nb-box flex items-end gap-2 p-2">
                  <textarea
                    ref={textareaRef}
                    rows="1"
                    maxLength={4000}
                    value={inputMessage}
                    onChange={(e) => setInputMessage(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        onSendMessage();
                      }
                    }}
                    placeholder={lang === "ar" ? `اكتب رسالتك إلى ${activeAgent.name}...` : `Message ${activeAgent.name}...`}
                    dir="auto"
                    className="w-full min-w-0 max-h-[140px] bg-transparent px-3 py-2 text-sm font-bold text-ink placeholder-neutral-500 focus:outline-none resize-none leading-relaxed"
                  />
                  {sendingMessage ? (
                    <button
                      type="button"
                      onClick={onAbortStream}
                      aria-label={lang === "ar" ? "إيقاف التوليد" : "Stop generating"}
                      className="nb-btn p-2.5 sm:px-4 sm:py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs flex items-center gap-1.5 flex-shrink-0"
                    >
                      <Icon name="stop" className="w-3.5 h-3.5" />
                      <span className="hidden sm:inline">{lang === "ar" ? "إيقاف" : "Stop"}</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => onSendMessage()}
                      disabled={!inputMessage.trim()}
                      aria-label={lang === "ar" ? "إرسال" : "Send"}
                      className="nb-btn p-2.5 sm:px-4 sm:py-2.5 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-40 text-white font-extrabold text-xs flex items-center gap-1.5 flex-shrink-0"
                    >
                      <span className="hidden sm:inline">{lang === "ar" ? "إرسال" : "Send"}</span>
                      <Icon name="send" className="w-4 h-4" />
                    </button>
                  )}
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    function ProfilePage({ user, lang, agents, loading, error, isOwnProfile = true, onExplore, onCreate, onOpenAgent, onRefresh, onUpdateBio, onShareCreator }) {
      const [filter, setFilter] = useState("");
      const [editingBio, setEditingBio] = useState(false);
      const [bioDraft, setBioDraft] = useState(user.bio || "");
      const [savingBio, setSavingBio] = useState(false);
      const [bioError, setBioError] = useState("");

      useEffect(() => {
        if (!editingBio) {
          setBioDraft(user.bio || "");
        }
      }, [user.bio, editingBio]);

      useEffect(() => {
        setEditingBio(false);
        setFilter("");
        setBioError("");
      }, [user.username, isOwnProfile]);

      const handleSaveBio = async (e) => {
        e.preventDefault();
        if (savingBio || !onUpdateBio) return;
        setBioError("");
        setSavingBio(true);
        try {
          await onUpdateBio(bioDraft.trim());
          setEditingBio(false);
        } catch (err) {
          setBioError(getFriendlyError(err, lang, "profile_bio"));
        } finally {
          setSavingBio(false);
        }
      };

      const name = user.displayName || user.username || (lang === "ar" ? "مبدع" : "Creator");
      const totalViews = agents.reduce((sum, agent) => sum + (Number(agent.viewsCount) || 0), 0);
      const joinedLabel = user.createdAt
        ? new Date(user.createdAt).toLocaleDateString(lang === "ar" ? "ar-EG" : "en-US", { year: "numeric", month: "short" })
        : (lang === "ar" ? "صانع وكلاء" : "Agent Creator");
      const visibleAgents = agents.filter((agent) =>
        `${agent.name || ""} ${agent.description || ""} ${agent.category || ""}`
          .toLowerCase().includes(filter.toLowerCase().trim())
      );

      return (
        <main className="w-full max-w-7xl mx-auto flex-1 px-4 sm:px-6 py-8">
          <section className="nb-box-lg overflow-hidden mb-8">
            <div className="h-28 sm:h-36 bg-darkPanel px-6 pt-5 flex items-start justify-between">
              <span className="px-3 py-1 bg-brandYellow border border-line text-ink text-xs font-extrabold">
                {lang === "ar" ? "ملف صانع الوكلاء" : "Creator Profile"}
              </span>
              <div className="flex gap-2">
                <button type="button" onClick={onExplore} className="nb-btn px-3.5 py-1.5 bg-paper text-ink text-xs font-extrabold">
                  {lang === "ar" ? "المنصة" : "Explore"}
                </button>
                {user.username && onShareCreator && (
                  <button
                    type="button"
                    onClick={() => onShareCreator(user.username)}
                    className="nb-btn px-3 py-1.5 bg-paper hover:bg-cream text-ink text-xs font-extrabold inline-flex items-center gap-1"
                    title={lang === "ar" ? "مشاركة الملف الشخصي" : "Share profile"}
                  >
                    <Icon name="share" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">{lang === "ar" ? "مشاركة" : "Share"}</span>
                  </button>
                )}
                {isOwnProfile && (
                  <button type="button" onClick={onCreate} className="nb-btn px-3.5 py-1.5 bg-brandBlue text-white text-xs font-extrabold flex items-center gap-1">
                    <Icon name="plus" className="w-3.5 h-3.5" /> {lang === "ar" ? "وكيل جديد" : "New agent"}
                  </button>
                )}
              </div>
            </div>

            <div className="px-6 pb-7 bg-paper">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-12 mb-5">
                <div className="flex items-end gap-4">
                  <SafeAvatar
                    src={user.avatarUrl}
                    alt={name}
                    fallbackText={name}
                    className="w-24 h-24 bg-brandYellow border-2 border-line shadow-sm object-cover text-3xl flex-shrink-0"
                  />
                  <div className="pb-1 min-w-0">
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-ink" dir="auto">{name}</h1>
                    <p className="text-sm font-bold text-brandBlue" dir="ltr">@{user.username}</p>
                  </div>
                </div>

                {isOwnProfile && !editingBio && (
                  <button
                    type="button"
                    onClick={() => {
                      setBioDraft(user.bio || "");
                      setBioError("");
                      setEditingBio(true);
                    }}
                    className="nb-btn self-start sm:self-end px-3.5 py-1.5 bg-cream hover:bg-brandYellow text-ink text-xs font-extrabold inline-flex items-center gap-1.5"
                  >
                    <Icon name="edit" className="w-3.5 h-3.5" />
                    <span>{user.bio ? (lang === "ar" ? "تعديل النبذة" : "Edit bio") : (lang === "ar" ? "إضافة نبذة" : "Add bio")}</span>
                  </button>
                )}
              </div>

              <div className="mb-5">
                {!(isOwnProfile && editingBio) ? (
                  <p className="text-sm font-semibold text-neutral-700 leading-relaxed" dir="auto">
                    {user.bio || (isOwnProfile
                      ? (lang === "ar" ? "لا توجد نبذة تعريفية بعد — أضف نبذة قصيرة عنك." : "No bio added yet — add a short bio about yourself.")
                      : (lang === "ar" ? "صانع وكلاء ذكاء اصطناعي على AgentTube." : "AI Agent Creator on AgentTube."))}
                  </p>
                ) : (
                  <form onSubmit={handleSaveBio} className="nb-box-sm p-4 bg-cream/70 space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <label className="text-xs font-extrabold text-ink">
                        {lang === "ar" ? "النبذة التعريفية (Bio)" : "Creator Bio"}
                      </label>
                      <span className="text-[11px] font-mono font-bold text-neutral-500" dir="ltr">
                        {bioDraft.length}/240
                      </span>
                    </div>
                    <textarea
                      rows="2"
                      maxLength={240}
                      dir="auto"
                      disabled={savingBio}
                      value={bioDraft}
                      onChange={(e) => {
                        if (bioError) setBioError("");
                        setBioDraft(e.target.value);
                      }}
                      placeholder={lang === "ar" ? "اكتب نبذة مختصرة عن تخصصك أو الوكلاء الذين تبنيهم..." : "Write a short bio about what you build..."}
                      className="nb-input w-full px-3.5 py-2 text-sm font-bold leading-relaxed"
                    />
                    <InlineAlert message={bioError} />
                    <div className="flex items-center justify-end gap-2">
                      <button
                        type="button"
                        disabled={savingBio}
                        onClick={() => {
                          setEditingBio(false);
                          setBioError("");
                          setBioDraft(user.bio || "");
                        }}
                        className="nb-btn px-3.5 py-1.5 bg-paper text-ink text-xs font-extrabold"
                      >
                        {lang === "ar" ? "إلغاء" : "Cancel"}
                      </button>
                      <button
                        type="submit"
                        disabled={savingBio}
                        className="nb-btn px-4 py-1.5 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-50 text-white text-xs font-extrabold inline-flex items-center gap-1.5"
                      >
                        {savingBio ? (lang === "ar" ? "جاري الحفظ..." : "Saving...") : (lang === "ar" ? "حفظ النبذة" : "Save bio")}
                      </button>
                    </div>
                  </form>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t-2 border-line">
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-2xl font-extrabold text-ink">{loading ? "—" : agents.length}</div>
                  <p className="text-xs font-bold text-neutral-600">
                    {isOwnProfile ? (lang === "ar" ? "وكلائي" : "My agents") : (lang === "ar" ? "وكلاء منشورون" : "Published agents")}
                  </p>
                </div>
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-2xl font-extrabold text-ink">{loading ? "—" : totalViews.toLocaleString("en-US")}</div>
                  <p className="text-xs font-bold text-neutral-600">{lang === "ar" ? "إجمالي المشاهدات" : "Total views"}</p>
                </div>
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-sm font-extrabold text-ink truncate" dir={isOwnProfile ? "ltr" : "auto"}>
                    {isOwnProfile ? user.email : joinedLabel}
                  </div>
                  <p className="text-xs font-bold text-neutral-600">
                    {isOwnProfile ? (lang === "ar" ? "البريد الإلكتروني" : "Email") : (lang === "ar" ? "تاريخ الانضمام" : "Joined")}
                  </p>
                </div>
              </div>
            </div>
          </section>

          <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
            <h2 className="text-xl sm:text-2xl font-extrabold text-ink">
              {isOwnProfile
                ? (lang === "ar" ? "وكلائي (العامة والخاصة)" : "My agents (Public & Private)")
                : (lang === "ar" ? `الوكلاء المنشورون بواسطة @${user.username}` : `Published agents by @${user.username}`)}
            </h2>
            <button type="button" onClick={onRefresh} disabled={loading} className="nb-btn px-3.5 py-1.5 bg-paper text-xs font-extrabold inline-flex items-center gap-1.5">
              <Icon name="refresh" className={`w-3.5 h-3.5 ${loading ? "animate-spin" : ""}`} /> {lang === "ar" ? "تحديث" : "Refresh"}
            </button>
          </div>

          {!loading && !error && agents.length > 0 && (
            <div className="mb-5 max-w-md">
              <input
                value={filter}
                onChange={(e) => setFilter(e.target.value)}
                placeholder={isOwnProfile ? (lang === "ar" ? "ابحث في وكلائك..." : "Search your agents...") : (lang === "ar" ? "ابحث في وكلاء هذا الصانع..." : "Search creator's agents...")}
                className="nb-input w-full px-4 py-2.5 text-sm font-bold"
              />
            </div>
          )}

          {loading ? (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {[1, 2, 3].map((i) => <div key={i} className="nb-box h-48 animate-pulse" />)}
            </div>
          ) : error ? (
            <div className="nb-box p-8 text-center space-y-4">
              <InlineAlert message={error} />
              <div className="flex items-center justify-center gap-2">
                <button type="button" onClick={onRefresh} className="nb-btn px-4 py-2 bg-brandYellow text-xs font-extrabold">{lang === "ar" ? "إعادة المحاولة" : "Try again"}</button>
                {!isOwnProfile && (
                  <button type="button" onClick={onExplore} className="nb-btn px-4 py-2 bg-paper text-xs font-extrabold">{lang === "ar" ? "العودة للمنصة" : "Back to Explore"}</button>
                )}
              </div>
            </div>
          ) : visibleAgents.length === 0 ? (
            <div className="nb-box p-10 text-center">
              <h3 className="text-lg font-extrabold text-ink mb-2">{lang === "ar" ? "لا يوجد وكلاء منشورون بعد" : "No agents published yet"}</h3>
              <p className="text-sm font-semibold text-neutral-600 mb-5">
                {isOwnProfile
                  ? (lang === "ar" ? "ابدأ ببناء أول وكيل ذكي مخصص لك الآن." : "Create your first custom AI agent.")

            body: JSON.stringify(payload),

    function CreateAgentModal({ lang, onClose, onCreated, apiFetch }) {
      const [form, setForm] = useState({
        name: "",
        description: "",
        category: "General",
        rawPrompt: "",
        starter1: "",
        starter2: "",
        temperature: 0.4,
        isPublic: true,
      });
      const [pdfFile, setPdfFile] = useState(null);
      const [isDraggingPdf, setIsDraggingPdf] = useState(false);
      const [loading, setLoading] = useState(false);
      const [formError, setFormError] = useState("");
      const pdfInputRef = useRef(null);

      const isEducational = form.category === "Education";

      const formatFileSize = (bytes) => {
        if (!Number.isFinite(bytes) || bytes < 1024) return `${bytes || 0} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      };

      const clearPdfFile = () => {
        setPdfFile(null);
        if (pdfInputRef.current) pdfInputRef.current.value = "";
      };

      const handlePdfSelect = (file) => {
        if (!file || loading) return;
        const isPdfMime = file.type === "application/pdf";
        const isPdfExt = /\.pdf$/i.test(file.name || "");
        if (!isPdfMime && !(file.type === "" && isPdfExt)) {
          setFormError(getFriendlyError(new AppError("PDF_INVALID_TYPE", 400, "create_agent"), lang, "create_agent"));
          if (pdfInputRef.current) pdfInputRef.current.value = "";
          return;
        }
        if (file.size > MAX_PDF_SIZE_BYTES) {
          setFormError(getFriendlyError(new AppError("PDF_TOO_LARGE", 400, "create_agent"), lang, "create_agent"));
          if (pdfInputRef.current) pdfInputRef.current.value = "";
          return;
        }
        const normalizedFile = isPdfMime
          ? file
          : new File([file], file.name, { type: "application/pdf", lastModified: file.lastModified });
        setFormError("");
        setPdfFile(normalizedFile);
      };

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape" && !loading) onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose, loading]);

      const updateField = (key, value) => {
        if (formError) setFormError("");
        if (key === "category" && value !== "Education") {
          clearPdfFile();
        }
        setForm((prev) => ({ ...prev, [key]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormError("");
        setLoading(true);
        try {
          const starterPrompts = [form.starter1, form.starter2]
            .map((s) => s.trim())
            .filter(Boolean);

          const hasPdf = Boolean(isEducational && pdfFile);
          let requestBody;

          if (hasPdf) {
            const fd = new FormData();
            fd.append("name", form.name.trim());
            fd.append("description", form.description.trim());
            fd.append("category", form.category);
            fd.append("rawPrompt", form.rawPrompt.trim());
            fd.append("temperature", String(form.temperature));
            fd.append("enableWebSearch", "false");
            fd.append("isPublic", String(Boolean(form.isPublic)));
            fd.append("starterPrompts", JSON.stringify(starterPrompts));
            fd.append("pdfFile", pdfFile);
            requestBody = fd;
          } else {
            requestBody = JSON.stringify({
              name: form.name.trim(),
              description: form.description.trim(),
              category: form.category,
              rawPrompt: form.rawPrompt.trim(),
              temperature: Number(form.temperature),
              enableWebSearch: false,
              isPublic: form.isPublic,
              starterPrompts,
            });
          }

          const res = await apiFetch("/api/agents", {
            method: "POST",
            timeoutMs: hasPdf ? BUILD_AGENT_PDF_TIMEOUT_MS : BUILD_AGENT_TIMEOUT_MS,
            body: requestBody,
          }, "create_agent");

          onCreated(res.data);
        } catch (err) {
          setFormError(getFriendlyError(err, lang, "create_agent"));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget && !loading) onClose(); }}
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 glass-backdrop overflow-y-auto"
        >
          <div className="nb-box-lg animate-pop w-full max-w-xl bg-paper p-5 sm:p-7 my-auto max-h-[92dvh] overflow-y-auto">
            <div className="flex items-center justify-between pb-4 mb-5 border-b-2 border-line">
              <div className="flex items-center gap-2.5">
                <span className="p-2 bg-brandYellow border-2 border-line shadow-sm">
                  <Icon name="sparkles" className="w-5 h-5" />
                </span>
                <div>
                  <h2 className="text-lg sm:text-xl font-extrabold text-ink">{lang === "ar" ? "إنشاء وكيل ذكاء اصطناعي" : "Create an AI Agent"}</h2>
                  <p className="text-xs font-bold text-neutral-600">
                    {lang === "ar" ? "سيتم تحويل تعليماتك تلقائياً إلى Hybrid XML احترافي" : "Your instructions will be structured as professional Hybrid XML"}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                disabled={loading}
                aria-label={lang === "ar" ? "إغلاق" : "Close"}
                className="nb-btn p-1.5 bg-paper text-ink"
              >
                <Icon name="close" className="w-4 h-4" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "اسم الوكيل" : "Agent name"}</label>
                  <input
                    type="text"
                    required
                    maxLength={100}
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: مدرس بايثون العربي" : "e.g. Python Tutor"}
                    value={form.name}
                    onChange={(e) => updateField("name", e.target.value)}
                    className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "التصنيف" : "Category"}</label>
                  <select
                    value={form.category}
                    onChange={(e) => updateField("category", e.target.value)}
                    className="nb-input w-full px-3 py-2.5 text-sm font-bold"
                  >
                    {CATEGORIES.filter((c) => c.id !== "All").map((cat) => (
                      <option key={cat.id} value={cat.id}>{lang === "ar" ? cat.ar : cat.en}</option>
                    ))}

                </div>
              </div>

              <div>
                <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "وصف مختصر" : "Short description"}</label>
                <input
                  type="text"
                  required
                  maxLength={400}
                  dir="auto"
                  placeholder={lang === "ar" ? "ماذا يقدم هذا الوكيل للمستخدم؟" : "What does your agent help people do?"}
                  value={form.description}
                  onChange={(e) => updateField("description", e.target.value)}
                  className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                />
              </div>

              <div>
                <label className="block text-xs font-extrabold text-ink mb-1">
                  {lang === "ar" ? "التعليمات والفكرة (Raw Prompt — بالعربي أو الإنجليزي)" : "Instructions (Raw Prompt — Arabic or English)"}
                </label>
                <textarea
                  rows="4"
                  required
                  maxLength={8000}
                  dir="auto"
                  placeholder={isEducational
                    ? (lang === "ar" ? "اشرح دور المعلم، أسلوبه في التبسيط والتقييم، وكيف يستفيد من المنهج المرفق..." : "Describe the tutor's role, teaching style, and how to guide learners through the material...")
                    : (lang === "ar" ? "اشرح دور الوكيل، أسلوبه في الشرح أو العمل، والقواعد التي يجب أن يلتزم بها..." : "Describe the agent’s role, tone, goals and guidelines...")}
                  value={form.rawPrompt}
                  onChange={(e) => updateField("rawPrompt", e.target.value)}
                  className="nb-input w-full px-3.5 py-2.5 text-sm font-bold leading-relaxed"
                />
              </div>

              {isEducational && (
                <div>
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    <label className="block text-xs font-extrabold text-ink">
                      {lang === "ar" ? "ملف المنهج أو المرجع (PDF — اختياري)" : "Reference PDF / Curriculum (Optional)"}
                    </label>
                    <span className="px-2 py-0.5 bg-sageMist border border-line text-[10px] font-extrabold text-ink">
                      {lang === "ar" ? "للتعليم فقط • حتى 50MB" : "Education only • Max 50MB"}
                    </span>
                  </div>

                  <input
                    ref={pdfInputRef}
                    type="file"
                    accept=".pdf,application/pdf"
                    disabled={loading}
                    onChange={(e) => handlePdfSelect(e.target.files?.[0])}
                    className="hidden"
                  />

                  {!pdfFile ? (
                    <div
                      role="button"
                      tabIndex={loading ? -1 : 0}
                      aria-label={lang === "ar" ? "اختيار أو سحب ملف PDF" : "Choose or drag a PDF file"}
                      onClick={() => { if (!loading) pdfInputRef.current?.click(); }}
                      onKeyDown={(e) => {
                        if (!loading && (e.key === "Enter" || e.key === " ")) {
                          e.preventDefault();
                          pdfInputRef.current?.click();
                        }
                      }}
                      onDragOver={(e) => {
                        e.preventDefault();
                        if (!loading) setIsDraggingPdf(true);
                      }}
                      onDragLeave={(e) => {
                        e.preventDefault();
                        setIsDraggingPdf(false);
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        setIsDraggingPdf(false);
                        if (!loading) handlePdfSelect(e.dataTransfer?.files?.[0]);
                      }}
                      className={`nb-box-sm p-4 border-2 border-dashed transition-colors cursor-pointer flex items-center gap-3 ${
                        isDraggingPdf
                          ? "bg-brandYellow/50 border-brandBlue"
                          : "bg-cream/70 hover:bg-cream border-line"
                      } ${loading ? "opacity-50 pointer-events-none" : ""}`}
                    >
                      <span className="w-10 h-10 flex-shrink-0 bg-brandYellow border border-line rounded-xl flex items-center justify-center text-ink">
                        <Icon name="upload" className="w-5 h-5" />
                      </span>
                      <div className="min-w-0 flex-1">
                        <p className="text-xs sm:text-sm font-extrabold text-ink">
                          {lang === "ar" ? "اسحب ملف PDF هنا أو اضغط للاختيار" : "Drag & drop a PDF here, or click to browse"}
                        </p>
                        <p className="text-[11px] font-semibold text-neutral-600 mt-0.5 leading-relaxed">
                          {lang === "ar"
                            ? "سيستخرج مهندس الأوامر فصول المنهج ومفاهيمه تلقائياً ليدرّس الوكيل منه بدقة."
                            : "Our Prompt Architect extracts chapters & key concepts so your tutor teaches strictly from it."}
                        </p>
                      </div>
                    </div>
                  ) : (
                    <div className="nb-box-sm p-3 bg-sageMist/60 border border-line flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3 min-w-0">
                        <span className="w-10 h-10 flex-shrink-0 bg-paper border border-line rounded-xl flex items-center justify-center text-brandBlue">
                          <Icon name="file" className="w-5 h-5" />
                        </span>
                        <div className="min-w-0">
                          <p className="text-xs sm:text-sm font-extrabold text-ink truncate" dir="auto">
                            {pdfFile.name}
                          </p>
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className="text-[11px] font-mono font-bold text-neutral-600" dir="ltr">
                              {formatFileSize(pdfFile.size)}
                            </span>
                            <span className="px-1.5 py-0.5 bg-paper border border-line text-[10px] font-extrabold text-brandBlue">
                              {lang === "ar" ? "PDF جاهز" : "PDF Ready"}
                            </span>
                          </div>
                        </div>
                      </div>
                      <button
                        type="button"
                        disabled={loading}
                        onClick={clearPdfFile}
                        aria-label={lang === "ar" ? "إزالة ملف PDF" : "Remove PDF file"}
                        title={lang === "ar" ? "إزالة الملف" : "Remove file"}
                        className="nb-btn p-2 bg-paper hover:bg-rose-50 text-ink hover:text-rose-600 disabled:opacity-40 flex-shrink-0"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  )}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "سؤال مقترح 1 (اختياري)" : "Starter prompt 1 (optional)"}</label>
                  <input
                    type="text"
                    maxLength={200}
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: ابدأ معي من الصفر" : "e.g. Teach me from scratch"}
                    value={form.starter1}
                    onChange={(e) => updateField("starter1", e.target.value)}
                    className="nb-input w-full px-3 py-2 text-xs font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "سؤال مقترح 2 (اختياري)" : "Starter prompt 2 (optional)"}</label>
                  <input
                    type="text"
                    maxLength={200}
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: اختبر مستواي وصمم لي خطة" : "e.g. Assess my level and make a plan"}
                    value={form.starter2}
                    onChange={(e) => updateField("starter2", e.target.value)}
                    className="nb-input w-full px-3 py-2 text-xs font-bold"
                  />
                </div>
              </div>

              <div className="nb-box p-4 space-y-4">
                <div>
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="font-extrabold text-ink">{lang === "ar" ? "درجة الإبداع (Temperature)" : "Creativity (Temperature)"}</span>
                    <div className="flex items-center gap-1.5">
                      {[
                        { label: lang === "ar" ? "دقيق" : "Precise", val: 0.2 },
                        { label: lang === "ar" ? "متوازن" : "Balanced", val: 0.5 },
                        { label: lang === "ar" ? "إبداعي" : "Creative", val: 1.0 },
                      ].map((preset) => (
                        <button
                          key={preset.label}
                          type="button"
                          onClick={() => updateField("temperature", preset.val)}
                          className={`px-2 py-0.5 border border-line text-[10px] font-extrabold ${
                            Number(form.temperature) === preset.val
                              ? "bg-brandYellow text-ink"
                              : "bg-paper text-neutral-700"
                          }`}
                        >
                          {preset.label}
                        </button>
                      ))}
                      <span className="font-mono font-extrabold text-brandBlue mr-1">{form.temperature}</span>
                    </div>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1.5"
                    step="0.1"
                    value={form.temperature}
                    onChange={(e) => updateField("temperature", e.target.value)}
                    className="w-full accent-ink cursor-pointer"
                  />
                </div>

                <div className="pt-3 border-t border-line">
                  <span className="block text-xs font-extrabold text-ink mb-2">
                    {lang === "ar" ? "الخصوصية وظهور الوكيل" : "Agent Visibility"}
                  </span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      disabled={loading}
                      onClick={() => updateField("isPublic", true)}
                      className={`p-2.5 text-start border rounded-xl transition-colors ${
                        form.isPublic
                          ? "bg-sageMist border-brandBlue shadow-sm"
                          : "bg-paper border-line hover:bg-cream"
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs font-extrabold text-ink">
                          {lang === "ar" ? "عام (Public)" : "Public"}
                        </span>
                        <Icon name="globe" className="w-3.5 h-3.5 text-brandBlue" />
                      </div>
                      <p className="text-[11px] font-semibold text-neutral-600 mt-0.5">
                        {lang === "ar" ? "يظهر في المكتبة ويمكن مشاركته مع الجميع." : "Listed in the catalog and shareable."}
                      </p>
                    </button>

                    <button
                      type="button"
                      disabled={loading}
                      onClick={() => updateField("isPublic", false)}
                      className={`p-2.5 text-start border rounded-xl transition-colors ${
                        !form.isPublic
                          ? "bg-brandYellow/60 border-brandBlue shadow-sm"
                          : "bg-paper border-line hover:bg-cream"
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs font-extrabold text-ink">
                          {lang === "ar" ? "خاص (Private)" : "Private"}
                        </span>
                        <Icon name="lock" className="w-3.5 h-3.5 text-ink" />
                      </div>
                      <p className="text-[11px] font-semibold text-neutral-600 mt-0.5">
                        {lang === "ar" ? "يظهر في حسابك فقط ولا يُنشر للعامة." : "Only visible and accessible in your account."}
                      </p>
                    </button>
                  </div>
                </div>
              </div>

              {/* Visible inline error directly inside the create-agent form */}
              <InlineAlert message={formError} />

              <button
                type="submit"
                disabled={loading}
                className="nb-btn w-full py-3 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-50 text-white font-extrabold text-sm flex items-center justify-center gap-2"
              >
                {loading ? (
                  <React.Fragment>
                    <span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin" />
                    <span>
                      {isEducational && pdfFile
                        ? (lang === "ar" ? "جاري تحليل ملف PDF وهندسة الوكيل..." : "Analyzing PDF & building your agent...")
                        : (lang === "ar" ? "جاري هندسة البرومبت وحفظ الوكيل..." : "Building and saving your agent...")}
                    </span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <Icon name="sparkles" className="w-4 h-4" />
                    <span>
                      {form.isPublic
                        ? (lang === "ar" ? "هندسة ونشر الوكيل" : "Build & publish agent")
                        : (lang === "ar" ? "هندسة وحفظ الوكيل الخاص" : "Build & save private agent")}
                    </span>
                  </React.Fragment>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>

</html>
