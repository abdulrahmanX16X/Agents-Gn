<body class="antialiased selection:bg-brandYellow selection:text-ink">
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:sans-serif;">
      يرجى تفعيل JavaScript لتشغيل AgentTube. / Please enable JavaScript to run AgentTube.
    </div>
  </noscript>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // Production Config & Safe Utilities
    // ==========================================
    const API_BASE = "https://agents-377s.onrender.com";
    const REQUEST_TIMEOUT_MS = 25000;
    const BUILD_AGENT_TIMEOUT_MS = 65000;

    const safeStorage = {
      get(key, fallback = "") {
        try {
          const val = window.localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch {}
      },
      remove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch {}
      },
    };

    // Structured internal error — raw server errors are NEVER surfaced to users.
    class AppError extends Error {
      constructor(code, status = 0, context = "general") {
        super(code);
        this.name = "AppError";
        this.code = code;
        this.status = status;
        this.context = context;
      }
    }

    function classifyHttpError(status, rawErrorText, context) {
      const hint = String(rawErrorText || "");
      if (context === "auth_login" && (status === 400 || status === 401 || status === 404)) {
        return "INVALID_CREDENTIALS";
      }
      if (status === 401) return "SESSION_EXPIRED";
      if (status === 403) return "FORBIDDEN";
      if (status === 404) return "NOT_FOUND";
      if (status === 409) return "CONFLICT";
      if (status === 429) return "RATE_LIMITED";
      if (status === 400 || status === 422) {
        if (context === "auth_register" && /exist|duplicate|already|taken|مستخدم|مسجل/i.test(hint)) {
          return "CONFLICT";
        }
        return "VALIDATION_ERROR";
      }
      if (status === 200) {
        if (context === "auth_login") return "INVALID_CREDENTIALS";
        if (context === "auth_register" && /exist|duplicate|already|taken|مستخدم|مسجل/i.test(hint)) {
          return "CONFLICT";
        }
        if (context === "chat") return "CHAT_INTERRUPTED";
        return "SERVER_UNAVAILABLE";
      }
      if (status >= 500) return "SERVER_UNAVAILABLE";
      return "UNKNOWN_ERROR";
    }

    function getFriendlyError(error, lang = "ar", context = "general") {
      const isAr = lang === "ar";
      if (typeof navigator !== "undefined" && navigator.onLine === false) {
        return isAr
          ? "لا يوجد اتصال بالإنترنت. تحقق من الشبكة وحاول مرة أخرى."
          : "No internet connection. Please check your network and try again.";
      }

      const code = error instanceof AppError
        ? error.code
        : error?.name === "AbortError"
          ? "TIMEOUT"
          : "NETWORK_ERROR";

      const ctx = error instanceof AppError ? error.context : context;

      switch (code) {
        case "INVALID_CREDENTIALS":
          return isAr
            ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
            : "Incorrect email or password.";
        case "SESSION_EXPIRED":
          return isAr
            ? "انتهت صلاحية الجلسة. يرجى تسجيل الدخول مجدداً."
            : "Your session has expired. Please sign in again.";
        case "FORBIDDEN":
          return isAr
            ? "ليس لديك صلاحية لتنفيذ هذا الإجراء."
            : "You don't have permission to perform this action.";
        case "CONFLICT":
          return ctx === "auth_register"
            ? (isAr ? "البريد الإلكتروني أو اسم المستخدم مسجل مسبقاً." : "This email or username is already registered.")
            : (isAr ? "هذا العنصر موجود بالفعل." : "This item already exists.");
        case "NOT_FOUND":
          if (ctx === "open_agent") {

        case "VALIDATION_ERROR":

            return isAr

        case "RATE_LIMITED":

            : "Too many requests. Please wait a moment and try again.";
        case "TIMEOUT":

          <div
            aria-label={alt}
            className={`${className} flex items-center justify-center bg-brandYellow text-ink font-extrabold select-none`}
          >

        );
      }

      return (
        <img
          src={src}
          alt={alt}
          loading="lazy"
          decoding="async"
          onError={() => setFailed(true)}
          className={className}
        />
      );

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const syntaxAliases = {
      js: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript",
      py: "python", sh: "bash", shell: "bash", zsh: "bash",
      html: "xml", svg: "xml", yml: "yaml", md: "markdown",
      cs: "csharp", csharp: "csharp", cplusplus: "cpp", rb: "ruby"
    };

    function CodeSnippet({ code, language = "", lang = "ar" }) {
      const [copied, setCopied] = useState(false);
      const resetRef = useRef(null);
      useEffect(() => () => clearTimeout(resetRef.current), []);
      const normalized = (syntaxAliases[language.toLowerCase()] || language).toLowerCase();
      let highlighted = escapeHtml(code);
      let detected = normalized;

      if (window.hljs) {
        try {
          if (normalized && window.hljs.getLanguage(normalized)) {
            highlighted = window.hljs.highlight(code, { language: normalized, ignoreIllegals: true }).value;
          } else {
            const result = window.hljs.highlightAuto(code);
            highlighted = result.value;
            detected = result.language || normalized || "text";
          }
        } catch {
          highlighted = escapeHtml(code);
        }
      }

      const copyCode = async () => {
        try {
          await navigator.clipboard.writeText(code);
          setCopied(true);
          clearTimeout(resetRef.current);
          resetRef.current = setTimeout(() => setCopied(false), 2000);
        } catch {}
      };

      return (
        <div className="code-window" dir="ltr">
          <div className="code-titlebar flex items-center justify-between gap-3 px-3.5 py-2">
            <div className="flex items-center gap-2.5 min-w-0">

              </span>
              <span className="font-mono text-[11px] font-bold text-brandYellow truncate uppercase tracking-wider">
                {language || detected || "code"}
              </span>
            </div>
            <button
              type="button"
              onClick={copyCode}
              className="flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-bold text-ink bg-brandYellow hover:bg-yellow-300 border border-line transition-colors"
            >

            </button>
          </div>
          <pre><code className="hljs" dangerouslySetInnerHTML={{ __html: highlighted }} /></pre>
        </div>
      );
    }

    function extractMathExpressions(source) {
      const codeSegments = [];
      const mathSegments = [];
      let prepared = source.replace(/(`+)([\s\S]*?)\1/g, (raw) => {
        const key = `AGENTTUBECODESEGMENT${codeSegments.length}END`;
        codeSegments.push(raw);
        return key;
      });

      const addMath = (original, latex, display) => {
        const key = `AGENTTUBEMATHSEGMENT${mathSegments.length}END`;
        mathSegments.push({ key, original, latex, display });
        return display ? `\n\n${key}\n\n` : key;
      };

      prepared = prepared.replace(/\\\[([\s\S]*?)\\\]/g,
        (original, latex) => addMath(original, latex, true));
      prepared = prepared.replace(/\$\$([\s\S]*?)\$\$/g,
        (original, latex) => addMath(original, latex, true));
      prepared = prepared.replace(/\\\(([\s\S]*?)\\\)/g,
        (original, latex) => addMath(original, latex, false));
      prepared = prepared.replace(/(^|[^\$])\$([^\n$]+?)\$/g, (original, prefix, latex) => {
        if (!latex.trim() || /^\s|\s$/.test(latex)) return original;
        return prefix + addMath(original.slice(prefix.length), latex, false);
      });
      prepared = prepared.replace(/AGENTTUBECODESEGMENT(\d+)END/g,
        (match, index) => codeSegments[Number(index)] ?? match);
      return { prepared, mathSegments };
    }

    function mathToHtml(expression) {
      const { latex, display, original } = expression;
      if (!window.katex) {
        return `<span class="math-fallback" dir="ltr">${escapeHtml(original)}</span>`;
      }
      try {
        const result = window.katex.renderToString(latex.trim(), {
          displayMode: display,
          throwOnError: false,
          trust: false,
          strict: "ignore",
          output: "htmlAndMathml",
          maxExpand: 1000
        });
        return `<span class="${display ? "math-display-content" : "math-inline"}" dir="ltr">${result}</span>`;
      } catch {
        return `<span class="math-fallback" dir="ltr">${escapeHtml(original)}</span>`;
      }
    }

    function renderMarkdownWithMath(source) {
      const { prepared, mathSegments } = extractMathExpressions(source);
      let html;
      if (window.marked && window.DOMPurify) {
        try {
          ensurePurifyHook();
          const renderer = new window.marked.Renderer();
          renderer.html = (token) => escapeHtml(typeof token === "string" ? token : token.text || "");
          html = window.DOMPurify.sanitize(window.marked.parse(prepared, {
            gfm: true, breaks: true, renderer
          }));
          html = html.replace(/<table>/g, '<div class="table-scroll"><table>')
                     .replace(/<\/table>/g, '</table></div>');
        } catch {
          html = "<p>" + escapeHtml(prepared).replace(/\n/g, "<br>") + "</p>";
        }
      } else {
        html = "<p>" + escapeHtml(prepared).replace(/\n/g, "<br>") + "</p>";
      }

      for (const expression of mathSegments) {
        const mathHtml = mathToHtml(expression);
        if (expression.display) {
          const wrapper = `<div class="math-block" dir="ltr">${mathHtml}</div>`;
          const paragraph = new RegExp(`<p(?:\\s+[^>]*)?>\\s*${expression.key}\\s*</p>`, "g");
          html = html.replace(paragraph, () => wrapper);
          html = html.split(expression.key).join(wrapper);
        } else {
          html = html.split(expression.key).join(mathHtml);
        }
      }
      html = html.replace(/<(p|li|h[1-6]|blockquote|th|td)(?=[\s>])/g, '<$1 dir="auto"');
      return html;
    }

    function MarkdownPart({ source }) {
      const html = React.useMemo(() => source ? renderMarkdownWithMath(source) : "", [source]);
      if (!source) return null;
      return <div className="chat-rich" dir="auto" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    const FormattedMessage = ({ text, uiLang = "ar" }) => {
      if (!text) return null;
      if (!text.includes("```") && /^\s*<(?:\?xml\b|[A-Za-z][\w:-]*[\s>])/.test(text)
        && /<\/[A-Za-z][\w:-]*>/.test(text)) {
        return <CodeSnippet code="{text.trim()}" lang="{uiLang}" language="xml"/>;
      }
      const parts = text.split(/(```[\s\S]*?(?:```|$))/g).filter(Boolean);
      return (
        <div className="min-w-0 text-[14.5px] sm:text-[15px] leading-relaxed" dir="auto">
          {parts.map((part, index) => {
            if (part.startsWith("```")) {
              const inner = part.slice(3).replace(/```$/, "");
              const newline = inner.indexOf("\n");
              const header = newline === -1 ? inner.trim() : inner.slice(0, newline).trim();
              const validLanguage = /^[a-zA-Z][a-zA-Z0-9_+.#-]{0,24}$/.test(header);
              const lang = validLanguage ? header : "";
              const code = validLanguage && newline >= 0 ? inner.slice(newline + 1).replace(/\n$/, "")
                : newline === -1 && validLanguage ? "" : inner.replace(/^\n/, "").replace(/\n$/, "");
              return <CodeSnippet key={index} code={code} language={lang} lang={uiLang} />;
            }
            return <MarkdownPart key={index} source={part} />;
          })}
        </div>
      );
    };

    const getAccountId = (value) => {
      if (!value) return "";

    const isAgentOwnedBy = (agent, account) => {
      if (!agent || !account) return false;
      const owner = agent.creator || agent.createdBy || agent.owner;
      const accountId = getAccountId(account);
      const ownerId = getAccountId(owner) || getAccountId(agent.creatorId);
      if (accountId && ownerId && accountId === ownerId) return true;
      if (!owner || typeof owner !== "object") return false;
      const nameA = String(owner.username || "").trim().toLowerCase();
      const nameB = String(account.username || "").trim().toLowerCase();
      return Boolean(nameA && nameB && nameA === nameB);
    };

      // Server Boot / Wake-Up State
      const MAX_WAKE_ATTEMPTS = 3;
      const [serverStatus, setServerStatus] = useState("checking"); // "checking" | "waking" | "ready" | "offline"
      const [wakeAttempt, setWakeAttempt] = useState(1);
      const [wakeSeconds, setWakeSeconds] = useState(0);
      const [bootTrigger, setBootTrigger] = useState(0);
      const hasBootedRef = useRef(false);
      const isFirstReadyRef = useRef(true);

      // Profile State
      const [profileAgents, setProfileAgents] = useState([]);
      const [profileLoading, setProfileLoading] = useState(false);
      const [profileError, setProfileError] = useState("");

      // Chat & Memory State
      const [activeAgent, setActiveAgent] = useState(null);
      const [agentMemory, setAgentMemory] = useState("");
      const [showMemoryModal, setShowMemoryModal] = useState(false);
      const [memoryError, setMemoryError] = useState("");
      const [clearingMemory, setClearingMemory] = useState(false);
      const [conversations, setConversations] = useState([]);
      const [activeConversationId, setActiveConversationId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState("");
      const [sendingMessage, setSendingMessage] = useState(false);
      const [loadingMessages, setLoadingMessages] = useState(false);

      const chatContainerRef = useRef(null);
      const textareaRef = useRef(null);
      const catalogRef = useRef(null);
      const howItWorksRef = useRef(null);
      const faqRef = useRef(null);
      const toastTimerRef = useRef(null);
      const agentsAbortRef = useRef(null);
      const streamAbortRef = useRef(null);
      const userCancelledStreamRef = useRef(false);

      const notify = useCallback((msg, type = "info") => {
        if (!msg) return;
        clearTimeout(toastTimerRef.current);
        setToast({ msg, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 4000);
      }, []);

      useEffect(() => {
        return () => {
          clearTimeout(toastTimerRef.current);
          agentsAbortRef.current?.abort();
          streamAbortRef.current?.abort();
        };
      }, []);

      const abortActiveStream = useCallback(() => {
        if (streamAbortRef.current) {
          userCancelledStreamRef.current = true;
          streamAbortRef.current.abort();
          streamAbortRef.current = null;
        }
      }, []);

      // Sync HTML direction
      useEffect(() => {
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.lang = lang;
        document.title = lang === "ar" ? "AgentTube — منصة وكلاء الذكاء الاصطناعي" : "AgentTube — AI Agent Studio";
        safeStorage.set("agenttube_lang", lang);
      }, [lang]);

      // Lock document viewport when in chat mode
      useEffect(() => {
        const isChat = view === "chat";
        document.documentElement.classList.toggle("chat-locked", isChat);
        if (!isChat) abortActiveStream();
        return () => document.documentElement.classList.remove("chat-locked");
      }, [view, abortActiveStream]);

      useEffect(() => {
        if (!showMobileHistory) return;
        const onKeyDown = (event) => {
          if (event.key === "Escape") setShowMobileHistory(false);
        };
        document.addEventListener("keydown", onKeyDown);
        return () => document.removeEventListener("keydown", onKeyDown);
      }, [showMobileHistory]);

      // Auto-resize chat textarea
      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 140) + "px";
      }, [inputMessage]);

      const clearSession = useCallback(() => {
        safeStorage.remove("agenttube_token");
        setToken("");
        setUser(null);
        setConversations([]);
        setAgentMemory("");
      }, []);

      // Centralized production API client — never leaks server errors or stack traces
      const apiFetch = useCallback(async (endpoint, options = {}, context = "general") => {
        const { timeoutMs = REQUEST_TIMEOUT_MS, signal: externalSignal, headers: extraHeaders, ...fetchOptions } = options;

        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          throw new AppError("NETWORK_ERROR", 0, context);
        }

        const controller = new AbortController();
        let timedOut = false;

        const onExternalAbort = () => controller.abort();
        if (externalSignal) {
          if (externalSignal.aborted) {
            const abortErr = new Error("Aborted");
            abortErr.name = "AbortError";
            throw abortErr;
          }
          externalSignal.addEventListener("abort", onExternalAbort, { once: true });
        }

        const timeoutId = setTimeout(() => {
          timedOut = true;
          controller.abort();
        }, timeoutMs);

        try {
          const headers = {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(extraHeaders || {}),
          };

          const res = await fetch(`${API_BASE}${endpoint}`, {
            ...fetchOptions,
            headers,
            signal: controller.signal,
          });

          let data = null;
          try {
            data = await res.json();
          } catch {
            data = null;
          }

          if (!res.ok || (data && data.success === false)) {
            if (res.status === 401 && token && context !== "auth_login") {
              clearSession();
            }
            const code = classifyHttpError(res.status, data?.error, context);
            throw new AppError(code, res.status, context);
          }

          if (!data || typeof data !== "object") {
            throw new AppError("SERVER_UNAVAILABLE", res.status, context);
          }

          return data;
        } catch (err) {
          if (err instanceof AppError) throw err;
          if (err?.name === "AbortError") {
            if (timedOut) throw new AppError("TIMEOUT", 408, context);
            throw err;
          }
          throw new AppError("NETWORK_ERROR", 0, context);
        } finally {
          clearTimeout(timeoutId);
          if (externalSignal) {
            externalSignal.removeEventListener("abort", onExternalAbort);
          }
        }
      }, [token, clearSession]);

      // Initial Server Wake-Up & Boot Check
      useEffect(() => {
        if (hasBootedRef.current) return;

        let cancelled = false;
        const controller = new AbortController();
        let retryTimeout = null;

        setServerStatus("checking");
        setWakeAttempt(1);
        setWakeSeconds(0);

        const timer = setInterval(() => {
          setWakeSeconds((prev) => {
            const next = prev + 1;
            if (next >= 3) {
              setServerStatus((curr) => (curr === "checking" ? "waking" : curr));
            }
            return next;
          });
        }, 1000);

        const wakeServer = async () => {
          if (typeof navigator !== "undefined" && navigator.onLine === false) {
            setServerStatus("offline");
            setLoadingAgents(false);
            clearInterval(timer);
            return;
          }

          for (let attempt = 1; attempt <= MAX_WAKE_ATTEMPTS; attempt++) {
            if (cancelled) return;
            setWakeAttempt(attempt);

            try {
              const res = await apiFetch(
                "/api/agents",
                { signal: controller.signal, timeoutMs: REQUEST_TIMEOUT_MS },
                "load_agents"
              );
              if (cancelled) return;

              hasBootedRef.current = true;
              setAgents(Array.isArray(res.data) ? res.data : []);
              setAgentsLoadFailed(false);
              setLoadingAgents(false);
              setServerStatus("ready");
              clearInterval(timer);
              return;
            } catch (err) {
              if (cancelled || (err?.name === "AbortError" && !(err instanceof AppError))) return;

              if (attempt < MAX_WAKE_ATTEMPTS) {
                setServerStatus("waking");
                await new Promise((resolve) => {
                  retryTimeout = setTimeout(resolve, 3000);
                });
              } else {
                setServerStatus("offline");
                setAgentsLoadFailed(true);
                setLoadingAgents(false);
                clearInterval(timer);
              }
            }
          }
        };

        wakeServer();

        return () => {
          cancelled = true;
          controller.abort();
          clearInterval(timer);
          clearTimeout(retryTimeout);
        };
      }, [bootTrigger, apiFetch]);

      // 1. Fetch Current User (once server wakes up)
      useEffect(() => {
        if (!token || serverStatus !== "ready") {
          if (!token) setUser(null);
          return;
        }
        let cancelled = false;
        apiFetch("/api/auth/me", {}, "auth_me")
          .then((res) => {
            if (!cancelled) setUser(res.data || null);
          })
          .catch((err) => {
            if (cancelled) return;
            if (err instanceof AppError && err.status === 401) {
              clearSession();
            }
          });
        return () => { cancelled = true; };
      }, [token, serverStatus, apiFetch, clearSession]);

      // 2. Fetch Agents (on category/search change after initial boot)
      const fetchAgents = useCallback(async () => {
        agentsAbortRef.current?.abort();
        const controller = new AbortController();
        agentsAbortRef.current = controller;

        setLoadingAgents(true);
        setAgentsLoadFailed(false);
        try {
          const params = new URLSearchParams();
          if (selectedCategory !== "All") params.append("category", selectedCategory);
          if (searchQuery.trim()) params.append("search", searchQuery.trim());
          const res = await apiFetch(
            `/api/agents?${params.toString()}`,
            { signal: controller.signal },
            "load_agents"
          );
          if (controller.signal.aborted) return;
          setAgents(Array.isArray(res.data) ? res.data : []);
        } catch (err) {
          if (err?.name === "AbortError" && !(err instanceof AppError)) return;
          setAgentsLoadFailed(true);
          notify(getFriendlyError(err, lang, "load_agents"), "error");
        } finally {
          if (!controller.signal.aborted) {
            setLoadingAgents(false);
          }
        }
      }, [selectedCategory, searchQuery, apiFetch, lang, notify]);

      useEffect(() => {
        if (serverStatus !== "ready") return;
        if (isFirstReadyRef.current) {
          isFirstReadyRef.current = false;
          return;
        }
        const timer = setTimeout(fetchAgents, 250);
        return () => clearTimeout(timer);
      }, [serverStatus, fetchAgents]);

      const loadProfileAgents = async (account) => {
        setProfileLoading(true);
        setProfileError("");
        try {
          const res = await apiFetch("/api/agents?limit=50", {}, "load_agents");
          const list = Array.isArray(res.data) ? res.data
            : (Array.isArray(res.data?.agents) ? res.data.agents : []);
          setProfileAgents(list.filter((agent) => isAgentOwnedBy(agent, account)));
        } catch (err) {
          setProfileError(getFriendlyError(err, lang, "load_agents"));
        } finally {
          setProfileLoading(false);
        }
      };

      const openProfile = () => {
        if (!token || !user) {
          setAuthMode("login");
          setShowAuthModal(true);
          return;
        }
        setView("profile");
        loadProfileAgents(user);
      };

      const scrollToSection = (ref) => {
        if (view !== "explore") {
          setView("explore");
          setTimeout(() => ref.current?.scrollIntoView({ behavior: "smooth" }), 100);
        } else {
          ref.current?.scrollIntoView({ behavior: "smooth" });
        }
      };

      // 3. Smooth non-blocking auto-scroll for chat messages
      const scrollToBottom = (smooth = true) => {
        const el = chatContainerRef.current;
        if (!el) return;
        el.scrollTo({
          top: el.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      };

      useEffect(() => {
        const el = chatContainerRef.current;
        if (!el) return;
        if (sendingMessage) {
          const distanceFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
          if (distanceFromBottom < 180) {
            el.scrollTop = el.scrollHeight;
          }
        } else {
          scrollToBottom(true);
        }
      }, [messages, sendingMessage]);

      // Fetch Agent Memory
      const fetchAgentMemory = async (slug) => {
        if (!token || !slug) {
          setAgentMemory("");
          return;
        }
        try {
          const memRes = await apiFetch(`/api/agents/${encodeURIComponent(slug)}/memory`, {}, "memory");
          setAgentMemory(memRes.data?.summary || "");
        } catch {
          setAgentMemory("");
        }
      };

      const handleClearAgentMemory = async () => {
        if (!activeAgent || !token || clearingMemory) return;
        setClearingMemory(true);
        setMemoryError("");
        try {
          await apiFetch(`/api/agents/${encodeURIComponent(activeAgent.slug)}/memory`, { method: "DELETE" }, "memory");
          setAgentMemory("");
          setShowMemoryModal(false);
          notify(lang === "ar" ? "تم تصفير ذاكرة التقدم بنجاح" : "Progress memory cleared", "success");
        } catch (err) {
          setMemoryError(getFriendlyError(err, lang, "memory"));
        } finally {
          setClearingMemory(false);
        }
      };

      // Open Agent Chat Workspace
      const openAgentWorkspace = async (slug) => {
        abortActiveStream();
        try {
          const res = await apiFetch(`/api/agents/${encodeURIComponent(slug)}`, {}, "open_agent");
          const agentData = res.data;
          if (!agentData) throw new AppError("NOT_FOUND", 404, "open_agent");

          setActiveAgent(agentData);
          setShowMobileHistory(false);
          setActiveConversationId(null);
          setMessages([]);
          setView("chat");

          if (token) {
            const [convResult] = await Promise.allSettled([
              apiFetch(`/api/conversations?agentId=${encodeURIComponent(agentData._id)}`, {}, "load_chat"),
              fetchAgentMemory(slug),
            ]);
            setConversations(
              convResult.status === "fulfilled" && Array.isArray(convResult.value?.data)
                ? convResult.value.data
                : []
            );
          } else {
            setConversations([]);
            setAgentMemory("");
          }
        } catch (err) {
          notify(getFriendlyError(err, lang, "open_agent"), "error");
        }
      };

      // Load specific conversation
      const selectConversation = async (convId) => {
        abortActiveStream();
        setActiveConversationId(convId);
        setShowMobileHistory(false);
        setLoadingMessages(true);
        try {
          const res = await apiFetch(`/api/conversations/${encodeURIComponent(convId)}/messages`, {}, "load_chat");
          setMessages(Array.isArray(res.data) ? res.data : []);
          requestAnimationFrame(() => scrollToBottom(false));
        } catch (err) {
          notify(getFriendlyError(err, lang, "load_chat"), "error");
        } finally {
          setLoadingMessages(false);
        }
      };

      // Delete conversation
      const handleDeleteConversation = async (e, convId) => {
        e.stopPropagation();
        try {
          await apiFetch(`/api/conversations/${encodeURIComponent(convId)}`, { method: "DELETE" }, "load_chat");
          setConversations((prev) => prev.filter((c) => c._id !== convId));
          if (activeConversationId === convId) {
            abortActiveStream();
            setActiveConversationId(null);
            setMessages([]);
          }
          notify(lang === "ar" ? "تم حذف المحادثة" : "Conversation deleted", "success");
        } catch (err) {
          notify(getFriendlyError(err, lang, "load_chat"), "error");
        }
      };

      // Send Chat Message (SSE Streaming)
      const handleSendMessage = async (textOverride) => {
        const textToSend = (textOverride ?? inputMessage).trim();
        if (!textToSend || sendingMessage || !activeAgent) return;

        if (!token) {
          notify(lang === "ar" ? "سجّل الدخول أولاً لبدء المحادثة" : "Please sign in to start chatting", "error");
          setAuthMode("login");
          setShowAuthModal(true);
          return;
        }

        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          notify(getFriendlyError(new AppError("NETWORK_ERROR", 0, "chat"), lang, "chat"), "error");
          return;
        }

        const tempUserId = `u_${Date.now()}`;
        const tempModelId = `m_${Date.now() + 1}`;

        const tempUserMsg = { _id: tempUserId, role: "user", text: textToSend };
        const tempModelMsg = { _id: tempModelId, role: "model", text: "" };

        setMessages((prev) => [...prev, tempUserMsg, tempModelMsg]);
        if (!textOverride) {
          setInputMessage("");
          if (textareaRef.current) textareaRef.current.style.height = "auto";
        }
        setSendingMessage(true);
        requestAnimationFrame(() => scrollToBottom(true));

        const controller = new AbortController();
        streamAbortRef.current = controller;
        userCancelledStreamRef.current = false;

        let receivedDone = false;
        let receivedAnyChunk = false;

        try {
          const response = await fetch(`${API_BASE}/api/agents/${encodeURIComponent(activeAgent.slug)}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              message: textToSend,
              conversationId: activeConversationId,
            }),
            signal: controller.signal,
          });

          if (!response.ok) {
            let errData = null;
            try {
              errData = await response.json();
            } catch {
              errData = null;
            }
            if (response.status === 401) {
              clearSession();
              setAuthMode("login");
              setShowAuthModal(true);
            }
            const code = classifyHttpError(response.status, errData?.error, "chat");
            throw new AppError(code, response.status, "chat");
          }

          if (!response.body || typeof response.body.getReader !== "function") {
            throw new AppError("CHAT_INTERRUPTED", 500, "chat");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";

            for (const part of parts) {
              const line = part.trim();
              if (!line.startsWith("data:")) continue;

              const jsonStr = line.replace(/^data:\s*/, "");
              if (!jsonStr || jsonStr === "[DONE]") continue;

              let data;
              try {
                data = JSON.parse(jsonStr);
              } catch {
                continue;
              }

              if (data.error) {
                const isRate = /rate|quota|limit|429/i.test(String(data.error));
                throw new AppError(isRate ? "RATE_LIMITED" : "CHAT_INTERRUPTED", isRate ? 429 : 500, "chat");
              }

              if (data.chunk) {
                receivedAnyChunk = true;
                setMessages((prev) =>
                  prev.map((msg) =>
                    msg._id === tempModelId
                      ? { ...msg, text: msg.text + data.chunk }
                      : msg
                  )
                );
              }

              if (data.done) {
                receivedDone = true;
                if (Array.isArray(data.messages)) {
                  setMessages((prev) => [
                    ...prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId),
                    ...data.messages,
                  ]);
                }

                if (!activeConversationId && data.conversationId) {
                  setActiveConversationId(data.conversationId);
                  setConversations((prev) => [
                    {
                      _id: data.conversationId,
                      title: data.title,
                      agent: activeAgent,
                      updatedAt: new Date().toISOString(),
                    },
                    ...prev,
                  ]);
                }

                const currentSlug = activeAgent.slug;
                setTimeout(() => fetchAgentMemory(currentSlug), 1800);
              }
            }
          }

          if (!receivedDone && !receivedAnyChunk) {
            throw new AppError("CHAT_INTERRUPTED", 500, "chat");
          }
        } catch (err) {
          if (userCancelledStreamRef.current) return;
          notify(getFriendlyError(err, lang, "chat"), "error");
          if (!receivedAnyChunk) {
            setMessages((prev) =>
              prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId)
            );
            if (!textOverride) {
              setInputMessage(textToSend);
            }
          } else {
            setMessages((prev) =>
              prev.filter((m) => !(m._id === tempModelId && !m.text))
            );
          }
        } finally {
          if (streamAbortRef.current === controller) {
            streamAbortRef.current = null;
          }
          setSendingMessage(false);

                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="space-y-5 pb-2">
                        {messages.map((msg, i) => {
                          if (sendingMessage && msg.role === "model" && !msg.text) return null;
                          const isUser = msg.role === "user";
                          const isLastStreaming = sendingMessage && !isUser && i === messages.length - 1;
                          return (
                            <div
                              key={msg._id || i}
                              dir={lang === "ar" ? "rtl" : "ltr"}
                              className={`flex gap-3 min-w-0 ${isUser ? "justify-start" : "justify-end"}`}
                            >
                              {isUser && (
                                <div className="w-8 h-8 flex-shrink-0 bg-brandYellow border-2 border-line shadow-sm flex items-center justify-center font-extrabold text-xs mt-1">
                                  {lang === "ar" ? "أنت" : "You"}
                                </div>
                              )}
                              <div className={`min-w-0 flex flex-col ${isUser ? "items-start max-w-[86%] sm:max-w-[78%]" : "items-end max-w-[calc(100%-44px)] sm:max-w-[90%]"}`}>
                                <div
                                  className={`chat-message-bubble min-w-0 w-full px-4 sm:px-5 py-3.5 border-2 border-line ${
                                    isUser
                                      ? "user-bubble bg-brandBlue text-white shadow-sm"
                                      : "bg-paper text-ink shadow-sm"
                                  }`}
                                >
                                  <FormattedMessage text={msg.text} uiLang={lang} />
                                  {isLastStreaming && (
                                    <span className="inline-block w-2.5 h-4 mr-1 align-middle bg-brandYellow border border-line animate-pulse" />
                                  )}
                                </div>
                                {!isUser && !isLastStreaming && msg.text && (
                                  <CopyMessageButton text={msg.text} lang={lang} />
                                )}
                              </div>
                              {!isUser && (
                                <SafeAvatar
                                  src={activeAgent.avatarUrl}
                                  alt={activeAgent.name}
                                  fallbackText={activeAgent.name}
                                  className="w-8 h-8 bg-paper border-2 border-line shadow-sm flex-shrink-0 mt-1 object-cover text-xs"
                                />
                              )}
                            </div>
                          );
                        })}

                        {sendingMessage && messages[messages.length - 1]?.role === "model" && !messages[messages.length - 1]?.text && (
                          <div dir={lang === "ar" ? "rtl" : "ltr"} className="flex gap-3 justify-end">
                            <div className="nb-box px-4 py-3 flex items-center gap-1.5">
                              <span className="w-2.5 h-2.5 bg-brandYellow border border-line animate-bounce"></span>
                              <span className="w-2.5 h-2.5 bg-brandBlue border border-line animate-bounce" style={{ animationDelay: "150ms" }}></span>
                              <span className="w-2.5 h-2.5 bg-darkPanel animate-bounce" style={{ animationDelay: "300ms" }}></span>
                            </div>
                            <SafeAvatar
                              src={activeAgent.avatarUrl}
                              alt={activeAgent.name}
                              fallbackText={activeAgent.name}
                              className="w-8 h-8 bg-paper border-2 border-line flex-shrink-0 object-cover text-xs"
                            />
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>

                <div className="chat-composer-wrap flex-shrink-0 px-3 sm:px-7 pt-3 pb-4 bg-paper border-t-2 border-line">
                  <div className="max-w-3xl mx-auto">
                    <div className="nb-box flex items-end gap-2 p-2">
                      <textarea
                        ref={textareaRef}
                        rows="1"
                        value={inputMessage}
                        onChange={(e) => setInputMessage(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            handleSendMessage();
                          }
                        }}
                        placeholder={lang === "ar" ? `اكتب رسالتك إلى ${activeAgent.name}...` : `Message ${activeAgent.name}...`}
                        dir="auto"
                        className="w-full min-w-0 max-h-[140px] bg-transparent px-3 py-2 text-sm font-bold text-ink placeholder-neutral-500 focus:outline-none resize-none leading-relaxed"
                      />
                      <button
                        type="button"
                        onClick={() => handleSendMessage()}
                        disabled={!inputMessage.trim() || sendingMessage}
                        aria-label={lang === "ar" ? "إرسال" : "Send"}
                        className="nb-btn p-2.5 sm:px-4 sm:py-2.5 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-40 text-white font-extrabold text-xs flex items-center gap-1.5 flex-shrink-0"
                      >
                        <span className="hidden sm:inline">{lang === "ar" ? "إرسال" : "Send"}</span>
                        <Icon name="send" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* ========================================== */}
          {/* MOBILE BOTTOM NAVIGATION                   */}
          {/* ========================================== */}
          {!isChatView && (
            <nav
              aria-label={lang === "ar" ? "التنقل على الهاتف" : "Mobile navigation"}
              className="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-paper border-t-2 border-line px-2 pt-1.5 pb-[calc(0.4rem+env(safe-area-inset-bottom,0px))] flex items-center justify-around"
            >
              <button
                type="button"
                onClick={() => setView("explore")}
                className={`flex flex-col items-center justify-center gap-0.5 py-1 px-4 text-[11px] font-extrabold ${
                  view === "explore" ? "bg-brandYellow border border-line" : "text-ink"
                }`}
              >
                <Icon name="search" className="w-4 h-4" />
                <span>{lang === "ar" ? "استكشف" : "Explore"}</span>
              </button>

              <button
                type="button"
                onClick={() => {
                  if (!token) {
                    setAuthMode("login");
                    setShowAuthModal(true);
                  } else {
                    setShowCreateModal(true);
                  }
                }}
                className="flex flex-col items-center justify-center gap-0.5 py-1 px-4 bg-brandBlue text-white border border-line text-[11px] font-extrabold"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>{lang === "ar" ? "إنشاء وكيل" : "Create"}</span>
              </button>

              <button
                type="button"
                onClick={openProfile}
                className={`flex flex-col items-center justify-center gap-0.5 py-1 px-4 text-[11px] font-extrabold ${
                  view === "profile" ? "bg-brandYellow border border-line" : "text-ink"
                }`}
              >
                <Icon name="user" className="w-4 h-4" />
                <span>{lang === "ar" ? (user ? "حسابي" : "دخول") : (user ? "Profile" : "Sign in")}</span>
              </button>
            </nav>
          )}

          {/* ========================================== */}
          {/* MODAL 1: SPLIT-SCREEN AUTH                 */}
          {/* ========================================== */}
          {showAuthModal && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              lang={lang}
              onClose={() => setShowAuthModal(false)}
              onSuccess={(newToken, userData) => {
                safeStorage.set("agenttube_token", newToken);
                setToken(newToken);
                setUser(userData);
                setShowAuthModal(false);
                notify(lang === "ar" ? `أهلاً بك، ${userData.displayName || userData.username}!` : `Welcome, ${userData.displayName || userData.username}!`, "success");
              }}
              apiFetch={apiFetch}
            />
          )}

          {/* ========================================== */}
          {/* MODAL 2: CREATE AGENT                      */}
          {/* ========================================== */}
          {showCreateModal && (
            <CreateAgentModal
              lang={lang}
              onClose={() => setShowCreateModal(false)}
              onCreated={(newAgent) => {
                setShowCreateModal(false);
                notify(lang === "ar" ? "تم بناء ونشر الوكيل بنجاح!" : "Agent created and published!", "success");
                fetchAgents();
                if (newAgent?.slug) openAgentWorkspace(newAgent.slug);
              }}
              apiFetch={apiFetch}
            />
          )}

          {/* ========================================== */}
          {/* MODAL 3: AGENT SAVED MEMORY INSPECTOR      */}
          {/* ========================================== */}
          {showMemoryModal && activeAgent && (
            <div
              onClick={(e) => { if (e.target === e.currentTarget && !clearingMemory) setShowMemoryModal(false); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 glass-backdrop"
            >
              <div className="nb-box-lg animate-pop w-full max-w-lg p-6 bg-paper">
                <div className="flex items-center justify-between pb-3 mb-4 border-b-2 border-line">
                  <div className="flex items-center gap-2">
                    <span className="p-1.5 bg-brandYellow border border-line">
                      <Icon name="brain" className="w-4 h-4" />
                    </span>
                    <h3 className="font-extrabold text-base text-ink">{lang === "ar" ? "ذاكرة تقدمك مع" : "Progress memory for"} <bdi>{activeAgent.name}</bdi></h3>
                  </div>
                  <button
                    type="button"
                    disabled={clearingMemory}
                    onClick={() => setShowMemoryModal(false)}
                    aria-label={lang === "ar" ? "إغلاق" : "Close"}
                    className="p-1 bg-paper border border-line"
                  >
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                <div className="nb-box p-4 text-xs sm:text-sm font-semibold text-ink whitespace-pre-wrap max-h-64 overflow-y-auto leading-relaxed" dir="auto">
                  {agentMemory || (lang === "ar" ? "لا يوجد ملخص تقدم محفوظ بعد. ابدأ التحدث مع الوكيل وسيتم حفظ مستواك تلقائياً." : "No saved progress yet. Start chatting and this agent will remember your progress.")}
                </div>

                {memoryError && (
                  <div className="mt-4">
                    <InlineAlert message={memoryError} />
                  </div>
                )}

                <div className="flex items-center justify-between gap-3 mt-5">
                  {agentMemory ? (
                    <button
                      type="button"
                      disabled={clearingMemory}
                      onClick={handleClearAgentMemory}
                      className="nb-btn px-4 py-2 bg-rose-500 disabled:opacity-50 text-white text-xs font-extrabold"
                    >
                      {clearingMemory
                        ? (lang === "ar" ? "جاري التصفير..." : "Clearing...")
                        : (lang === "ar" ? "تصفير الذاكرة والبدء من الصفر" : "Clear memory and start over")}
                    </button>
                  ) : <span />}
                  <button
                    type="button"
                    disabled={clearingMemory}
                    onClick={() => setShowMemoryModal(false)}
                    className="nb-btn px-5 py-2 bg-brandYellow text-ink text-xs font-extrabold"
                  >
                    {lang === "ar" ? "إغلاق" : "Close"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // Profile Page Component
    // ==========================================
    function ProfilePage({ user, lang, agents, loading, error, onExplore, onCreate, onOpenAgent, onRefresh }) {

        <main className="w-full max-w-7xl mx-auto flex-1 px-4 sm:px-6 py-8">

              <span className="px-3 py-1 bg-brandYellow border border-line text-ink text-xs font-extrabold">
                {lang === "ar" ? "ملف صانع الوكلاء" : "Creator Profile"}

              <div className="flex gap-2">
                <button type="button" onClick={onExplore} className="nb-btn px-3.5 py-1.5 bg-paper text-ink text-xs font-extrabold">

                <button type="button" onClick={onCreate} className="nb-btn px-3.5 py-1.5 bg-brandBlue text-white text-xs font-extrabold flex items-center gap-1">
                  <Icon name="plus" className="w-3.5 h-3.5" /> {lang === "ar" ? "وكيل جديد" : "New agent"}
                </button>
              </div>
            </div>

            <div className="px-6 pb-7 bg-paper">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-12 mb-5">
                <div className="flex items-end gap-4">
                  <SafeAvatar
                    src={user.avatarUrl}
                    alt={name}
                    fallbackText={name}
                    className="w-24 h-24 bg-brandYellow border-2 border-line shadow-sm object-cover text-3xl"
                  />
                  <div className="pb-1">
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-ink" dir="auto">{name}</h1>
                    <p className="text-sm font-bold text-brandBlue" dir="ltr">@{user.username}</p>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t-2 border-line">
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-2xl font-extrabold text-ink">{loading ? "—" : agents.length}</div>
                  <p className="text-xs font-bold text-neutral-600">{lang === "ar" ? "وكلاء منشورون" : "Published agents"}</p>
                </div>
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-2xl font-extrabold text-ink">{loading ? "—" : totalViews.toLocaleString("en-US")}</div>
                  <p className="text-xs font-bold text-neutral-600">{lang === "ar" ? "إجمالي المشاهدات" : "Total views"}</p>
                </div>
                <div className="nb-box-sm p-4 bg-cream">
                  <div className="text-sm font-extrabold text-ink truncate" dir="ltr">{user.email}</div>
                  <p className="text-xs font-bold text-neutral-600">{lang === "ar" ? "البريد الإلكتروني" : "Email"}</p>
                </div>
              </div>
            </div>
          </section>

          <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
            <h2 className="text-xl sm:text-2xl font-extrabold text-ink">{lang === "ar" ? "وكلائي المنشورون" : "My published agents"}</h2>
            <button type="button" onClick={onRefresh} disabled={loading} className="nb-btn px-3.5 py-1.5 bg-paper text-xs font-extrabold inline-flex items-center gap-1.5">
              <Icon name="refresh" className={`w-3.5 h-3.5 ${loading ? "animate-spin" : ""}`} /> {lang === "ar" ? "تحديث" : "Refresh"}

                <button

                  type="button"
                  onClick={() => onOpenAgent(agent.slug)}
                  className="nb-card text-start p-5 flex flex-col justify-between"
                >
                  <div>
                    <div className="flex items-center gap-3 mb-3">
                      <SafeAvatar
                        src={agent.avatarUrl}
                        alt={agent.name}
                        fallbackText={agent.name}
                        className="w-12 h-12 border-2 border-line bg-cream object-cover text-base"
                      />
                      <div className="min-w-0 flex-1">
                        <h3 className="font-extrabold text-base text-ink truncate" dir="auto">{agent.name}</h3>
                        <span className="px-2 py-0.5 bg-brandYellow border border-line text-[10px] font-extrabold">{agent.category}</span>
                      </div>
                    </div>
                    <p className="text-xs font-semibold text-neutral-700 line-clamp-2 mb-4" dir="auto">{agent.description}</p>
                  </div>
                  <div className="pt-3 border-t-2 border-line w-full flex items-center justify-between text-xs font-extrabold">
                    <span className="inline-flex items-center gap-1">
                      <Icon name="eye" className="w-3.5 h-3.5" />
                      {agent.viewsCount || 0} {lang === "ar" ? "مشاهدة" : "views"}
                    </span>
                    <span className="text-brandBlue">{lang === "ar" ? "فتح مساحة العمل" : "Open workspace"}</span>
                  </div>
                </button>
              ))}
            </div>
          )}
        </main>
      );
    }

    // ==========================================
    // Split-Screen Auth Modal (With Inline Error Display)
    // ==========================================
    function AuthModal({ mode, setMode, lang, onClose, onSuccess, apiFetch }) {
      const [form, setForm] = useState({
        username: "",
        displayName: "",
        email: "",
        password: "",
        bio: "",
      });
      const [loading, setLoading] = useState(false);
      const [formError, setFormError] = useState("");

      useEffect(() => {
        setFormError("");
      }, [mode]);

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape" && !loading) onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose, loading]);

      const updateField = (key, value) => {
        if (formError) setFormError("");
        setForm((prev) => ({ ...prev, [key]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormError("");
        setLoading(true);
        const context = mode === "login" ? "auth_login" : "auth_register";
        try {
          const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
          const payload = mode === "login"
            ? { email: form.email.trim(), password: form.password }
            : {
                username: form.username.trim(),
                displayName: form.displayName.trim(),
                email: form.email.trim(),
                password: form.password,
                bio: form.bio.trim(),
              };

          const res = await apiFetch(endpoint, {
            method: "POST",
            body: JSON.stringify(payload),
          }, context);

          if (!res.token || !res.user) {
            throw new AppError("SERVER_UNAVAILABLE", 500, context);
          }
          onSuccess(res.token, res.user);
        } catch (err) {
          setFormError(getFriendlyError(err, lang, context));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget && !loading) onClose(); }}
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/60 glass-backdrop overflow-y-auto"
        >
          <div className="nb-box-lg animate-pop w-full max-w-4xl grid grid-cols-1 lg:grid-cols-2 overflow-hidden my-auto">
            <div className="bg-paper p-6 sm:p-9 flex flex-col justify-between">
              <div className="flex items-center justify-between mb-6">
                <button
                  type="button"
                  disabled={loading}
                  onClick={onClose}
                  className="nb-btn px-3 py-1 bg-paper text-xs font-extrabold text-ink inline-flex items-center gap-1"
                >
                  <Icon name="close" className="w-3.5 h-3.5" />
                  <span>{lang === "ar" ? "إغلاق" : "Close"}</span>
                </button>
                <span className="px-2.5 py-0.5 bg-brandYellow border border-line text-xs font-extrabold">
                  AgentTube
                </span>
              </div>

              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-ink text-center mb-1.5">
                  {mode === "login" ? (lang === "ar" ? "سجّل الدخول لحسابك" : "Welcome back") : (lang === "ar" ? "أنشئ حسابك" : "Create your account")}
                </h2>
                <p className="text-xs sm:text-sm font-semibold text-neutral-600 text-center mb-6">
                  {mode === "login"
                    ? (lang === "ar" ? "أكمل بناء وكلائك واسترجع تقدمك المحفوظ في الدروس." : "Keep building agents and pick up where you left off.")
                    : (lang === "ar" ? "ابنِ وكلاء ذكاء اصطناعي بالعربي وشاركهم مع المجتمع." : "Build AI agents and share them with the community.")}
                </p>

                <form onSubmit={handleSubmit} className="space-y-4">
                  {mode === "register" && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "اسم المستخدم (Username)" : "Username"}</label>
                        <input
                          type="text"
                          required
                          autoComplete="username"
                          dir="ltr"
                          placeholder="ahmed_ai"
                          value={form.username}
                          onChange={(e) => updateField("username", e.target.value)}
                          className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "الاسم الكامل" : "Full name"}</label>
                        <input
                          type="text"
                          required
                          autoComplete="name"
                          placeholder={lang === "ar" ? "أحمد محمد" : "Your full name"}
                          dir="auto"
                          value={form.displayName}
                          onChange={(e) => updateField("displayName", e.target.value)}
                          className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                        />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "البريد الإلكتروني" : "Email address"}</label>
                    <input
                      type="email"
                      required
                      autoComplete="email"
                      dir="ltr"
                      placeholder="you@example.com"
                      value={form.email}
                      onChange={(e) => updateField("email", e.target.value)}
                      className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "كلمة المرور" : "Password"}</label>
                    <input
                      type="password"
                      required
                      minLength={6}
                      autoComplete={mode === "login" ? "current-password" : "new-password"}
                      dir="ltr"
                      placeholder="••••••••"
                      value={form.password}
                      onChange={(e) => updateField("password", e.target.value)}
                      className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                    />
                  </div>

                  {/* Visible inline error directly inside the auth form */}
                  <InlineAlert message={formError} />

                  <button
                    type="submit"
                    disabled={loading}
                    className="nb-btn w-full py-3 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-50 text-white font-extrabold text-sm mt-2"
                  >
                    {loading ? (lang === "ar" ? "جاري التنفيذ..." : "Please wait...") : mode === "login" ? (lang === "ar" ? "تسجيل الدخول" : "Sign in") : (lang === "ar" ? "إنشاء حساب" : "Create account")}
                  </button>
                </form>

                <div className="mt-5 text-center text-xs font-bold text-neutral-700">
                  {mode === "login" ? (
                    <span>
                      {lang === "ar" ? "ليس لديك حساب بعد؟" : "New to AgentTube?"}{" "}
                      <button type="button" onClick={() => setMode("register")} className="text-brandBlue underline font-extrabold">
                        {lang === "ar" ? "أنشئ حسابك الآن" : "Create an account"}
                      </button>
                    </span>
                  ) : (
                    <span>
                      {lang === "ar" ? "لديك حساب بالفعل؟" : "Already have an account?"}{" "}
                      <button type="button" onClick={() => setMode("login")} className="text-brandBlue underline font-extrabold">
                        {lang === "ar" ? "تسجيل الدخول" : "Sign in"}
                      </button>
                    </span>
                  )}
                </div>
              </div>

              <div className="mt-6 pt-3 border-t border-line text-center text-[11px] font-bold text-neutral-500">
                AgentTube — Hybrid XML & Persistent Memory Engine
              </div>
            </div>

            <div className="hidden lg:flex flex-col justify-between bg-darkPanel text-white p-9 lg:border-s-2 border-line">
              <div>
                <h3 className="text-3xl font-extrabold leading-tight mb-3">
                  {lang === "ar" ? "ابنِ وكلاء يشتغلوا فعلاً." : "Create AI agents that really work."}
                </h3>
                <p className="text-sm font-semibold text-neutral-300 leading-relaxed">
                  {lang === "ar" ? "هندسة أوامر احترافية، ذاكرة تحفظ مستواك عبر كل المحادثات، ومجتمع لصناع الذكاء الاصطناعي العرب." : "Thoughtful prompt design, memory across conversations, and a creative community."}
                </p>
              </div>

              <div className="bg-paper text-ink border-2 border-white p-5 shadow-sm">
                <div className="flex items-center justify-between border-b-2 border-line pb-3 mb-4">
                  <div className="flex gap-1.5">
                    <span className="w-3 h-3 bg-rose-500 border border-line" />
                    <span className="w-3 h-3 bg-brandYellow border border-line" />
                    <span className="w-3 h-3 bg-emerald-500 border border-line" />
                  </div>
                  <span className="px-2 py-0.5 bg-sageMist border border-line text-[10px] font-extrabold">
                    Production ✓
                  </span>
                </div>

                <div className="space-y-3 text-xs font-extrabold">
                  <div className="p-3 bg-cream border-2 border-line flex items-center justify-between">
                    <span>{lang === "ar" ? "01. فكرتك بالعربي" : "01. Your idea"}</span>
                    <span className="px-2 py-0.5 bg-brandYellow border border-line">RAW PROMPT</span>
                  </div>
                  <div className="text-center font-extrabold">↓</div>
                  <div className="p-3 bg-brandBlue text-white border-2 border-line flex items-center justify-between">
                    <span>{lang === "ar" ? "02. مهندس الأوامر" : "02. Prompt Architect"}</span>
                    <span className="px-2 py-0.5 bg-darkPanel text-brandYellow">HYBRID XML</span>
                  </div>
                  <div className="text-center font-extrabold">↓</div>
                  <div className="p-3 bg-brandYellow border-2 border-line flex items-center justify-between">
                    <span>{lang === "ar" ? "03. ذاكرة ومشاركة الوكلاء" : "03. Memory & Agent Sharing"}</span>
                    <span className="px-2 py-0.5 bg-paper border border-line">READY</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Create Agent Modal (With Inline Error Display)
    // ==========================================
    function CreateAgentModal({ lang, onClose, onCreated, apiFetch }) {
      const [form, setForm] = useState({
        name: "",
        description: "",
        category: "Education",
        rawPrompt: "",
        starter1: "",
        starter2: "",
        temperature: 0.4,
        isPublic: true,
      });
      const [loading, setLoading] = useState(false);
      const [formError, setFormError] = useState("");

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape" && !loading) onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose, loading]);

      const updateField = (key, value) => {
        if (formError) setFormError("");
        setForm((prev) => ({ ...prev, [key]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormError("");
        setLoading(true);
        try {
          const starterPrompts = [form.starter1, form.starter2]
            .map((s) => s.trim())
            .filter(Boolean);

          const res = await apiFetch("/api/agents", {
            method: "POST",
            timeoutMs: BUILD_AGENT_TIMEOUT_MS,
            body: JSON.stringify({
              name: form.name.trim(),
              description: form.description.trim(),
              category: form.category,
              rawPrompt: form.rawPrompt.trim(),
              temperature: Number(form.temperature),
              enableWebSearch: false,
              isPublic: form.isPublic,
              starterPrompts,
            }),
          }, "create_agent");

          onCreated(res.data);
        } catch (err) {
          setFormError(getFriendlyError(err, lang, "create_agent"));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget && !loading) onClose(); }}
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 glass-backdrop overflow-y-auto"
        >
          <div className="nb-box-lg animate-pop w-full max-w-xl bg-paper p-5 sm:p-7 my-auto max-h-[92dvh] overflow-y-auto">
            <div className="flex items-center justify-between pb-4 mb-5 border-b-2 border-line">
              <div className="flex items-center gap-2.5">
                <span className="p-2 bg-brandYellow border-2 border-line shadow-sm">
                  <Icon name="sparkles" className="w-5 h-5" />
                </span>
                <div>
                  <h2 className="text-lg sm:text-xl font-extrabold text-ink">{lang === "ar" ? "إنشاء وكيل ذكاء اصطناعي" : "Create an AI Agent"}</h2>
                  <p className="text-xs font-bold text-neutral-600">
                    {lang === "ar" ? "سيتم تحويل تعليماتك تلقائياً إلى Hybrid XML احترافي" : "Your instructions will be structured as professional Hybrid XML"}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                disabled={loading}
                aria-label={lang === "ar" ? "إغلاق" : "Close"}
                className="nb-btn p-1.5 bg-paper text-ink"
              >
                <Icon name="close" className="w-4 h-4" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "اسم الوكيل" : "Agent name"}</label>
                  <input
                    type="text"
                    required
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: مدرس بايثون العربي" : "e.g. Python Tutor"}
                    value={form.name}
                    onChange={(e) => updateField("name", e.target.value)}
                    className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "التصنيف" : "Category"}</label>
                  <select
                    value={form.category}
                    onChange={(e) => updateField("category", e.target.value)}
                    className="nb-input w-full px-3 py-2.5 text-sm font-bold"
                  >
                    {CATEGORIES.filter((c) => c.id !== "All").map((cat) => (
                      <option key={cat.id} value={cat.id}>{lang === "ar" ? cat.ar : cat.en}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "وصف مختصر" : "Short description"}</label>
                <input
                  type="text"
                  required
                  dir="auto"
                  placeholder={lang === "ar" ? "ماذا يقدم هذا الوكيل للمستخدم؟" : "What does your agent help people do?"}
                  value={form.description}
                  onChange={(e) => updateField("description", e.target.value)}
                  className="nb-input w-full px-3.5 py-2.5 text-sm font-bold"
                />
              </div>

              <div>
                <label className="block text-xs font-extrabold text-ink mb-1">
                  {lang === "ar" ? "التعليمات والفكرة (Raw Prompt — بالعربي أو الإنجليزي)" : "Instructions (Raw Prompt — Arabic or English)"}
                </label>
                <textarea
                  rows="4"
                  required
                  dir="auto"
                  placeholder={lang === "ar" ? "اشرح دور الوكيل، أسلوبه في الشرح أو العمل، والقواعد التي يجب أن يلتزم بها..." : "Describe the agent’s role, tone, goals and guidelines..."}
                  value={form.rawPrompt}
                  onChange={(e) => updateField("rawPrompt", e.target.value)}
                  className="nb-input w-full px-3.5 py-2.5 text-sm font-bold leading-relaxed"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "سؤال مقترح 1 (اختياري)" : "Starter prompt 1 (optional)"}</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: ابدأ معي من الصفر" : "e.g. Teach me from scratch"}
                    value={form.starter1}
                    onChange={(e) => updateField("starter1", e.target.value)}
                    className="nb-input w-full px-3 py-2 text-xs font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-ink mb-1">{lang === "ar" ? "سؤال مقترح 2 (اختياري)" : "Starter prompt 2 (optional)"}</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder={lang === "ar" ? "مثال: اختبر مستواي وصمم لي خطة" : "e.g. Assess my level and make a plan"}
                    value={form.starter2}
                    onChange={(e) => updateField("starter2", e.target.value)}
                    className="nb-input w-full px-3 py-2 text-xs font-bold"
                  />
                </div>
              </div>

              <div className="nb-box p-4">
                <div>
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="font-extrabold text-ink">{lang === "ar" ? "درجة الإبداع (Temperature)" : "Creativity (Temperature)"}</span>
                    <div className="flex items-center gap-1.5">
                      {[
                        { label: lang === "ar" ? "دقيق" : "Precise", val: 0.2 },
                        { label: lang === "ar" ? "متوازن" : "Balanced", val: 0.5 },
                        { label: lang === "ar" ? "إبداعي" : "Creative", val: 1.0 },
                      ].map((preset) => (
                        <button
                          key={preset.label}
                          type="button"
                          onClick={() => updateField("temperature", preset.val)}
                          className={`px-2 py-0.5 border border-line text-[10px] font-extrabold ${
                            Number(form.temperature) === preset.val
                              ? "bg-brandYellow text-ink"
                              : "bg-paper text-neutral-700"
                          }`}
                        >
                          {preset.label}
                        </button>
                      ))}
                      <span className="font-mono font-extrabold text-brandBlue mr-1">{form.temperature}</span>
                    </div>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1.5"
                    step="0.1"
                    value={form.temperature}
                    onChange={(e) => updateField("temperature", e.target.value)}
                    className="w-full accent-ink cursor-pointer"
                  />
                </div>
              </div>

              {/* Visible inline error directly inside the create-agent form */}
              <InlineAlert message={formError} />

              <button
                type="submit"
                disabled={loading}
                className="nb-btn w-full py-3 bg-brandBlue hover:bg-brandBlueHover disabled:opacity-50 text-white font-extrabold text-sm flex items-center justify-center gap-2"
              >
                {loading ? (
                  <React.Fragment>
                    <span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin" />
                    <span>{lang === "ar" ? "جاري هندسة البرومبت ونشر الوكيل..." : "Building and publishing your agent..."}</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <Icon name="sparkles" className="w-4 h-4" />
                    <span>{lang === "ar" ? "هندسة ونشر الوكيل" : "Build & publish agent"}</span>
                  </React.Fragment>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>

</html>
