<body class="antialiased selection:bg-brandYellow selection:text-ink">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* =========================================================================
       AgentTube Frontend — Table of Contents
       -------------------------------------------------------------------------
       1. Config, Storage & Error Classification
       2. UI Constants (Categories, Card Themes, FAQ)
       3. Shared UI Primitives (InlineAlert, ErrorBoundary, SafeAvatar, Icons)
       4. Markdown, Code & Math Message Rendering
       5. Skeleton Loaders (AgentCardSkeleton, ServerWakeSkeleton)
       6. URL Routing & Share Helpers
       7. Main Application State & API Orchestration (App)
       8. Layout & Navigation Components (TopNavbar, MobileBottomNav)
       9. Page Views (AgentCard, ExplorePage, ChatWorkspace, ProfilePage)
      10. Modals (MemoryModal, AuthModal, CreateAgentModal)
      11. ReactDOM Mount
       ========================================================================= */

    // ==========================================
    // 1. Config, Storage & Error Classification
    // ==========================================
    const API_BASE = "https://agents-377s.onrender.com";
    const REQUEST_TIMEOUT_MS = 25000;
    const BUILD_AGENT_TIMEOUT_MS = 65000;
    const BUILD_AGENT_PDF_TIMEOUT_MS = 180000;
    const MAX_PDF_SIZE_BYTES = 50 * 1024 * 1024;

    const safeStorage = {
      get(key, fallback = "") {
        try {
          const val = window.localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch {}
      },
      remove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch {}
      },
    };

    // Structured internal error — raw server errors are NEVER surfaced to users.
    class AppError extends Error {
      constructor(code, status = 0, context = "general") {
        super(code);
        this.name = "AppError";
        this.code = code;
        this.status = status;
        this.context = context;
      }
    }

    function classifyHttpError(status, rawErrorText, context) {
      const hint = String(rawErrorText || "");
      if (context === "auth_login" && (status === 400 || status === 401 || status === 404)) {
        return "INVALID_CREDENTIALS";
      }
      if (status === 401) return "SESSION_EXPIRED";
      if (status === 403) return "FORBIDDEN";
      if (status === 404) return "NOT_FOUND";
      if (status === 409) return "CONFLICT";
      if (status === 429) return "RATE_LIMITED";
      if (status === 400 || status === 422) {
        if (context === "auth_register" && /exist|duplicate|already|taken|مستخدم|مسجل/i.test(hint)) {
          return "CONFLICT";
        }
        if (context === "create_agent") {
          if (/\b(?:20|50)\s*mb|file size|exceed|limit_file_size/i.test(hint)) return "PDF_TOO_LARGE";
          if (/only pdf|pdf files are allowed|mimetype/i.test(hint)) return "PDF_INVALID_TYPE";
          if (/educational/i.test(hint)) return "PDF_EDUCATION_ONLY";
        }
        return "VALIDATION_ERROR";
      }
      if (status === 200) {
        if (context === "auth_login") return "INVALID_CREDENTIALS";
        if (context === "auth_register" && /exist|duplicate|already|taken|مستخدم|مسجل/i.test(hint)) {
          return "CONFLICT";
        }
        if (context === "chat") return "CHAT_INTERRUPTED";
        return "SERVER_UNAVAILABLE";
      }
      if (status >= 500) return "SERVER_UNAVAILABLE";
      return "UNKNOWN_ERROR";
    }

    function getFriendlyError(error, lang = "ar", context = "general") {
      const isAr = lang === "ar";
      if (typeof navigator !== "undefined" && navigator.onLine === false) {
        return isAr
          ? "لا يوجد اتصال بالإنترنت. تحقق من الشبكة وحاول مرة أخرى."
          : "No internet connection. Please check your network and try again.";
      }

      const code = error instanceof AppError
        ? error.code
        : error?.name === "AbortError"
          ? "TIMEOUT"
          : "NETWORK_ERROR";

      const ctx = error instanceof AppError ? error.context : context;

      switch (code) {
        case "INVALID_CREDENTIALS":
          return isAr
            ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
            : "Incorrect email or password.";
        case "SESSION_EXPIRED":
          return isAr
            ? "انتهت صلاحية الجلسة. يرجى تسجيل الدخول مجدداً."
            : "Your session has expired. Please sign in again.";
        case "FORBIDDEN":
          if (ctx === "open_agent") {
            return isAr
              ? "هذا الوكيل خاص ولا يمكن الوصول إليه إلا من حساب صانعه."
              : "This agent is private and can only be accessed by its creator.";
          }
          return isAr
            ? "ليس لديك صلاحية لتنفيذ هذا الإجراء."
            : "You don't have permission to perform this action.";
        case "CONFLICT":
          return ctx === "auth_register"
            ? (isAr ? "البريد الإلكتروني أو اسم المستخدم مسجل مسبقاً." : "This email or username is already registered.")
            : (isAr ? "هذا العنصر موجود بالفعل." : "This item already exists.");
        case "NOT_FOUND":
          if (ctx === "open_agent") {
            return isAr ? "هذا الوكيل غير متوفر حالياً." : "This agent is currently unavailable.";
          }
          if (ctx === "open_creator") {
            return isAr ? "حساب الصانع غير متوفر حالياً." : "Creator profile was not found.";
          }
          return isAr ? "العنصر المطلوب غير متوفر." : "The requested item was not found.";
        case "VALIDATION_ERROR":
          if (ctx === "auth_register") {
            return isAr
              ? "يرجى التأكد من صحة البيانات المدخلة وأن كلمة المرور لا تقل عن 6 أحرف."
              : "Please check your details and make sure the password is at least 6 characters.";
          }
          if (ctx === "create_agent") {
            return isAr
              ? "يرجى مراجعة حقول الوكيل والتأكد من تعبئة المطلوب بشكل صحيح."
              : "Please review the agent fields and fill in all required details.";
          }
          return isAr
            ? "يرجى مراجعة البيانات المدخلة والمحاولة مرة أخرى."
            : "Please check your input and try again.";
        case "PDF_TOO_LARGE":
          return isAr
            ? "حجم ملف PDF يجب ألا يتجاوز 50 ميجابايت."
            : "PDF file size must not exceed 50MB.";
        case "PDF_INVALID_TYPE":
          return isAr
            ? "يُسمح فقط برفع ملفات بصيغة PDF."
            : "Only PDF files are allowed.";
        case "PDF_EDUCATION_ONLY":
          return isAr
            ? "رفع ملف PDF متاح فقط لوكلاء تصنيف التعليم."
            : "PDF reference upload is only supported for Educational agents.";
        case "RATE_LIMITED":
          return isAr
            ? "تم إرسال عدة طلبات خلال وقت قصير. انتظر لحظات وحاول مجدداً."
            : "Too many requests. Please wait a moment and try again.";
        case "TIMEOUT":
          return ctx === "create_agent"
            ? (isAr ? "استغرق تجهيز الوكيل وقتاً أطول من المعتاد. يرجى المحاولة مرة أخرى." : "Building your agent took longer than expected. Please try again.")
            : (isAr ? "استغرق الاتصال وقتاً أطول من المعتاد. حاول مرة أخرى." : "The connection timed out. Please try again.");
        case "CHAT_INTERRUPTED":
          return isAr
            ? "تعذر إكمال الرد حالياً. يرجى المحاولة مرة أخرى."
            : "Couldn't complete the response right now. Please try again.";
        case "SERVER_UNAVAILABLE":
          return isAr
            ? "الخدمة مشغولة مؤقتاً. يرجى المحاولة بعد لحظات."
            : "The service is temporarily busy. Please try again shortly.";
        case "NETWORK_ERROR":
        default:
          return isAr
            ? "تعذر الاتصال بالخدمة حالياً. يرجى المحاولة مرة أخرى."
            : "Unable to connect right now. Please try again.";
      }
    }

        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch() {}
      render() {
        if (this.state.hasError) {
          const isAr = safeStorage.get("agenttube_lang", "ar") !== "en";
          return (
            <div className="min-h-[100dvh] flex items-center justify-center p-6 bg-cream text-ink" dir={isAr ? "rtl" : "ltr"}>

                <h1 className="text-xl font-extrabold text-ink mb-2">
                  {isAr ? "حدث خطأ غير متوقع" : "Something went wrong"}

                <p className="text-sm font-semibold text-neutral-600 mb-6">

                    : "Sorry for the temporary interruption. Please reload the page to continue."}

    // ==========================================
    // Safe Avatar Component (Prevents Broken Images)
    // ==========================================
    function SafeAvatar({ src, alt = "", fallbackText = "A", className = "" }) {
      const [failed, setFailed] = useState(false);
      useEffect(() => {
        setFailed(false);
      }, [src]);

      const initial = String(fallbackText || alt || "A").trim().charAt(0).toUpperCase() || "A";
      const isSafeUrl = typeof src === "string" && /^https?:\/\//i.test(src.trim());

      if (!isSafeUrl || failed) {
        return (
          <div
            aria-label={alt}
            className={`${className} flex items-center justify-center bg-brandYellow text-ink font-extrabold select-none`}
          >
            {initial}
          </div>
        );
      }

      return (
        <img
          src={src}
          alt={alt}
          loading="lazy"
          decoding="async"
          onError={() => setFailed(true)}
          className={className}
        />
      );
    }

    // 4. Markdown, Code & Math Message Rendering

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const syntaxAliases = {
      js: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript",
      py: "python", sh: "bash", shell: "bash", zsh: "bash",
      html: "xml", svg: "xml", yml: "yaml", md: "markdown",
      cs: "csharp", csharp: "csharp", cplusplus: "cpp", rb: "ruby"
    };

    function CodeSnippet({ code, language = "", lang = "ar" }) {
      const [copied, setCopied] = useState(false);
      const resetRef = useRef(null);
      useEffect(() => () => clearTimeout(resetRef.current), []);
      const normalized = (syntaxAliases[language.toLowerCase()] || language).toLowerCase();
      let highlighted = escapeHtml(code);
      let detected = normalized;

      if (window.hljs) {
        try {
          if (normalized && window.hljs.getLanguage(normalized)) {
            highlighted = window.hljs.highlight(code, { language: normalized, ignoreIllegals: true }).value;
          } else {
            const result = window.hljs.highlightAuto(code);
            highlighted = result.value;
            detected = result.language || normalized || "text";
          }
        } catch {
          highlighted = escapeHtml(code);
        }
      }

      const copyCode = async () => {
        try {
          await navigator.clipboard.writeText(code);
          setCopied(true);
          clearTimeout(resetRef.current);
          resetRef.current = setTimeout(() => setCopied(false), 2000);
        } catch {}
      };

      return (
        <div className="code-window" dir="ltr">
          <div className="code-titlebar flex items-center justify-between gap-3 px-3.5 py-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="flex gap-1.5" aria-hidden="true">
                <span className="w-2.5 h-2.5 bg-rose-500 border border-black" />
                <span className="w-2.5 h-2.5 bg-brandYellow border border-black" />
                <span className="w-2.5 h-2.5 bg-emerald-400 border border-black" />
              </span>
              <span className="font-mono text-[11px] font-bold text-brandYellow truncate uppercase tracking-wider">
                {language || detected || "code"}
              </span>
            </div>
            <button
              type="button"
              onClick={copyCode}
              className="flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-bold text-ink bg-brandYellow hover:bg-yellow-300 border border-line transition-colors"
            >
              <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5" />
              {copied ? (lang === "ar" ? "تم النسخ" : "Copied") : (lang === "ar" ? "نسخ الكود" : "Copy code")}
            </button>
          </div>
          <pre><code className="hljs" dangerouslySetInnerHTML={{ __html: highlighted }} /></pre>
        </div>
      );
    }

    function extractMathExpressions(source) {
      const codeSegments = [];
      const mathSegments = [];
      let prepared = source.replace(/(`+)([\s\S]*?)\1/g, (raw) => {
        const key = `AGENTTUBECODESEGMENT${codeSegments.length}END`;
        codeSegments.push(raw);
        return key;
      });

      const addMath = (original, latex, display) => {
        const key = `AGENTTUBEMATHSEGMENT${mathSegments.length}END`;
        mathSegments.push({ key, original, latex, display });
        return display ? `\n\n${key}\n\n` : key;
      };

      prepared = prepared.replace(/\\\[([\s\S]*?)\\\]/g,
        (original, latex) => addMath(original, latex, true));
      prepared = prepared.replace(/\$\$([\s\S]*?)\$\$/g,
        (original, latex) => addMath(original, latex, true));
      prepared = prepared.replace(/\\\(([\s\S]*?)\\\)/g,
        (original, latex) => addMath(original, latex, false));
      prepared = prepared.replace(/(^|[^\$])\$([^\n$]+?)\$/g, (original, prefix, latex) => {
        if (!latex.trim() || /^\s|\s$/.test(latex)) return original;
        return prefix + addMath(original.slice(prefix.length), latex, false);
      });
      prepared = prepared.replace(/AGENTTUBECODESEGMENT(\d+)END/g,
        (match, index) => codeSegments[Number(index)] ?? match);
      return { prepared, mathSegments };
    }

    function mathToHtml(expression) {
      const { latex, display, original } = expression;
      if (!window.katex) {
        return `<span class="math-fallback" dir="ltr">${escapeHtml(original)}</span>`;
      }
      try {
        const result = window.katex.renderToString(latex.trim(), {
          displayMode: display,
          throwOnError: false,
          trust: false,
          strict: "ignore",
          output: "htmlAndMathml",
          maxExpand: 1000
        });
        return `<span class="${display ? "math-display-content" : "math-inline"}" dir="ltr">${result}</span>`;
      } catch {
        return `<span class="math-fallback" dir="ltr">${escapeHtml(original)}</span>`;
      }
    }

    function renderMarkdownWithMath(source) {
      const { prepared, mathSegments } = extractMathExpressions(source);
      let html;
      if (window.marked && window.DOMPurify) {
        try {
          ensurePurifyHook();
          const renderer = new window.marked.Renderer();
          renderer.html = (token) => escapeHtml(typeof token === "string" ? token : token.text || "");
          html = window.DOMPurify.sanitize(window.marked.parse(prepared, {
            gfm: true, breaks: true, renderer
          }));
          html = html.replace(/<table>/g, '<div class="table-scroll"><table>')
                     .replace(/<\/table>/g, '</table></div>');
        } catch {
          html = "<p>" + escapeHtml(prepared).replace(/\n/g, "<br>") + "</p>";
        }
      } else {
        html = "<p>" + escapeHtml(prepared).replace(/\n/g, "<br>") + "</p>";
      }

      for (const expression of mathSegments) {
        const rawMathHtml = mathToHtml(expression);
        const mathHtml = window.DOMPurify
          ? window.DOMPurify.sanitize(rawMathHtml, {
              ADD_TAGS: [
                "math", "semantics", "mrow", "mi", "mo", "mn", "msup", "msub",
                "msubsup", "mfrac", "msqrt", "mroot", "mtable", "mtr", "mtd",
                "mtext", "mspace", "mstyle", "annotation"
              ],
              ADD_ATTR: [
                "mathvariant", "encoding", "xmlns", "display", "columnalign",
                "rowspacing", "columnspacing", "displaystyle", "scriptlevel",
                "fence", "stretchy", "symmetric", "maxsize", "minsize",
                "lspace", "rspace", "aria-hidden"
              ],
            })
          : rawMathHtml;
        if (expression.display) {
          const wrapper = `<div class="math-block" dir="ltr">${mathHtml}</div>`;
          const paragraph = new RegExp(`<p(?:\\s+[^>]*)?>\\s*${expression.key}\\s*</p>`, "g");
          html = html.replace(paragraph, () => wrapper);
          html = html.split(expression.key).join(wrapper);
        } else {
          html = html.split(expression.key).join(mathHtml);
        }
      }
      html = html.replace(/<(p|li|h[1-6]|blockquote|th|td)(?=[\s>])/g, '<$1 dir="auto"');
      return html;
    }

    function MarkdownPart({ source }) {
      const html = React.useMemo(() => source ? renderMarkdownWithMath(source) : "", [source]);
      if (!source) return null;
      return <div className="chat-rich" dir="auto" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    const FormattedMessage = ({ text, uiLang = "ar" }) => {
      if (!text) return null;
      if (!text.includes("```") && /^\s*<(?:\?xml\b|[A-Za-z][\w:-]*[\s>])/.test(text)
        && /<\/[A-Za-z][\w:-]*>/.test(text)) {
        return <CodeSnippet code={text.trim()} lang={uiLang} language="xml" />;

      const parts = text.split(/(```[\s\S]*?(?:```|$))/g).filter(Boolean);
      return (
        <div className="min-w-0 text-[14.5px] sm:text-[15px] leading-relaxed" dir="auto">
          {parts.map((part, index) => {
            if (part.startsWith("```")) {
              const inner = part.slice(3).replace(/```$/, "");
              const newline = inner.indexOf("\n");
              const header = newline === -1 ? inner.trim() : inner.slice(0, newline).trim();
              const validLanguage = /^[a-zA-Z][a-zA-Z0-9_+.#-]{0,24}$/.test(header);
              const lang = validLanguage ? header : "";
              const code = validLanguage && newline >= 0 ? inner.slice(newline + 1).replace(/\n$/, "")
                : newline === -1 && validLanguage ? "" : inner.replace(/^\n/, "").replace(/\n$/, "");
              return <CodeSnippet key={index} code={code} language={lang} lang={uiLang} />;
            }
            return <MarkdownPart key={index} source={part} />;
          })}
        </div>

    };

    // ==========================================
    // 6. URL Routing & Share Helpers
    // ==========================================
    const AGENTS_PER_PAGE = 20;

    function parseRouteFromLocation() {
      try {
        const params = new URLSearchParams(window.location.search);
        const queryAgent = params.get("agent");
        if (queryAgent && queryAgent.trim()) {
          return { view: "chat", slug: queryAgent.trim(), username: "" };
        }
        const queryCreator = params.get("creator");
        if (queryCreator && queryCreator.trim()) {
          return { view: "creator", slug: "", username: queryCreator.trim().toLowerCase() };
        }
        if (params.get("view") === "profile") {
          return { view: "profile", slug: "", username: "" };
        }
        const hash = window.location.hash || "";
        const agentMatch = hash.match(/^#\/agent\/([^/?#]+)/);
        if (agentMatch) {
          return { view: "chat", slug: decodeURIComponent(agentMatch[1]), username: "" };
        }
        const creatorMatch = hash.match(/^#\/creator\/([^/?#]+)/);
        if (creatorMatch) {
          return { view: "creator", slug: "", username: decodeURIComponent(creatorMatch[1]).toLowerCase() };
        }
        if (hash === "#/profile") {
          return { view: "profile", slug: "", username: "" };
        }
      } catch {}
      return { view: "explore", slug: "", username: "" };
    }

    function buildShareUrlForAgent(slug) {
      try {
        if (window.location.protocol === "file:") {
          return `${window.location.href.split("#")[0]}#/agent/${encodeURIComponent(slug)}`;
        }
        const url = new URL(window.location.href);
        url.hash = "";
        url.searchParams.delete("view");
        url.searchParams.delete("creator");
        url.searchParams.set("agent", slug);
        return url.toString();
      } catch {
        return `?agent=${encodeURIComponent(slug)}`;
      }
    }

    function buildShareUrlForCreator(username) {
      try {
        if (window.location.protocol === "file:") {
          return `${window.location.href.split("#")[0]}#/creator/${encodeURIComponent(username)}`;
        }
        const url = new URL(window.location.href);
        url.hash = "";
        url.searchParams.delete("view");
        url.searchParams.delete("agent");
        url.searchParams.set("creator", username);
        return url.toString();
      } catch {
        return `?creator=${encodeURIComponent(username)}`;
      }
    }

    function syncUrlRoute(nextView, param = "", replace = false) {
      try {
        const current = parseRouteFromLocation();
        if (
          current.view === nextView &&
          (nextView !== "chat" || current.slug === param) &&
          (nextView !== "creator" || current.username === param.toLowerCase())
        ) {
          return;
        }
        if (window.location.protocol === "file:") {
          const nextHash = nextView === "chat" && param
            ? `#/agent/${encodeURIComponent(param)}`
            : nextView === "creator" && param
              ? `#/creator/${encodeURIComponent(param)}`
              : nextView === "profile"
                ? "#/profile"
                : "#/";
          if (replace) {
            window.location.replace(nextHash);
          } else {
            window.location.hash = nextHash;
          }
          return;
        }
        const url = new URL(window.location.href);
        url.hash = "";
        if (nextView === "chat" && param) {
          url.searchParams.set("agent", param);
          url.searchParams.delete("view");
          url.searchParams.delete("creator");
        } else if (nextView === "creator" && param) {
          url.searchParams.set("creator", param);
          url.searchParams.delete("agent");
          url.searchParams.delete("view");
        } else if (nextView === "profile") {
          url.searchParams.set("view", "profile");
          url.searchParams.delete("agent");
          url.searchParams.delete("creator");
        } else {
          url.searchParams.delete("agent");
          url.searchParams.delete("view");
          url.searchParams.delete("creator");
        }
        const method = replace ? "replaceState" : "pushState";
        window.history[method]({ view: nextView, param }, "", url.toString());
      } catch {}
    }

      const [toast, setToast] = useState(null);
      const [showMobileHistory, setShowMobileHistory] = useState(false);

      // Explore, Pagination & Hero Stats State
      const [agents, setAgents] = useState([]);
      const [loadingAgents, setLoadingAgents] = useState(true);
      const [loadingMoreAgents, setLoadingMoreAgents] = useState(false);
      const [agentsLoadFailed, setAgentsLoadFailed] = useState(false);
      const [agentsPagination, setAgentsPagination] = useState({ total: 0, page: 1, pages: 1 });
      const [heroStats, setHeroStats] = useState({ totalAgents: 0, totalViews: 0 });
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [openFaqIndex, setOpenFaqIndex] = useState(0);

      const initialRouteRef = useRef(parseRouteFromLocation());
      const initialRouteHandledRef = useRef(false);

      // Server Boot / Wake-Up State
      const MAX_WAKE_ATTEMPTS = 3;
      const [serverStatus, setServerStatus] = useState("checking"); // "checking" | "waking" | "ready" | "offline"
      const [wakeAttempt, setWakeAttempt] = useState(1);
      const [wakeSeconds, setWakeSeconds] = useState(0);
      const [bootTrigger, setBootTrigger] = useState(0);
      const hasBootedRef = useRef(false);
      const isFirstReadyRef = useRef(true);

      // Profile & Public Creator Profile State
      const [profileAgents, setProfileAgents] = useState([]);
      const [profileLoading, setProfileLoading] = useState(false);
      const [profileError, setProfileError] = useState("");
      const [creatorProfile, setCreatorProfile] = useState({
        user: null,
        agents: [],
        loading: false,
        error: "",
      });

      // Chat & Memory State
      const [activeAgent, setActiveAgent] = useState(null);
      const [agentMemory, setAgentMemory] = useState("");
      const [showMemoryModal, setShowMemoryModal] = useState(false);
      const [memoryError, setMemoryError] = useState("");
      const [clearingMemory, setClearingMemory] = useState(false);
      const [conversations, setConversations] = useState([]);
      const [activeConversationId, setActiveConversationId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState("");
      const [sendingMessage, setSendingMessage] = useState(false);
      const [loadingMessages, setLoadingMessages] = useState(false);

      const chatContainerRef = useRef(null);
      const textareaRef = useRef(null);
      const catalogRef = useRef(null);
      const howItWorksRef = useRef(null);
      const faqRef = useRef(null);
      const toastTimerRef = useRef(null);
      const agentsAbortRef = useRef(null);
      const streamAbortRef = useRef(null);
      const userCancelledStreamRef = useRef(false);

      const notify = useCallback((msg, type = "info") => {
        if (!msg) return;
        clearTimeout(toastTimerRef.current);
        setToast({ msg, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 4000);
      }, []);

      useEffect(() => {
        return () => {
          clearTimeout(toastTimerRef.current);
          agentsAbortRef.current?.abort();
          streamAbortRef.current?.abort();
        };
      }, []);

      const abortActiveStream = useCallback(() => {
        if (streamAbortRef.current) {
          userCancelledStreamRef.current = true;
          streamAbortRef.current.abort();
          streamAbortRef.current = null;
        }
      }, []);

      // Sync HTML direction
      useEffect(() => {
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.lang = lang;
        document.title = lang === "ar" ? "AgentTube — منصة وكلاء الذكاء الاصطناعي" : "AgentTube — AI Agent Studio";
        safeStorage.set("agenttube_lang", lang);
      }, [lang]);

      // Lock document viewport when in chat mode
      useEffect(() => {
        const isChat = view === "chat";
        document.documentElement.classList.toggle("chat-locked", isChat);
        if (!isChat) abortActiveStream();
        return () => document.documentElement.classList.remove("chat-locked");
      }, [view, abortActiveStream]);

      useEffect(() => {
        if (!showMobileHistory) return;
        const onKeyDown = (event) => {
          if (event.key === "Escape") setShowMobileHistory(false);
        };
        document.addEventListener("keydown", onKeyDown);
        return () => document.removeEventListener("keydown", onKeyDown);
      }, [showMobileHistory]);

      // Auto-resize chat textarea
      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 140) + "px";
      }, [inputMessage]);

      const clearSession = useCallback(() => {
        safeStorage.remove("agenttube_token");
        setToken("");
        setUser(null);
        setConversations([]);
        setAgentMemory("");
      }, []);

      // Centralized production API client — never leaks server errors or stack traces
      const apiFetch = useCallback(async (endpoint, options = {}, context = "general") => {
        const { timeoutMs = REQUEST_TIMEOUT_MS, signal: externalSignal, headers: extraHeaders, ...fetchOptions } = options;

        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          throw new AppError("NETWORK_ERROR", 0, context);
        }

        const controller = new AbortController();
        let timedOut = false;

        const onExternalAbort = () => controller.abort();
        if (externalSignal) {
          if (externalSignal.aborted) {
            const abortErr = new Error("Aborted");
            abortErr.name = "AbortError";
            throw abortErr;
          }
          externalSignal.addEventListener("abort", onExternalAbort, { once: true });
        }

        const timeoutId = setTimeout(() => {
          timedOut = true;
          controller.abort();
        }, timeoutMs);

        try {
          const isFormData = typeof FormData !== "undefined" && fetchOptions.body instanceof FormData;
          const headers = {
            ...(!isFormData ? { "Content-Type": "application/json" } : {}),
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(extraHeaders || {}),
          };

          const res = await fetch(`${API_BASE}${endpoint}`, {
            ...fetchOptions,
            headers,
            signal: controller.signal,
          });

          let data = null;
          try {
            data = await res.json();
          } catch {
            data = null;
          }

          if (!res.ok || (data && data.success === false)) {
            if (res.status === 401 && token && context !== "auth_login") {
              clearSession();
            }
            const code = classifyHttpError(res.status, data?.error, context);
            throw new AppError(code, res.status, context);
          }

          if (!data || typeof data !== "object") {
            throw new AppError("SERVER_UNAVAILABLE", res.status, context);
          }

          return data;
        } catch (err) {
          if (err instanceof AppError) throw err;
          if (err?.name === "AbortError") {
            if (timedOut) throw new AppError("TIMEOUT", 408, context);
            throw err;
          }
          throw new AppError("NETWORK_ERROR", 0, context);
        } finally {
          clearTimeout(timeoutId);
          if (externalSignal) {
            externalSignal.removeEventListener("abort", onExternalAbort);
          }
        }
      }, [token, clearSession]);

      // Initial Server Wake-Up & Boot Check
      useEffect(() => {
        if (hasBootedRef.current) return;

        let cancelled = false;
        const controller = new AbortController();
        let retryTimeout = null;

        setServerStatus("checking");
        setWakeAttempt(1);
        setWakeSeconds(0);

        const timer = setInterval(() => {
          setWakeSeconds((prev) => {
            const next = prev + 1;
            if (next >= 3) {
              setServerStatus((curr) => (curr === "checking" ? "waking" : curr));
            }
            return next;
          });
        }, 1000);

        const wakeServer = async () => {
          if (typeof navigator !== "undefined" && navigator.onLine === false) {
            setServerStatus("offline");
            setLoadingAgents(false);
            clearInterval(timer);
            return;
          }

          for (let attempt = 1; attempt <= MAX_WAKE_ATTEMPTS; attempt++) {
            if (cancelled) return;
            setWakeAttempt(attempt);

            try {
              const res = await apiFetch(
                `/api/agents?page=1&limit=${AGENTS_PER_PAGE}`,
                { signal: controller.signal, timeoutMs: REQUEST_TIMEOUT_MS },
                "load_agents"
              );
              if (cancelled) return;

              const list = Array.isArray(res.data) ? res.data : [];
              const pagination = res.pagination || { total: list.length, page: 1, pages: 1 };

              hasBootedRef.current = true;
              setAgents(list);
              setAgentsPagination(pagination);
              setHeroStats({
                totalAgents: res.stats?.totalAgents ?? pagination.total ?? list.length,
                totalViews: res.stats?.totalViews ?? list.reduce((acc, a) => acc + (Number(a.viewsCount) || 0), 0),
              });
              setAgentsLoadFailed(false);
              setLoadingAgents(false);
              setServerStatus("ready");
              clearInterval(timer);
              return;
            } catch (err) {
              if (cancelled || (err?.name === "AbortError" && !(err instanceof AppError))) return;

              if (attempt < MAX_WAKE_ATTEMPTS) {
                setServerStatus("waking");
                await new Promise((resolve) => {
                  retryTimeout = setTimeout(resolve, 3000);
                });
              } else {
                setServerStatus("offline");
                setAgentsLoadFailed(true);
                setLoadingAgents(false);
                clearInterval(timer);
              }
            }
          }
        };

        wakeServer();

        return () => {
          cancelled = true;
          controller.abort();
          clearInterval(timer);
          clearTimeout(retryTimeout);
        };
      }, [bootTrigger, apiFetch]);

      // 1. Fetch Current User (once server wakes up)
      useEffect(() => {
        if (!token || serverStatus !== "ready") {
          if (!token) setUser(null);
          return;
        }
        let cancelled = false;
        apiFetch("/api/auth/me", {}, "auth_me")
          .then((res) => {
            if (!cancelled) setUser(res.data || null);
          })
          .catch((err) => {
            if (cancelled) return;
            if (err instanceof AppError && err.status === 401) {
              clearSession();
            }
          });
        return () => { cancelled = true; };
      }, [token, serverStatus, apiFetch, clearSession]);

      // 2. Fetch Agents (with pagination, category & search)
      const fetchAgents = useCallback(async (targetPage = 1, append = false) => {
        if (append) {
          setLoadingMoreAgents(true);
        } else {
          agentsAbortRef.current?.abort();
          setLoadingAgents(true);
        }

        const controller = new AbortController();
        if (!append) agentsAbortRef.current = controller;

        setAgentsLoadFailed(false);
        try {
          const params = new URLSearchParams();
          params.append("page", String(targetPage));
          params.append("limit", String(AGENTS_PER_PAGE));
          if (selectedCategory !== "All") params.append("category", selectedCategory);
          if (searchQuery.trim()) params.append("search", searchQuery.trim());

          const res = await apiFetch(
            `/api/agents?${params.toString()}`,
            { signal: controller.signal },
            "load_agents"
          );
          if (controller.signal.aborted) return;

          const list = Array.isArray(res.data) ? res.data : [];
          const pagination = res.pagination || { total: list.length, page: targetPage, pages: 1 };

          if (append) {
            setAgents((prev) => {
              const seen = new Set(prev.map((a) => a._id));
              return [...prev, ...list.filter((a) => !seen.has(a._id))];
            });
          } else {
            setAgents(list);
          }
          setAgentsPagination(pagination);

          if (res.stats) {
            setHeroStats({
              totalAgents: res.stats.totalAgents ?? pagination.total ?? list.length,
              totalViews: res.stats.totalViews ?? 0,
            });
          } else if (!append && selectedCategory === "All" && !searchQuery.trim()) {
            setHeroStats({
              totalAgents: pagination.total ?? list.length,
              totalViews: list.reduce((acc, a) => acc + (Number(a.viewsCount) || 0), 0),
            });
          }
        } catch (err) {
          if (err?.name === "AbortError" && !(err instanceof AppError)) return;
          if (!append) setAgentsLoadFailed(true);
          notify(getFriendlyError(err, lang, "load_agents"), "error");
        } finally {
          if (append) {
            setLoadingMoreAgents(false);
          } else if (!controller.signal.aborted) {
            setLoadingAgents(false);
          }
        }
      }, [selectedCategory, searchQuery, apiFetch, lang, notify]);

      useEffect(() => {
        if (serverStatus !== "ready") return;
        if (isFirstReadyRef.current) {
          isFirstReadyRef.current = false;
          return;
        }
        const timer = setTimeout(() => fetchAgents(1, false), 250);
        return () => clearTimeout(timer);
      }, [serverStatus, fetchAgents]);

      const loadProfileAgents = useCallback(async (account) => {
        setProfileLoading(true);
        setProfileError("");
        try {
          let list = [];
          try {
            const res = await apiFetch("/api/my-agents", {}, "load_agents");
            list = Array.isArray(res.data) ? res.data : [];
          } catch (err) {
            if (err instanceof AppError && err.status === 404) {
              const fallback = await apiFetch("/api/agents?limit=50", {}, "load_agents");
              const raw = Array.isArray(fallback.data) ? fallback.data
                : (Array.isArray(fallback.data?.agents) ? fallback.data.agents : []);
              list = raw.filter((agent) => isAgentOwnedBy(agent, account));
            } else {
              throw err;
            }
          }
          setProfileAgents(list);
        } catch (err) {
          setProfileError(getFriendlyError(err, lang, "load_agents"));
        } finally {
          setProfileLoading(false);
        }
      }, [apiFetch, lang]);

      const navigateToExplore = useCallback((options = {}) => {
        abortActiveStream();
        setShowMobileHistory(false);
        setView("explore");
        if (!options.skipPush) {
          syncUrlRoute("explore", "", Boolean(options.replaceUrl));
        }
      }, [abortActiveStream]);

      const openProfile = useCallback((options = {}) => {
        if (!token || !user) {
          setAuthMode("login");
          setShowAuthModal(true);
          return;
        }
        setView("profile");
        if (!options.skipPush) {
          syncUrlRoute("profile", "", Boolean(options.replaceUrl));
        }
        loadProfileAgents(user);
      }, [token, user, loadProfileAgents]);

      const scrollToSection = (ref) => {
        if (view !== "explore") {
          navigateToExplore();
          setTimeout(() => ref.current?.scrollIntoView({ behavior: "smooth" }), 100);
        } else {
          ref.current?.scrollIntoView({ behavior: "smooth" });
        }
      };

      // 3. Smooth non-blocking auto-scroll for chat messages
      const scrollToBottom = (smooth = true) => {
        const el = chatContainerRef.current;
        if (!el) return;
        el.scrollTo({
          top: el.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      };

      useEffect(() => {
        const el = chatContainerRef.current;
        if (!el) return;
        if (sendingMessage) {
          const distanceFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
          if (distanceFromBottom < 180) {
            el.scrollTop = el.scrollHeight;
          }
        } else {
          scrollToBottom(true);
        }
      }, [messages, sendingMessage]);

      // Fetch Agent Memory
      const fetchAgentMemory = async (slug) => {
        if (!token || !slug) {
          setAgentMemory("");
          return;
        }
        try {
          const memRes = await apiFetch(`/api/agents/${encodeURIComponent(slug)}/memory`, {}, "memory");
          setAgentMemory(memRes.data?.summary || "");
        } catch {
          setAgentMemory("");
        }
      };

      const handleClearAgentMemory = async () => {
        if (!activeAgent || !token || clearingMemory) return;
        setClearingMemory(true);
        setMemoryError("");
        try {
          await apiFetch(`/api/agents/${encodeURIComponent(activeAgent.slug)}/memory`, { method: "DELETE" }, "memory");
          setAgentMemory("");
          setShowMemoryModal(false);
          notify(lang === "ar" ? "تم تصفير ذاكرة التقدم بنجاح" : "Progress memory cleared", "success");
        } catch (err) {
          setMemoryError(getFriendlyError(err, lang, "memory"));
        } finally {
          setClearingMemory(false);
        }
      };

      // Open Agent Chat Workspace
      const openAgentWorkspace = useCallback(async (slug, options = {}) => {
        abortActiveStream();
        try {
          const res = await apiFetch(`/api/agents/${encodeURIComponent(slug)}`, {}, "open_agent");
          const agentData = res.data;
          if (!agentData) throw new AppError("NOT_FOUND", 404, "open_agent");

          setActiveAgent(agentData);
          setShowMobileHistory(false);
          setActiveConversationId(null);
          setMessages([]);
          setView("chat");
          if (!options.skipPush) {
            syncUrlRoute("chat", agentData.slug, Boolean(options.replaceUrl));
          }

          if (token) {
            const [convResult] = await Promise.allSettled([
              apiFetch(`/api/conversations?agentId=${encodeURIComponent(agentData._id)}`, {}, "load_chat"),
              fetchAgentMemory(slug),
            ]);
            setConversations(
              convResult.status === "fulfilled" && Array.isArray(convResult.value?.data)
                ? convResult.value.data
                : []
            );
          } else {
            setConversations([]);
            setAgentMemory("");
          }
        } catch (err) {
          notify(getFriendlyError(err, lang, "open_agent"), "error");
          if (options.fromInitialRoute) {
            setView("explore");
            syncUrlRoute("explore", "", true);
          }
        }
      }, [abortActiveStream, apiFetch, token, lang, notify]);

      const handleShareAgent = useCallback(async (agentObj) => {
        if (!agentObj?.slug) return;
        const shareUrl = buildShareUrlForAgent(agentObj.slug);
        try {
          await navigator.clipboard.writeText(shareUrl);
          notify(lang === "ar" ? "تم نسخ رابط الوكيل للمشاركة" : "Agent link copied to clipboard", "success");
        } catch {
          notify(shareUrl, "info");
        }
      }, [lang, notify]);

      const handleShareCreator = useCallback(async (username) => {
        if (!username) return;
        const shareUrl = buildShareUrlForCreator(username);
        try {
          await navigator.clipboard.writeText(shareUrl);
          notify(lang === "ar" ? "تم نسخ رابط الملف الشخصي" : "Profile link copied to clipboard", "success");
        } catch {
          notify(shareUrl, "info");
        }
      }, [lang, notify]);

      const openCreatorProfile = useCallback(async (username, options = {}) => {
        const cleanUsername = String(username || "").trim().toLowerCase();
        if (!cleanUsername) return;
        abortActiveStream();
        setShowMobileHistory(false);
        setView("creator");
        if (!options.skipPush) {
          syncUrlRoute("creator", cleanUsername, Boolean(options.replaceUrl));
        }
        setCreatorProfile({
          user: { username: cleanUsername, displayName: cleanUsername },
          agents: [],
          loading: true,
          error: "",
        });
        try {
          const res = await apiFetch(`/api/users/${encodeURIComponent(cleanUsername)}`, {}, "open_creator");
          const payload = res.data;
          if (!payload?.user) throw new AppError("NOT_FOUND", 404, "open_creator");
          setCreatorProfile({
            user: payload.user,
            agents: Array.isArray(payload.agents) ? payload.agents : [],
            loading: false,
            error: "",
          });
        } catch (err) {
          const msg = getFriendlyError(err, lang, "open_creator");
          setCreatorProfile((prev) => ({ ...prev, loading: false, error: msg }));
          if (options.fromInitialRoute) {
            notify(msg, "error");
          }
        }
      }, [abortActiveStream, apiFetch, lang, notify]);

      // Apply initial URL route once server is ready
      useEffect(() => {
        if (serverStatus !== "ready" || initialRouteHandledRef.current) return;
        const route = initialRouteRef.current;

        if (route.view === "chat" && route.slug) {
          initialRouteHandledRef.current = true;
          openAgentWorkspace(route.slug, { skipPush: true, fromInitialRoute: true });
          return;
        }

        if (route.view === "creator" && route.username) {
          initialRouteHandledRef.current = true;
          openCreatorProfile(route.username, { skipPush: true, fromInitialRoute: true });
          return;
        }

        if (route.view === "profile") {
          if (!token) {
            initialRouteHandledRef.current = true;
            setAuthMode("login");
            setShowAuthModal(true);
            syncUrlRoute("explore", "", true);
            return;
          }
          if (user) {
            initialRouteHandledRef.current = true;
            setView("profile");
            loadProfileAgents(user);
          }
          return;
        }

        initialRouteHandledRef.current = true;
      }, [serverStatus, token, user, openAgentWorkspace, openCreatorProfile, loadProfileAgents]);

      // Sync with Browser Back / Forward buttons
      useEffect(() => {
        const handleRouteChange = () => {
          const route = parseRouteFromLocation();
          if (route.view === "chat" && route.slug) {
            if (activeAgent?.slug === route.slug) {
              setView("chat");
            } else {
              openAgentWorkspace(route.slug, { skipPush: true, fromInitialRoute: true });
            }
          } else if (route.view === "creator" && route.username) {
            if (creatorProfile.user?.username?.toLowerCase() === route.username && !creatorProfile.error) {
              setView("creator");
            } else {
              openCreatorProfile(route.username, { skipPush: true, fromInitialRoute: true });
            }
          } else if (route.view === "profile") {
            if (token && user) {
              openProfile({ skipPush: true });
            } else {
              navigateToExplore({ skipPush: true, replaceUrl: true });
              setAuthMode("login");
              setShowAuthModal(true);
            }
          } else {
            navigateToExplore({ skipPush: true });
          }
        };

        window.addEventListener("popstate", handleRouteChange);
        window.addEventListener("hashchange", handleRouteChange);
        return () => {
          window.removeEventListener("popstate", handleRouteChange);
          window.removeEventListener("hashchange", handleRouteChange);
        };
      }, [activeAgent, creatorProfile.user, creatorProfile.error, token, user, openAgentWorkspace, openCreatorProfile, openProfile, navigateToExplore]);

      // Load specific conversation
      const selectConversation = async (convId) => {
        abortActiveStream();
        setActiveConversationId(convId);
        setShowMobileHistory(false);
        setLoadingMessages(true);
        try {
          const res = await apiFetch(`/api/conversations/${encodeURIComponent(convId)}/messages`, {}, "load_chat");
          setMessages(Array.isArray(res.data) ? res.data : []);
          requestAnimationFrame(() => scrollToBottom(false));
        } catch (err) {
          notify(getFriendlyError(err, lang, "load_chat"), "error");
        } finally {
          setLoadingMessages(false);
        }
      };

      // Delete conversation
      const handleDeleteConversation = async (e, convId) => {
        e.stopPropagation();
        try {
          await apiFetch(`/api/conversations/${encodeURIComponent(convId)}`, { method: "DELETE" }, "load_chat");
          setConversations((prev) => prev.filter((c) => c._id !== convId));
          if (activeConversationId === convId) {
            abortActiveStream();
            setActiveConversationId(null);
            setMessages([]);
          }
          notify(lang === "ar" ? "تم حذف المحادثة" : "Conversation deleted", "success");
        } catch (err) {
          notify(getFriendlyError(err, lang, "load_chat"), "error");
        }
      };

      // Send Chat Message (SSE Streaming)
      const handleSendMessage = async (textOverride) => {
        const textToSend = (textOverride ?? inputMessage).trim();
        if (!textToSend || sendingMessage || !activeAgent) return;

        if (!token) {
          notify(lang === "ar" ? "سجّل الدخول أولاً لبدء المحادثة" : "Please sign in to start chatting", "error");
          setAuthMode("login");
          setShowAuthModal(true);
          return;
        }

        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          notify(getFriendlyError(new AppError("NETWORK_ERROR", 0, "chat"), lang, "chat"), "error");
          return;
        }

        const tempUserId = `u_${Date.now()}`;
        const tempModelId = `m_${Date.now() + 1}`;

        const tempUserMsg = { _id: tempUserId, role: "user", text: textToSend };
        const tempModelMsg = { _id: tempModelId, role: "model", text: "" };

        setMessages((prev) => [...prev, tempUserMsg, tempModelMsg]);
        if (!textOverride) {
          setInputMessage("");
          if (textareaRef.current) textareaRef.current.style.height = "auto";
        }
        setSendingMessage(true);
        requestAnimationFrame(() => scrollToBottom(true));

        const controller = new AbortController();
        streamAbortRef.current = controller;
        userCancelledStreamRef.current = false;

        let receivedDone = false;
        let receivedAnyChunk = false;

        try {
          const response = await fetch(`${API_BASE}/api/agents/${encodeURIComponent(activeAgent.slug)}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              message: textToSend,
              conversationId: activeConversationId,
            }),
            signal: controller.signal,
          });

          if (!response.ok) {
            let errData = null;
            try {
              errData = await response.json();
            } catch {
              errData = null;
            }
            if (response.status === 401) {
              clearSession();
              setAuthMode("login");
              setShowAuthModal(true);
            }
            const code = classifyHttpError(response.status, errData?.error, "chat");
            throw new AppError(code, response.status, "chat");
          }

          if (!response.body || typeof response.body.getReader !== "function") {
            throw new AppError("CHAT_INTERRUPTED", 500, "chat");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";

            for (const part of parts) {
              const line = part.trim();
              if (!line.startsWith("data:")) continue;

              const jsonStr = line.replace(/^data:\s*/, "");
              if (!jsonStr || jsonStr === "[DONE]") continue;

              let data;
              try {
                data = JSON.parse(jsonStr);
              } catch {
                continue;
              }

              if (data.error) {
                const isRate = /rate|quota|limit|429/i.test(String(data.error));
                throw new AppError(isRate ? "RATE_LIMITED" : "CHAT_INTERRUPTED", isRate ? 429 : 500, "chat");
              }

              if (data.chunk) {
                receivedAnyChunk = true;
                setMessages((prev) =>
                  prev.map((msg) =>
                    msg._id === tempModelId
                      ? { ...msg, text: msg.text + data.chunk }
                      : msg
                  )
                );
              }

              if (data.done) {
                receivedDone = true;
                if (Array.isArray(data.messages)) {
                  setMessages((prev) => [
                    ...prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId),
                    ...data.messages,
                  ]);
                }

                if (!activeConversationId && data.conversationId) {
                  setActiveConversationId(data.conversationId);
                  setConversations((prev) => [
                    {
                      _id: data.conversationId,
                      title: data.title,
                      agent: activeAgent,
                      updatedAt: new Date().toISOString(),
                    },
                    ...prev,
                  ]);
                }

                const currentSlug = activeAgent.slug;
                setTimeout(() => fetchAgentMemory(currentSlug), 1800);
              }
            }
          }

          if (!receivedDone && !receivedAnyChunk) {
            throw new AppError("CHAT_INTERRUPTED", 500, "chat");
          }
        } catch (err) {
          if (userCancelledStreamRef.current) {
            if (!receivedAnyChunk) {
              setMessages((prev) =>
                prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId)
              );
              if (!textOverride) {
                setInputMessage(textToSend);
              }
            }
            return;
          }
          notify(getFriendlyError(err, lang, "chat"), "error");
          if (!receivedAnyChunk) {
            setMessages((prev) =>
              prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId)
            );
            if (!textOverride) {
              setInputMessage(textToSend);
            }
          } else {
            setMessages((prev) =>
              prev.filter((m) => !(m._id === tempModelId && !m.text))
            );
          }
        } finally {
          if (streamAbortRef.current === controller) {
            streamAbortRef.current = null;
          }
          setSendingMessage(false);
        }
      };

      const handleUpdateBio = useCallback(async (newBio) => {
        const res = await apiFetch("/api/auth/me", {
          method: "PATCH",
          body: JSON.stringify({ bio: newBio }),
        }, "profile_bio");
        if (res.data) {
          setUser((prev) => ({ ...(prev || {}), ...res.data }));
        } else {
          setUser((prev) => (prev ? { ...prev, bio: newBio } : prev));

        notify(lang === "ar" ? "تم تحديث النبذة التعريفية بنجاح" : "Bio updated successfully", "success");
