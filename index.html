<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AgentTube — AI Agent Studio & Hub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgMain: '#070B14',
            bgSurface: '#0D1424',
            bgCard: '#131C31',
            bgElevated: '#1C2742',
            accent: '#8B7CF7',
            accentHover: '#6366F1',
          },
          fontFamily: {
            sans: ['Inter', 'Cairo', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts (Inter + Cairo for Arabic/English support) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Rich Markdown + safe HTML sanitization + code syntax highlighting -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --surface: #0D1424;
      --border: rgba(145, 164, 203, 0.12);
      --accent: #8B7CF7;
      --muted: #94a3b8;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(ellipse 850px 460px at 88% -100px, rgba(109, 74, 224, 0.18), transparent 72%),
        radial-gradient(ellipse 750px 450px at -8% 20%, rgba(30, 82, 168, 0.12), transparent 70%),
        #070B14;
      color: #E2E8F0;
      font-family: 'Inter', 'Cairo', sans-serif;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    /* Lock outer document completely when inside Chat Workspace */
    html.chat-locked,
    html.chat-locked body {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
    }

    /* Smooth native scrolling container for chat messages */
    .chat-scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .sidebar-scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.7);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.6);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    * {
      scrollbar-color: #334155 transparent;
    }

    button, input, select, textarea {
      font: inherit;
    }
    button {
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid #a5b4fc;
      outline-offset: 2px;
    }

    /* Glass Panels & Surfaces */
    .glass-panel {
      background: rgba(9, 14, 26, 0.88);
      border-color: rgba(130, 148, 186, 0.12);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    .premium-hero {
      isolation: isolate;
      position: relative;
      background: linear-gradient(125deg, #162140 0%, #11182E 52%, #181430 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 24px 70px rgba(0, 0, 0, 0.28);
    }
    .premium-hero::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 78% 25%, rgba(139, 124, 247, 0.28), transparent 48%),
        radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.12), transparent 45%);
    }
    .premium-hero::after {
      content: "";
      pointer-events: none;
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      right: -120px;
      top: -210px;
      border: 64px solid rgba(255, 255, 255, 0.025);
    }

    .hero-accent {
      background: linear-gradient(95deg, #c4b5fd 0%, #818cf8 48%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .workflow-panel {
      background: linear-gradient(150deg, rgba(22, 32, 58, 0.92), rgba(12, 18, 34, 0.92));
      border: 1px solid rgba(165, 180, 252, 0.18);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .agent-card {
      background: linear-gradient(160deg, rgba(21, 30, 52, 0.92), rgba(14, 21, 38, 0.96));
      border: 1px solid rgba(139, 155, 195, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 6px 20px rgba(0, 0, 0, 0.14);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }
    .agent-card:hover {
      background: linear-gradient(160deg, rgba(29, 40, 68, 0.96), rgba(19, 28, 49, 0.98));
      border-color: rgba(139, 124, 247, 0.5);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(139, 124, 247, 0.12);
    }

    /* Chat Workspace */
    .chat-shell {
      background: #080D18;
    }
    .chat-aside {
      background: linear-gradient(180deg, #0F172A, #0B111E);
    }
    .chat-message-assistant {
      background: linear-gradient(150deg, rgba(23, 33, 54, 0.95), rgba(17, 25, 42, 0.97));
      border: 1px solid rgba(136, 155, 194, 0.14);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.14);
    }
    .chat-message-user {
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.22);
    }
    .chat-composer {
      background: linear-gradient(135deg, #141E33, #111A2D);
      border: 1px solid rgba(142, 155, 188, 0.22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }
    .chat-composer:focus-within {
      border-color: rgba(139, 124, 247, 0.75);
      box-shadow: 0 0 0 3px rgba(139, 124, 247, 0.14), 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .modal-shell {
      background: linear-gradient(160deg, #162038, #0F172A);
      border: 1px solid rgba(165, 180, 214, 0.18);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.65);
    }

    /* Profile Page */
    .profile-shell {
      background: linear-gradient(155deg, rgba(19, 28, 49, 0.96), rgba(12, 19, 34, 0.98));
      border: 1px solid rgba(147, 165, 205, 0.15);
      box-shadow: 0 26px 72px rgba(0, 0, 0, 0.24);
    }
    .profile-cover {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(circle at 76% -40%, rgba(167, 139, 250, 0.4), transparent 52%),
        radial-gradient(circle at 5% 105%, rgba(56, 189, 248, 0.28), transparent 48%),
        linear-gradient(120deg, #1E2559 0%, #241E4B 54%, #111933 100%);
    }
    .profile-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to right, transparent 15%, black);
      opacity: 0.35;
      pointer-events: none;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border: 5px solid #131C31;
      border-radius: 26px;
      background: linear-gradient(135deg, #6366F1, #3B82F6);
      box-shadow: 0 16px 40px rgba(3, 7, 22, 0.4);
      overflow: hidden;
    }
    .profile-stat {
      background: linear-gradient(145deg, rgba(28, 39, 66, 0.65), rgba(15, 23, 42, 0.6));
      border: 1px solid rgba(150, 166, 206, 0.13);
    }
    .profile-info-card {
      background: linear-gradient(155deg, rgba(20, 30, 50, 0.95), rgba(13, 21, 36, 0.98));
      border: 1px solid rgba(145, 163, 198, 0.14);
    }
    .profile-nav-active {
      background: rgba(139, 124, 247, 0.16);
      color: #c4b5fd;
    }

    /* Animations */
    @keyframes toastSlideIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .toast-enter {
      animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .modal-enter {
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Formatted Markdown & Code */
    .chat-rich { min-width: 0; line-height: 1.78; overflow-wrap: anywhere; }
    .chat-rich > :first-child { margin-top: 0; }
    .chat-rich > :last-child { margin-bottom: 0; }
    .chat-rich p { margin: 0.35em 0 0.9em; }
    .chat-rich h1, .chat-rich h2, .chat-rich h3, .chat-rich h4 {
      color: #f1f5ff; letter-spacing: -0.02em; font-weight: 700; line-height: 1.45;
      margin: 1.15em 0 0.45em;
    }
    .chat-rich h1 { font-size: 1.35rem; }
    .chat-rich h2 { font-size: 1.18rem; }
    .chat-rich h3 { font-size: 1.05rem; }
    .chat-rich h4 { font-size: 0.98rem; }
    .chat-rich strong { color: #f8fafc; font-weight: 700; }
    .chat-rich em { color: #c7d2fe; }
    .chat-rich ul, .chat-rich ol { padding-inline-start: 1.45rem; margin: 0.5em 0 1em; }
    .chat-rich ul { list-style-type: disc; }
    .chat-rich ol { list-style-type: decimal; }
    .chat-rich li { padding-inline-start: 0.15rem; margin: 0.25em 0; }
    .chat-rich li::marker { color: #818cf8; }
    .chat-rich a { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }
    .chat-rich a:hover { color: #dbeafe; }
    .chat-rich blockquote {
      margin: 1em 0; padding: 0.6rem 1rem;
      border-inline-start: 3px solid #8B7CF7;
      border-radius: 0 0.5rem 0.5rem 0;
      background: rgba(139, 124, 247, 0.08); color: #cbd5e1;
    }
    .chat-rich hr { margin: 1.15rem 0; border: 0; height: 1px; background: rgba(148, 163, 184, 0.2); }
    .chat-rich :not(pre) > code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.83em; direction: ltr; unicode-bidi: isolate;
      color: #d8b4fe; background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.18); border-radius: 0.375rem;
      padding: 0.14rem 0.38rem; overflow-wrap: anywhere;
    }
    .chat-rich .table-scroll { overflow-x: auto; max-width: 100%; margin: 0.9em 0; border-radius: 0.6rem; }
    .chat-rich table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .chat-rich th, .chat-rich td { border: 1px solid rgba(135, 155, 190, 0.2); padding: 0.55rem 0.75rem; text-align: start; }
    .chat-rich th { background: rgba(139, 124, 247, 0.14); color: #e2e8f0; }
    .chat-rich tr:nth-child(even) { background: rgba(255, 255, 255, 0.025); }
    .chat-message-user .chat-rich strong, .chat-message-user .chat-rich h1,
    .chat-message-user .chat-rich h2, .chat-message-user .chat-rich h3 { color: white; }
    .chat-message-user .chat-rich :not(pre) > code { color: white; background: rgba(255, 255, 255, 0.18); border-color: rgba(255,255,255,0.2); }

    .code-window {
      overflow: hidden; max-width: 100%; margin: 0.95rem 0;
      background: #090E1A; border: 1px solid #26334D;
      border-radius: 0.85rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    }
    .code-titlebar {
      background: linear-gradient(90deg, #131C31, #17223B);
      border-bottom: 1px solid rgba(128, 147, 178, 0.16);
    }
    .code-window pre {
      margin: 0; padding: 1rem 1.15rem;
      overflow-x: auto; overflow-y: auto; max-height: 520px;
      tab-size: 2; white-space: pre; word-break: normal;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; line-height: 1.8;
    }
    .code-window code.hljs { display: block; background: transparent; padding: 0; color: #dce4f7; }
    .hljs { color: #dce4f7; }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: #c4a7ff; }
    .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: #82b6ff; }
    .hljs-string, .hljs-attr, .hljs-attribute, .hljs-template-variable { color: #a9dfb1; }
    .hljs-number, .hljs-symbol, .hljs-bullet { color: #f4be91; }
    .hljs-comment, .hljs-quote { color: #7486a3; font-style: italic; }
    .hljs-built_in, .hljs-variable.language_, .hljs-meta { color: #88d4e6; }
    .hljs-params, .hljs-variable, .hljs-property { color: #dce4f7; }
    .hljs-name, .hljs-tag, .hljs-selector-class, .hljs-selector-id { color: #f3a5c7; }
    .hljs-addition { color: #a8e7bd; background: rgba(29, 145, 95, 0.10); }
    .hljs-deletion { color: #fca5a5; background: rgba(190, 38, 38, 0.12); }

    /* Mobile Specific Adjustments */
    @media (max-width: 639px) {
      #root { min-width: 0; }
      .profile-avatar { width: 84px; height: 84px; border-radius: 22px; }
      .premium-hero::after { display: none; }
      .code-window { border-radius: 0.7rem; }
      .code-window pre { font-size: 11.5px; padding: 0.85rem; }
      .chat-composer-wrap { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
      input, textarea, select {
        font-size: 16px !important; /* Prevents iOS Safari auto-zoom on focus */
      }
      .mobile-toast {
        bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
        left: 1rem;
        right: 1rem;
      }
      html.chat-locked .mobile-toast {
        bottom: 5.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Backend URL Configuration
    const API_BASE = "https://agents-377s.onrender.com";

    const CATEGORIES = [
      "All",
      "General",
      "Coding",
      "Writing",
      "Business",
      "Education",
      "Productivity",
      "Creative"
    ];

    const CATEGORY_STYLES = {
      General: "bg-indigo-500/15 text-indigo-300 border-indigo-400/20",
      Coding: "bg-emerald-500/15 text-emerald-300 border-emerald-400/20",
      Writing: "bg-amber-500/15 text-amber-300 border-amber-400/20",
      Business: "bg-sky-500/15 text-sky-300 border-sky-400/20",

      Creative: "bg-fuchsia-500/15 text-fuchsia-300 border-fuchsia-400/20",
    };

    // ==========================================
    // SVG Icons Component
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sparkles: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        ),

        ),

          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        ),

          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        ),
        eye: (
          <React.Fragment>
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </React.Fragment>
        ),
        back: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        ),
        logout: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        ),
        close: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        ),
        user: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />

        compass: (
          <React.Fragment>
            <circle cx="12" cy="12" r="9" strokeWidth="1.8" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" strokeWidth="1.8" strokeLinejoin="round" />
          </React.Fragment>
        ),
        calendar: (
          <React.Fragment><rect x="3" y="5" width="18" height="16" rx="2" strokeWidth="1.8" /><path strokeLinecap="round" strokeWidth="1.8" d="M7 3v4m10-4v4M3 10h18" /></React.Fragment>
        ),
        mail: (
          <React.Fragment><rect x="3" y="5" width="18" height="14" rx="2" strokeWidth="1.8" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="m3 7 9 6 9-6" /></React.Fragment>

          <React.Fragment><rect x="3" y="3" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" strokeWidth="1.8"/></React.Fragment>
        ),
        refresh: (
          <React.Fragment><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M20 7v5h-5M4 17v-5h5"/><path strokeLinecap="round" strokeWidth="1.8" d="M5.7 9A7 7 0 0 1 18.5 7L20 12M4 12l1.5 5A7 7 0 0 0 18.3 15" /></React.Fragment>

          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m5 12 4 4L19 6" />

        arrow: (

      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    // ==========================================
    // Rich Markdown & Syntax-Highlighted Code
    // ==========================================
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const syntaxAliases = {
      js: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript",
      py: "python", sh: "bash", shell: "bash", zsh: "bash",
      html: "xml", svg: "xml", yml: "yaml", md: "markdown",
      cs: "csharp", csharp: "csharp", cplusplus: "cpp", rb: "ruby"
    };

    function CodeSnippet({ code, language = "" }) {
      const [copied, setCopied] = useState(false);
      const resetRef = useRef(null);
      useEffect(() => () => clearTimeout(resetRef.current), []);
      const normalized = (syntaxAliases[language.toLowerCase()] || language).toLowerCase();
      let highlighted = escapeHtml(code);
      let detected = normalized;

      if (window.hljs) {
        try {
          if (normalized && window.hljs.getLanguage(normalized)) {
            highlighted = window.hljs.highlight(code, { language: normalized, ignoreIllegals: true }).value;
          } else {
            const result = window.hljs.highlightAuto(code);
            highlighted = result.value;
            detected = result.language || normalized || "text";
          }
        } catch (e) { highlighted = escapeHtml(code); }
      }

      const copyCode = async () => {
        try {
          await navigator.clipboard.writeText(code);
          setCopied(true);
          clearTimeout(resetRef.current);
          resetRef.current = setTimeout(() => setCopied(false), 2000);
        } catch (e) {}
      };

      return (
        <div className="code-window" dir="ltr">
          <div className="code-titlebar flex items-center justify-between gap-3 px-3.5 py-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="flex gap-1.5" aria-hidden="true">
                <span className="w-2.5 h-2.5 rounded-full bg-rose-400/80" />
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400/80" />
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400/80" />
              </span>
              <span className="font-mono text-[11px] text-indigo-200/90 truncate uppercase tracking-wider">
                {language || detected || "code"}
              </span>
            </div>
            <button type="button" onClick={copyCode}
              className="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-medium text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 transition-colors"
              aria-label={copied ? "Code copied" : "Copy code"}>
              <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5 text-indigo-300" />
              {copied ? "Copied" : "Copy"}
            </button>
          </div>
          <pre><code className="hljs" dangerouslySetInnerHTML={{ __html: highlighted }} /></pre>
        </div>
      );
    }

    function MarkdownPart({ source }) {
      if (!source) return null;
      let html;
      if (window.marked && window.DOMPurify) {
        try {
          const renderer = new window.marked.Renderer();
          renderer.html = (token) => escapeHtml(typeof token === "string" ? token : token.text || "");
          html = window.DOMPurify.sanitize(window.marked.parse(source, {
            gfm: true, breaks: true, renderer
          }));
          html = html.replace(/<table>/g, '<div class="table-scroll"><table>')
                     .replace(/<\/table>/g, '</table></div>');
        } catch (e) { html = "<p>" + escapeHtml(source).replace(/\n/g, "<br>") + "</p>"; }
      } else {
        html = "<p>" + escapeHtml(source).replace(/\n/g, "<br>") + "</p>";
      }
      return <div className="chat-rich" dir="auto" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    const FormattedMessage = ({ text }) => {
      if (!text) return null;
      if (!text.includes("```") && /^\s*<(?:\?xml\b|[A-Za-z][\w:-]*[\s>])/.test(text)
        && /<\/[A-Za-z][\w:-]*>/.test(text)) {
        return <CodeSnippet code="{text.trim()}" language="xml"/>;
      }
      const parts = text.split(/(```[\s\S]*?(?:```|$))/g).filter(Boolean);
      return (
        <div className="min-w-0 text-[14px] sm:text-[15px] leading-relaxed" dir="auto">
          {parts.map((part, index) => {
            if (part.startsWith("```")) {
              const inner = part.slice(3).replace(/```$/, "");
              const newline = inner.indexOf("\n");
              const header = newline === -1 ? inner.trim() : inner.slice(0, newline).trim();
              const validLanguage = /^[a-zA-Z][a-zA-Z0-9_+.#-]{0,24}$/.test(header);
              const lang = validLanguage ? header : "";
              const code = validLanguage && newline >= 0 ? inner.slice(newline + 1).replace(/\n$/, "")
                : newline === -1 && validLanguage ? "" : inner.replace(/^\n/, "").replace(/\n$/, "");
              return <CodeSnippet key={index} code={code} language={lang} />;
            }
            return <MarkdownPart key={index} source={part} />;
          })}
        </div>
      );
    };

    function CopyMessageButton({ text }) {
      const [copied, setCopied] = useState(false);
      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch (e) {}
      };
      return (
        <button
          type="button"
          onClick={handleCopy}
          title="Copy message"
          className="inline-flex items-center gap-1 text-[11px] text-slate-500 hover:text-indigo-300 transition-colors mt-1.5 px-1.5 py-0.5 rounded-md hover:bg-white/5"
        >
          <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5" />
          <span>{copied ? "Copied" : "Copy"}</span>
        </button>
      );
    }

    const getAccountId = (value) => {
      if (!value) return "";
      if (typeof value === "string") return value;
      return String(value._id || value.id || "");
    };

    const isAgentOwnedBy = (agent, account) => {
      if (!agent || !account) return false;
      const owner = agent.creator || agent.createdBy || agent.owner;
      const accountId = getAccountId(account);
      const ownerId = getAccountId(owner) || getAccountId(agent.creatorId);
      if (accountId && ownerId && accountId === ownerId) return true;
      if (!owner || typeof owner !== "object") return false;
      const nameA = String(owner.username || "").trim().toLowerCase();
      const nameB = String(account.username || "").trim().toLowerCase();
      return Boolean(nameA && nameB && nameA === nameB);
    };

    // ==========================================
    // Main Application Component
    // ==========================================
    function App() {
      const [token, setToken] = useState(() => localStorage.getItem("agenttube_token") || "");
      const [user, setUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login");

      const [view, setView] = useState("explore"); // "explore" | "chat" | "profile"
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [showMobileHistory, setShowMobileHistory] = useState(false);

      const [agents, setAgents] = useState([]);
      const [loadingAgents, setLoadingAgents] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");

      const [profileAgents, setProfileAgents] = useState([]);
      const [profileLoading, setProfileLoading] = useState(false);
      const [profileError, setProfileError] = useState("");

      const [activeAgent, setActiveAgent] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [activeConversationId, setActiveConversationId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState("");
      const [sendingMessage, setSendingMessage] = useState(false);
      const [loadingMessages, setLoadingMessages] = useState(false);

      const chatContainerRef = useRef(null);
      const textareaRef = useRef(null);

      // Lock document viewport completely when in chat mode so header & sidebar stay 100% static
      useEffect(() => {
        const isChat = view === "chat";
        document.documentElement.classList.toggle("chat-locked", isChat);
        return () => document.documentElement.classList.remove("chat-locked");
      }, [view]);

      useEffect(() => {
        if (!showMobileHistory) return;
        const onKeyDown = (event) => {
          if (event.key === "Escape") setShowMobileHistory(false);
        };
        document.addEventListener("keydown", onKeyDown);
        return () => document.removeEventListener("keydown", onKeyDown);
      }, [showMobileHistory]);

      // Auto-resize chat textarea
      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 140) + "px";
      }, [inputMessage]);

      const notify = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const apiFetch = async (endpoint, options = {}) => {
        const headers = {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        };
        const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        const data = await res.json();
        if (!res.ok || data.success === false) {
          throw new Error(data.error || "Request failed");
        }
        return data;
      };

      // 1. Fetch Current User
      useEffect(() => {
        if (!token) {
          setUser(null);
          return;
        }
        apiFetch("/api/auth/me")
          .then((res) => setUser(res.data))
          .catch(() => {
            localStorage.removeItem("agenttube_token");
            setToken("");
            setUser(null);
          });
      }, [token]);

      // 2. Fetch Agents
      const fetchAgents = async () => {
        setLoadingAgents(true);
        try {
          const params = new URLSearchParams();
          if (selectedCategory !== "All") params.append("category", selectedCategory);
          if (searchQuery.trim()) params.append("search", searchQuery.trim());
          const res = await apiFetch(`/api/agents?${params.toString()}`);
          setAgents(res.data || []);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoadingAgents(false);
        }
      };

      useEffect(() => {
        const timer = setTimeout(fetchAgents, 250);
        return () => clearTimeout(timer);
      }, [selectedCategory, searchQuery]);

      const loadProfileAgents = async (account) => {
        setProfileLoading(true);
        setProfileError("");
        try {
          const res = await apiFetch("/api/agents?limit=50");
          const list = Array.isArray(res.data) ? res.data
            : (Array.isArray(res.data?.agents) ? res.data.agents : []);
          setProfileAgents(list.filter((agent) => isAgentOwnedBy(agent, account)));
        } catch (err) {
          setProfileError(err.message || "Could not load your agents.");
        } finally {
          setProfileLoading(false);
        }
      };

      const openProfile = () => {
        if (!token || !user) {
          setAuthMode("login");
          setShowAuthModal(true);
          return;
        }
        setView("profile");
        loadProfileAgents(user);
      };

      // 3. Smooth non-blocking auto-scroll for chat messages
      const scrollToBottom = (smooth = true) => {
        const el = chatContainerRef.current;
        if (!el) return;
        el.scrollTo({
          top: el.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      };

      useEffect(() => {
        const el = chatContainerRef.current;
        if (!el) return;
        // During active streaming, only follow bottom if user hasn't scrolled up
        if (sendingMessage) {
          const distanceFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
          if (distanceFromBottom < 180) {
            el.scrollTop = el.scrollHeight;
          }
        } else {
          scrollToBottom(true);
        }
      }, [messages, sendingMessage]);

      // Open Agent Chat Workspace
      const openAgentWorkspace = async (slug) => {
        try {
          const res = await apiFetch(`/api/agents/${slug}`);
          const agentData = res.data;
          setActiveAgent(agentData);
          setShowMobileHistory(false);
          setActiveConversationId(null);
          setMessages([]);
          setView("chat");

          if (token) {
            const convRes = await apiFetch(`/api/conversations?agentId=${agentData._id}`);
            setConversations(convRes.data || []);
          } else {
            setConversations([]);
          }
        } catch (err) {
          notify(err.message, "error");
        }
      };

      // Load specific conversation
      const selectConversation = async (convId) => {
        setActiveConversationId(convId);
        setShowMobileHistory(false);
        setLoadingMessages(true);
        try {
          const res = await apiFetch(`/api/conversations/${convId}/messages`);
          setMessages(res.data || []);
          requestAnimationFrame(() => scrollToBottom(false));
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoadingMessages(false);
        }
      };

      // Delete conversation
      const handleDeleteConversation = async (e, convId) => {
        e.stopPropagation();
        try {
          await apiFetch(`/api/conversations/${convId}`, { method: "DELETE" });
          setConversations((prev) => prev.filter((c) => c._id !== convId));
          if (activeConversationId === convId) {
            setActiveConversationId(null);
            setMessages([]);
          }
          notify("Conversation deleted", "success");
        } catch (err) {
          notify(err.message, "error");
        }
      };

      // Send Chat Message (SSE Streaming)
      const handleSendMessage = async (textOverride) => {
        const textToSend = (textOverride ?? inputMessage).trim();
        if (!textToSend || sendingMessage || !activeAgent) return;

        if (!token) {
          notify("Please sign in to chat with agents", "error");
          setShowAuthModal(true);
          return;
        }

        const tempUserId = Date.now().toString();
        const tempModelId = (Date.now() + 1).toString();

        const tempUserMsg = { _id: tempUserId, role: "user", text: textToSend };
        const tempModelMsg = { _id: tempModelId, role: "model", text: "" };

        setMessages((prev) => [...prev, tempUserMsg, tempModelMsg]);
        if (!textOverride) {
          setInputMessage("");
          if (textareaRef.current) textareaRef.current.style.height = "auto";
        }
        setSendingMessage(true);
        requestAnimationFrame(() => scrollToBottom(true));

        try {
          const response = await fetch(`${API_BASE}/api/agents/${activeAgent.slug}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              message: textToSend,
              conversationId: activeConversationId,
            }),
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || "Failed to send message");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";

            for (const part of parts) {
              const line = part.trim();
              if (!line.startsWith("data:")) continue;

              const jsonStr = line.replace(/^data:\s*/, "");
              const data = JSON.parse(jsonStr);

              if (data.error) {
                throw new Error(data.error);
              }

              if (data.chunk) {
                setMessages((prev) =>
                  prev.map((msg) =>
                    msg._id === tempModelId
                      ? { ...msg, text: msg.text + data.chunk }
                      : msg
                  )
                );
              }

              if (data.done) {
                if (data.messages) {
                  setMessages((prev) => [
                    ...prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId),
                    ...data.messages,
                  ]);
                }

                if (!activeConversationId && data.conversationId) {
                  setActiveConversationId(data.conversationId);
                  setConversations((prev) => [
                    {
                      _id: data.conversationId,
                      title: data.title,
                      agent: activeAgent,
                      updatedAt: new Date().toISOString(),
                    },
                    ...prev,
                  ]);
                }
              }
            }
          }
        } catch (err) {
          notify(err.message, "error");
          setMessages((prev) =>
            prev.filter((m) => !(m._id === tempModelId && m.text === ""))
          );
        } finally {
          setSendingMessage(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("agenttube_token");
        setToken("");
        setUser(null);
        setConversations([]);
        setShowMobileHistory(false);
        setProfileAgents([]);
        setProfileError("");
        if (view === "profile") setView("explore");
        notify("Signed out successfully");
      };

      const isChatView = view === "chat";

      return (
        <div
          className={`flex flex-col bg-bgMain text-slate-200 ${
            isChatView
              ? "h-[100dvh] max-h-[100dvh] overflow-hidden"
              : "min-h-[100dvh] pb-16 sm:pb-0"
          }`}
        >
          {/* Toast Notification */}
          {toast && (
            <div className="mobile-toast toast-enter fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border bg-bgElevated/95 backdrop-blur-md border-slate-700/80 text-sm font-medium">
              <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${toast.type === "error" ? "bg-rose-500 shadow-[0_0_10px_#f43f5e]" : "bg-emerald-400 shadow-[0_0_10px_#34d399]"}`}></span>
              <span className="text-slate-100">{toast.msg}</span>
            </div>
          )}

          {/* Top Navigation Bar (Static & Non-Scrolling) */}
          <header className="sticky top-0 z-30 flex-shrink-0 glass-panel border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 min-h-14 sm:h-16 flex flex-wrap sm:flex-nowrap items-center justify-between gap-x-3 gap-y-2 py-2 sm:py-0">
              {/* Brand Logo */}
              <div
                onClick={() => setView("explore")}
                className="flex items-center gap-3 cursor-pointer group flex-shrink-0"
              >
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-violet-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
                  <Icon name="sparkles" className="w-5 h-5 text-white" />
                </div>
                <div className="flex items-center">
                  <span className="text-lg font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    AgentTube
                  </span>
                  <span className="ml-2 text-[10px] sm:text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-400/25">
                    Studio
                  </span>
                </div>
              </div>

              {/* Search Bar (Visible in Explore View) */}
              {view === "explore" && (
                <div className="order-3 basis-full min-w-0 sm:order-none sm:basis-auto sm:flex-1 max-w-none sm:max-w-md mx-0 sm:mx-4">
                  <div className="relative group">
                    <Icon name="search" className="w-4 h-4 text-slate-400 group-focus-within:text-indigo-400 transition-colors absolute left-3.5 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search AI agents..."
                      dir="auto"
                      className="w-full pl-10 pr-8 py-2 rounded-xl bg-bgSurface/90 border border-slate-800 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500/70 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                    />
                    {searchQuery && (
                      <button
                        type="button"
                        onClick={() => setSearchQuery("")}
                        aria-label="Clear search"
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1"
                      >
                        <Icon name="close" className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* Desktop Main Navigation */}
              <nav className="hidden md:flex items-center gap-1 rounded-xl p-1 bg-white/[0.03] border border-white/[0.06]" aria-label="Main navigation">
                <button
                  onClick={() => setView("explore")}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${view === "explore" ? "profile-nav-active shadow-sm" : "text-slate-400 hover:text-white hover:bg-white/5"}`}
                >
                  Explore
                </button>
                {user && (
                  <button
                    onClick={openProfile}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${view === "profile" ? "profile-nav-active shadow-sm" : "text-slate-400 hover:text-white hover:bg-white/5"}`}
                  >
                    My Profile
                  </button>
                )}
              </nav>

              {/* Right Actions */}
              <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                <button
                  onClick={() => {
                    if (!token) {
                      setShowAuthModal(true);
                    } else {
                      setShowCreateModal(true);
                    }
                  }}
                  className="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition-all hover:-translate-y-0.5"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>Create Agent</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-1.5 sm:gap-2 sm:pl-2 sm:border-l sm:border-slate-800">
                    <button
                      onClick={openProfile}
                      title="Open my profile"
                      aria-label="Open my profile"
                      className={`flex items-center gap-2 rounded-xl p-1 sm:pr-2.5 transition-all hover:bg-slate-800/70 ${view === "profile" ? "bg-indigo-500/15 ring-1 ring-indigo-400/30" : ""}`}
                    >
                      {user.avatarUrl ? (
                        <img src={user.avatarUrl} alt="" className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 object-cover" />
                      ) : (
                        <span className="w-8 h-8 rounded-full bg-indigo-500/20 border border-indigo-400/25 flex items-center justify-center font-bold text-indigo-200 text-sm">
                          {(user.displayName || user.username || "U").charAt(0).toUpperCase()}
                        </span>
                      )}
                      <span className="hidden lg:inline text-sm font-medium text-slate-300 max-w-28 truncate">
                        {user.displayName || user.username || "Profile"}
                      </span>
                    </button>
                    <button
                      onClick={handleLogout}
                      title="Sign out"
                      className="p-2 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-colors"
                    >
                      <Icon name="logout" className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => {
                      setAuthMode("login");
                      setShowAuthModal(true);
                    }}
                    className="px-3.5 sm:px-4 py-2 rounded-xl bg-bgElevated hover:bg-slate-700/80 text-slate-200 text-xs sm:text-sm font-semibold border border-slate-700/80 transition-colors"
                  >
                    Sign In
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* ========================================== */}
          {/* VIEW 1: EXPLORE AGENTS                     */}
          {/* ========================================== */}
          {view === "explore" && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
              {/* Hero Section */}
              <div className="premium-hero rounded-3xl sm:rounded-[28px] overflow-hidden border border-indigo-300/15 p-5 sm:p-9 lg:p-11 mb-8">

          {/* ========================================== */}
          {/* MODAL 1: AUTH (LOGIN / REGISTER)           */}
          {/* ========================================== */}
          {showAuthModal && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              onClose={() => setShowAuthModal(false)}
              onSuccess={(newToken, userData) => {
                localStorage.setItem("agenttube_token", newToken);

          {/* ========================================== */}

                fetchAgents();

              notify={notify}
            />
          )}

    // ==========================================
    // Auth Modal Component
    // ==========================================
    function AuthModal({ mode, setMode, onClose, onSuccess, apiFetch, notify }) {
      const [form, setForm] = useState({
        username: "",
        displayName: "",
        email: "",
        password: "",
        bio: "",
      });
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
          const res = await apiFetch(endpoint, {
            method: "POST",
            body: JSON.stringify(form),
          });
          onSuccess(res.token, res.user);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto"
        >
          <div className="modal-shell modal-enter w-full max-w-md rounded-3xl p-5 sm:p-7 my-auto flex-shrink-0">
            <div className="flex items-center justify-between mb-5">
              <div>
                <h2 className="text-lg font-bold text-white">
                  {mode === "login" ? "Welcome Back" : "Create Creator Account"}
                </h2>
                <p className="text-xs text-slate-400 mt-0.5">
                  {mode === "login" ? "Sign in to chat and build AI agents" : "Join AgentTube AI Studio"}
                </p>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === "register" && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="ahmed_ai"
                      value={form.username}
                      onChange={(e) => setForm({ ...form, username: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1.5">Display Name</label>
                    <input
                      type="text"
                      required
                      placeholder="Ahmed"
                      value={form.displayName}
                      onChange={(e) => setForm({ ...form, displayName: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="you@example.com"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  placeholder="••••••••"
                  value={form.password}
                  onChange={(e) => setForm({ ...form, password: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 transition-all"
              >
                {loading ? "Please wait..." : mode === "login" ? "Sign In" : "Create Account"}
              </button>
            </form>

            <div className="mt-5 text-center text-xs text-slate-400">
              {mode === "login" ? (
                <span>
                  Don't have an account?{" "}
                  <button onClick={() => setMode("register")} className="text-indigo-400 hover:underline font-semibold">
                    Register
                  </button>
                </span>
              ) : (
                <span>
                  Already have an account?{" "}
                  <button onClick={() => setMode("login")} className="text-indigo-400 hover:underline font-semibold">
                    Sign In
                  </button>
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Create Agent Modal Component
    // ==========================================
    function CreateAgentModal({ onClose, onCreated, apiFetch, notify }) {
      const [form, setForm] = useState({
        name: "",
        description: "",
        category: "General",
        rawPrompt: "",
        starter1: "",
        starter2: "",
        temperature: 0.5,
        enableWebSearch: false,
        isPublic: true,
      });
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape" && !loading) onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose, loading]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const starterPrompts = [form.starter1, form.starter2]
            .map((s) => s.trim())
            .filter(Boolean);

          const res = await apiFetch("/api/agents", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              description: form.description,
              category: form.category,
              rawPrompt: form.rawPrompt,
              temperature: Number(form.temperature),
              enableWebSearch: form.enableWebSearch,
              isPublic: form.isPublic,
              starterPrompts,
            }),
          });
          onCreated(res.data);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget && !loading) onClose(); }}
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm overflow-y-auto"
        >
          <div className="modal-shell modal-enter w-full max-w-xl rounded-3xl p-5 sm:p-7 my-auto max-h-[92dvh] overflow-y-auto flex-shrink-0">
            <div className="flex items-center justify-between mb-5">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-9 h-9 flex-shrink-0 rounded-xl bg-indigo-500/20 border border-indigo-400/25 text-indigo-300 flex items-center justify-center">
                  <Icon name="sparkles" className="w-5 h-5" />
                </div>
                <div className="min-w-0">
                  <h2 className="text-base sm:text-lg font-bold text-white">Create AI Agent</h2>
                  <p className="text-xs text-slate-400 truncate">
                    Auto-engineered into deterministic Hybrid XML
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                disabled={loading}
                className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Agent Name</label>
                  <input
                    type="text"
                    required
                    dir="auto"
                    placeholder="e.g. Senior Node.js Reviewer"
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Category</label>
                  <select
                    value={form.category}
                    onChange={(e) => setForm({ ...form, category: e.target.value })}
                    className="w-full px-3 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  >
                    {CATEGORIES.filter((c) => c !== "All").map((cat) => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1.5">Short Description</label>
                <input
                  type="text"
                  required
                  dir="auto"
                  placeholder="What does this agent help users achieve?"
                  value={form.description}
                  onChange={(e) => setForm({ ...form, description: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1.5">
                  Raw Prompt / Instructions (Arabic or English)
                </label>
                <textarea
                  rows="4"
                  required
                  dir="auto"
                  placeholder="Describe how the agent should behave, its expertise, rules, and desired response language..."
                  value={form.rawPrompt}
                  onChange={(e) => setForm({ ...form, rawPrompt: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500 leading-relaxed"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Starter Prompt 1 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. Audit my Express API"
                    value={form.starter1}
                    onChange={(e) => setForm({ ...form, starter1: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Starter Prompt 2 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. Optimize MongoDB indexes"
                    value={form.starter2}
                    onChange={(e) => setForm({ ...form, starter2: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>

              {/* Capabilities & Settings Box */}
              <div className="rounded-2xl bg-bgSurface/80 border border-slate-800 p-3.5 sm:p-4 space-y-4">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-start gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-sky-500/15 text-sky-300 flex items-center justify-center flex-shrink-0 mt-0.5">
                      <Icon name="globe" className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-xs font-semibold text-slate-200">Google Search Grounding</p>
                      <p className="text-[11px] text-slate-400">Allow agent to fetch live information from the web</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    role="switch"
                    aria-checked={form.enableWebSearch}
                    onClick={() => setForm({ ...form, enableWebSearch: !form.enableWebSearch })}
                    className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${
                      form.enableWebSearch ? "bg-indigo-600" : "bg-slate-700"
                    }`}
                  >
                    <span
                      className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                        form.enableWebSearch ? "translate-x-5" : "translate-x-0"
                      }`}
                    />
                  </button>
                </div>

                <div className="pt-3 border-t border-slate-800/80">
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="font-medium text-slate-300">Creativity (Temperature)</span>
                    <div className="flex items-center gap-1.5">
                      {[
                        { label: "Precise", val: 0.2 },
                        { label: "Balanced", val: 0.5 },
                        { label: "Creative", val: 1.0 },
                      ].map((preset) => (
                        <button
                          key={preset.label}
                          type="button"
                          onClick={() => setForm({ ...form, temperature: preset.val })}
                          className={`px-2 py-0.5 rounded-md text-[10px] font-medium transition-colors ${
                            Number(form.temperature) === preset.val
                              ? "bg-indigo-500/25 text-indigo-300 border border-indigo-400/30"
                              : "bg-slate-800 text-slate-400 hover:text-slate-200"
                          }`}
                        >
                          {preset.label}
                        </button>
                      ))}
                      <span className="text-indigo-400 font-mono font-semibold ml-1">{form.temperature}</span>
                    </div>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1.5"
                    step="0.1"
                    value={form.temperature}
                    onChange={(e) => setForm({ ...form, temperature: e.target.value })}
                    className="w-full accent-indigo-500 cursor-pointer"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2"
              >
                {loading ? (
                  <React.Fragment>
                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                    <span>AI Architect is engineering XML prompt...</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <Icon name="sparkles" className="w-4 h-4" />
                    <span>Optimize & Publish Agent</span>
                  </React.Fragment>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
