<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentTube — AI Agent Studio & Hub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgMain: '#090D16',
            bgSurface: '#111827',
            bgCard: '#161F33',
            bgElevated: '#1E293B',
            accent: '#6366F1',
            accentHover: '#4F46E5',
          },
          fontFamily: {
            sans: ['Inter', 'Cairo', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts (Inter + Cairo for Arabic/English support) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090D16;
      color: #E2E8F0;
      font-family: 'Inter', 'Cairo', sans-serif;
      overflow-x: hidden;
    }
    /* Custom eye-friendly scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090D16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .glass-panel {
      background: rgba(22, 31, 51, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Backend URL Configuration
    const API_BASE = "https://agents-377s.onrender.com";

    const CATEGORIES = [
      "All",
      "General",
      "Coding",
      "Writing",
      "Business",
      "Education",
      "Productivity",
      "Creative"
    ];

    // ==========================================
    // SVG Icons Component
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sparkles: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        ),
        search: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        ),
        plus: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
        ),
        chat: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        ),
        send: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        ),
        trash: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        ),
        eye: (
          <React.Fragment>
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </React.Fragment>
        ),
        back: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        ),
        logout: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        ),
        close: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        ),
        user: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        ),
      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    // ==========================================
    // Lightweight Markdown Formatter for Chat
    // ==========================================
    const FormattedMessage = ({ text }) => {
      if (!text) return null;
      // Split by code blocks ```lang ... ```
      const parts = text.split(/(```[\s\S]*?```)/g);

      return (
        <div className="space-y-2 leading-relaxed text-[15px]" dir="auto">
          {parts.map((part, index) => {
            if (part.startsWith("```") && part.endsWith("```")) {
              const lines = part.slice(3, -3).trim().split("\n");
              const firstLine = lines[0]?.trim() || "";
              const hasLang = /^[a-zA-Z0-9_-]+$/.test(firstLine);
              const code = hasLang ? lines.slice(1).join("\n") : lines.join("\n");

              return (
                <div key={index} className="my-3 rounded-xl overflow-hidden bg-[#070A12] border border-slate-800/90" dir="ltr">
                  <div className="flex items-center justify-between px-4 py-1.5 bg-slate-900/90 border-b border-slate-800 text-xs text-slate-400 font-mono">
                    <span>{hasLang ? firstLine : "code"}</span>
                    <button
                      onClick={() => navigator.clipboard.writeText(code)}
                      className="hover:text-indigo-400 transition-colors"
                    >
                      Copy
                    </button>
                  </div>
                  <pre className="p-4 text-xs sm:text-sm font-mono text-indigo-100 overflow-x-auto">
                    <code>{code}</code>
                  </pre>
                </div>
              );
            }

            return (
              <div key={index} className="whitespace-pre-wrap">
                {part}
              </div>
            );
          })}
        </div>
      );
    };

    // ==========================================
    // Main Application Component
    // ==========================================
    function App() {
      // Auth State
      const [token, setToken] = useState(() => localStorage.getItem("agenttube_token") || "");
      const [user, setUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // "login" | "register"

      // Navigation & UI State
      const [view, setView] = useState("explore"); // "explore" | "chat"
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [toast, setToast] = useState(null);

      // Explore State
      const [agents, setAgents] = useState([]);
      const [loadingAgents, setLoadingAgents] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");

      // Active Agent & Chat State
      const [activeAgent, setActiveAgent] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [activeConversationId, setActiveConversationId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState("");
      const [sendingMessage, setSendingMessage] = useState(false);
      const [loadingMessages, setLoadingMessages] = useState(false);

      const messagesEndRef = useRef(null);

      const notify = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Helper for API calls
      const apiFetch = async (endpoint, options = {}) => {
        const headers = {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        };
        const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        const data = await res.json();
        if (!res.ok || data.success === false) {
          throw new Error(data.error || "Request failed");
        }
        return data;
      };

      // 1. Fetch Current User on load
      useEffect(() => {
        if (!token) {
          setUser(null);
          return;
        }
        apiFetch("/api/auth/me")
          .then((res) => setUser(res.data))
          .catch(() => {
            localStorage.removeItem("agenttube_token");
            setToken("");
            setUser(null);
          });
      }, [token]);

      // 2. Fetch Agents on category or search change
      const fetchAgents = async () => {
        setLoadingAgents(true);
        try {
          const params = new URLSearchParams();
          if (selectedCategory !== "All") params.append("category", selectedCategory);
          if (searchQuery.trim()) params.append("search", searchQuery.trim());
          const res = await apiFetch(`/api/agents?${params.toString()}`);
          setAgents(res.data || []);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoadingAgents(false);
        }
      };

      useEffect(() => {
        const timer = setTimeout(fetchAgents, 250);
        return () => clearTimeout(timer);
      }, [selectedCategory, searchQuery]);

      // 3. Scroll chat to bottom
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, sendingMessage]);

      // Open Agent Chat Workspace
      const openAgentWorkspace = async (slug) => {
        try {
          const res = await apiFetch(`/api/agents/${slug}`);
          const agentData = res.data;
          setActiveAgent(agentData);
          setActiveConversationId(null);
          setMessages([]);
          setView("chat");

          if (token) {
            const convRes = await apiFetch(`/api/conversations?agentId=${agentData._id}`);
            setConversations(convRes.data || []);
          } else {
            setConversations([]);
          }
        } catch (err) {
          notify(err.message, "error");
        }
      };

      // Load specific conversation messages
      const selectConversation = async (convId) => {
        setActiveConversationId(convId);
        setLoadingMessages(true);
        try {
          const res = await apiFetch(`/api/conversations/${convId}/messages`);
          setMessages(res.data || []);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoadingMessages(false);
        }
      };

      // Delete conversation
      const handleDeleteConversation = async (e, convId) => {
        e.stopPropagation();
        try {
          await apiFetch(`/api/conversations/${convId}`, { method: "DELETE" });
          setConversations((prev) => prev.filter((c) => c._id !== convId));
          if (activeConversationId === convId) {
            setActiveConversationId(null);
            setMessages([]);
          }
          notify("Conversation deleted", "success");
        } catch (err) {
          notify(err.message, "error");
        }
      };

      // Send Chat Message
      const handleSendMessage = async (textOverride) => {
        const textToSend = (textOverride ?? inputMessage).trim();
        if (!textToSend || sendingMessage || !activeAgent) return;

        if (!token) {
          notify("Please sign in to chat with agents", "error");
          setShowAuthModal(true);
          return;
        }

        const tempUserMsg = { _id: Date.now().toString(), role: "user", text: textToSend };
        setMessages((prev) => [...prev, tempUserMsg]);
        if (!textOverride) setInputMessage("");
        setSendingMessage(true);

        try {
          const res = await apiFetch(`/api/agents/${activeAgent.slug}/chat`, {
            method: "POST",
            body: JSON.stringify({
              message: textToSend,
              conversationId: activeConversationId,
            }),
          });

          // Replace temp message with saved DB messages
          setMessages((prev) => [
            ...prev.slice(0, -1),
            ...(res.messages || [{ role: "user", text: textToSend }, { role: "model", text: res.reply }]),
          ]);

          if (!activeConversationId && res.conversationId) {
            setActiveConversationId(res.conversationId);
            setConversations((prev) => [
              { _id: res.conversationId, title: res.title, updatedAt: new Date().toISOString() },
              ...prev,
            ]);
          }
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setSendingMessage(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("agenttube_token");
        setToken("");
        setUser(null);
        setConversations([]);
        notify("Signed out successfully");
      };

      return (
        <div className="min-h-screen flex flex-col bg-bgMain text-slate-200">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border bg-bgElevated border-slate-700 text-sm font-medium animate-bounce">
              <span className={`w-2.5 h-2.5 rounded-full ${toast.type === "error" ? "bg-rose-500" : "bg-emerald-400"}`}></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-30 glass-panel border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              {/* Brand Logo */}
              <div
                onClick={() => setView("explore")}
                className="flex items-center gap-3 cursor-pointer group"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                  <Icon name="sparkles" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <span className="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    AgentTube
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    AI Studio
                  </span>
                </div>
              </div>

              {/* Search Bar (Visible in Explore View) */}
              {view === "explore" && (
                <div className="flex-1 max-w-md mx-4">
                  <div className="relative">
                    <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search AI agents by name..."
                      dir="auto"
                      className="w-full pl-10 pr-4 py-2 rounded-xl bg-bgSurface border border-slate-800/90 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500/70 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                    />
                  </div>
                </div>
              )}

              {/* Right Actions */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    if (!token) {
                      setShowAuthModal(true);
                    } else {
                      setShowCreateModal(true);
                    }
                  }}
                  className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-lg shadow-indigo-600/20 transition-all"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span className="hidden sm:inline">Create Agent</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-2.5 pl-2 border-l border-slate-800">
                    <img
                      src={user.avatarUrl}
                      alt={user.displayName}
                      className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700"
                    />
                    <span className="hidden md:inline text-sm font-medium text-slate-300">
                      {user.displayName}
                    </span>
                    <button
                      onClick={handleLogout}
                      title="Sign out"
                      className="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800/60 transition-colors"
                    >
                      <Icon name="logout" className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => {
                      setAuthMode("login");
                      setShowAuthModal(true);
                    }}
                    className="px-4 py-2 rounded-xl bg-bgElevated hover:bg-slate-700/70 text-slate-200 text-sm font-medium border border-slate-700/80 transition-colors"
                  >
                    Sign In
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* ========================================== */}
          {/* VIEW 1: EXPLORE AGENTS                     */}
          {/* ========================================== */}
          {view === "explore" && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8">
              {/* Hero Section */}
              <div className="relative rounded-2xl overflow-hidden bg-gradient-to-br from-[#131B2E] via-[#0F1626] to-[#161F33] border border-slate-800/80 p-6 sm:p-8 mb-8">
                <div className="max-w-2xl space-y-3">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-medium">
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>Powered by Hybrid XML Prompt Architect</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">
                    Discover & Deploy Specialized AI Agents
                  </h1>
                  <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                    Write a simple idea and our built-in Systems Architect automatically engineers a deterministic, production-grade XML prompt for your custom agent.
                  </p>
                </div>
              </div>

              {/* Category Pills */}
              <div className="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar">
                {CATEGORIES.map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium whitespace-nowrap transition-all ${
                      selectedCategory === cat
                        ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/25"
                        : "bg-bgCard text-slate-400 hover:text-slate-200 border border-slate-800/80"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* Agents Grid */}
              {loadingAgents ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {[1, 2, 3, 4, 5, 6].map((n) => (
                    <div key={n} className="h-48 rounded-2xl bg-bgCard/60 border border-slate-800/60 animate-pulse p-5" />
                  ))}
                </div>
              ) : agents.length === 0 ? (
                <div className="text-center py-16 bg-bgCard/40 rounded-2xl border border-slate-800/60">
                  <div className="w-12 h-12 rounded-2xl bg-slate-800/80 flex items-center justify-center mx-auto mb-3 text-slate-400">
                    <Icon name="chat" className="w-6 h-6" />
                  </div>
                  <h3 className="text-base font-semibold text-slate-200">No agents found</h3>
                  <p className="text-sm text-slate-400 mt-1 mb-5">
                    Be the first to build an AI agent in this category!
                  </p>
                  <button
                    onClick={() => (token ? setShowCreateModal(true) : setShowAuthModal(true))}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium"
                  >
                    + Create First Agent
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {agents.map((agent) => (
                    <div
                      key={agent._id}
                      onClick={() => openAgentWorkspace(agent.slug)}
                      className="group cursor-pointer rounded-2xl bg-bgCard hover:bg-[#1B263E] border border-slate-800/80 hover:border-indigo-500/40 p-5 flex flex-col justify-between transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-black/30"
                    >
                      <div>
                        <div className="flex items-start justify-between gap-3 mb-3.5">
                          <div className="flex items-center gap-3">
                            <img
                              src={agent.avatarUrl}
                              alt={agent.name}
                              className="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700/80 object-cover"
                            />
                            <div>
                              <h3 className="font-semibold text-slate-100 group-hover:text-indigo-300 transition-colors line-clamp-1" dir="auto">
                                {agent.name}
                              </h3>
                              <span className="inline-block mt-0.5 text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-800 text-slate-300">
                                {agent.category || "General"}
                              </span>
                            </div>
                          </div>
                        </div>

                        <p className="text-sm text-slate-400 line-clamp-2 leading-relaxed mb-4" dir="auto">
                          {agent.description}
                        </p>
                      </div>

                      <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                        <div className="flex items-center gap-2">
                          {agent.creator?.avatarUrl && (
                            <img src={agent.creator.avatarUrl} className="w-4 h-4 rounded-full" />
                          )}
                          <span className="truncate max-w-[120px]">
                            @{agent.creator?.username || "creator"}
                          </span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <Icon name="eye" className="w-3.5 h-3.5 text-slate-500" />
                          <span>{agent.viewsCount || 0}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* ========================================== */}
          {/* VIEW 2: AGENT CHAT WORKSPACE               */}
          {/* ========================================== */}
          {view === "chat" && activeAgent && (
            <div className="flex-1 flex overflow-hidden h-[calc(100vh-4rem)]">
              {/* Left Sidebar: Agent Details & User Conversations */}
              <aside className="hidden md:flex w-72 flex-col bg-bgSurface border-r border-slate-800/80">
                <div className="p-4 border-b border-slate-800/80">
                  <button
                    onClick={() => {
                      setView("explore");
                      fetchAgents();
                    }}
                    className="flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-white mb-4 transition-colors"
                  >
                    <Icon name="back" className="w-4 h-4" />
                    <span>Back to Explore</span>
                  </button>

                  <div className="flex items-center gap-3">
                    <img
                      src={activeAgent.avatarUrl}
                      alt={activeAgent.name}
                      className="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700"
                    />
                    <div className="min-w-0">
                      <h2 className="font-semibold text-slate-100 truncate" dir="auto">
                        {activeAgent.name}
                      </h2>
                      <p className="text-xs text-indigo-400">{activeAgent.category}</p>
                    </div>
                  </div>
                  <p className="text-xs text-slate-400 mt-3 leading-relaxed line-clamp-3" dir="auto">
                    {activeAgent.description}
                  </p>

                  <button
                    onClick={() => {
                      setActiveConversationId(null);
                      setMessages([]);
                    }}
                    className="mt-4 w-full py-2 px-3 rounded-xl bg-indigo-600/15 hover:bg-indigo-600/25 text-indigo-300 border border-indigo-500/30 text-xs font-medium flex items-center justify-center gap-2 transition-colors"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>New Conversation</span>
                  </button>
                </div>

                {/* Conversation History List */}
                <div className="flex-1 overflow-y-auto p-3 space-y-1">
                  <div className="px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Chat History
                  </div>
                  {!token ? (
                    <p className="text-xs text-slate-500 px-2 py-3">
                      Sign in to save and access your chat history.
                    </p>
                  ) : conversations.length === 0 ? (
                    <p className="text-xs text-slate-500 px-2 py-3">
                      No previous chats with this agent yet.
                    </p>
                  ) : (
                    conversations.map((conv) => (
                      <div
                        key={conv._id}
                        onClick={() => selectConversation(conv._id)}
                        className={`group flex items-center justify-between px-3 py-2.5 rounded-xl text-xs cursor-pointer transition-colors ${
                          activeConversationId === conv._id
                            ? "bg-indigo-600/20 text-indigo-200 border border-indigo-500/30"
                            : "text-slate-400 hover:bg-slate-800/60 hover:text-slate-200"
                        }`}
                      >
                        <span className="truncate pr-2" dir="auto">{conv.title || "New Chat"}</span>
                        <button
                          onClick={(e) => handleDeleteConversation(e, conv._id)}
                          className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition-opacity"
                          title="Delete conversation"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </aside>

              {/* Main Chat Area */}
              <section className="flex-1 flex flex-col bg-bgMain">
                {/* Mobile Agent Header */}
                <div className="md:hidden flex items-center justify-between px-4 py-3 bg-bgSurface border-b border-slate-800">
                  <button
                    onClick={() => setView("explore")}
                    className="flex items-center gap-1.5 text-xs text-slate-300"
                  >
                    <Icon name="back" className="w-4 h-4" />
                    <span>Explore</span>
                  </button>
                  <span className="font-semibold text-sm text-white truncate max-w-[180px]">
                    {activeAgent.name}
                  </span>
                  <button
                    onClick={() => {
                      setActiveConversationId(null);
                      setMessages([]);
                    }}
                    className="text-xs text-indigo-400 font-medium"
                  >
                    + New
                  </button>
                </div>

                {/* Messages Scroll Container */}
                <div className="flex-1 overflow-y-auto px-4 sm:px-8 py-6">
                  <div className="max-w-3xl mx-auto">
                    {loadingMessages ? (
                      <div className="text-center py-12 text-sm text-slate-400">
                        Loading conversation...
                      </div>
                    ) : messages.length === 0 ? (
                      /* Empty State & Starter Prompts */
                      <div className="text-center py-12 space-y-6">
                        <img
                          src={activeAgent.avatarUrl}
                          alt={activeAgent.name}
                          className="w-16 h-16 rounded-2xl mx-auto bg-bgCard border border-slate-700 p-1 shadow-xl"
                        />
                        <div className="space-y-2 max-w-md mx-auto">
                          <h3 className="text-xl font-bold text-white" dir="auto">
                            {activeAgent.name}
                          </h3>
                          <p className="text-sm text-slate-400" dir="auto">
                            {activeAgent.description}
                          </p>
                        </div>

                        {activeAgent.starterPrompts?.length > 0 && (
                          <div className="max-w-lg mx-auto pt-4">
                            <p className="text-xs font-medium text-slate-500 mb-3">
                              Try asking:
                            </p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                              {activeAgent.starterPrompts.map((prompt, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => handleSendMessage(prompt)}
                                  dir="auto"
                                  className="text-left p-3 rounded-xl bg-bgCard hover:bg-bgElevated border border-slate-800 hover:border-indigo-500/40 text-xs text-slate-300 transition-all"
                                >
                                  {prompt}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      /* Chat Messages */
                      <div className="space-y-5">
                        {messages.map((msg, i) => {
                          const isUser = msg.role === "user";
                          return (
                            <div
                              key={msg._id || i}
                              className={`flex gap-3.5 ${isUser ? "justify-end" : "justify-start"}`}
                            >
                              {!isUser && (
                                <img
                                  src={activeAgent.avatarUrl}
                                  alt="AI"
                                  className="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex-shrink-0 mt-1"
                                />
                              )}
                              <div
                                className={`max-w-[85%] sm:max-w-[78%] rounded-2xl px-4 py-3 ${
                                  isUser
                                    ? "bg-indigo-600 text-white rounded-br-sm shadow-md shadow-indigo-950/50"
                                    : "bg-bgCard text-slate-200 border border-slate-800/90 rounded-bl-sm"
                                }`}
                              >
                                <FormattedMessage text={msg.text} />
                              </div>
                            </div>
                          );
                        })}

                        {sendingMessage && (
                          <div className="flex gap-3.5 justify-start">
                            <img
                              src={activeAgent.avatarUrl}
                              alt="AI"
                              className="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex-shrink-0"
                            />
                            <div className="bg-bgCard border border-slate-800 rounded-2xl rounded-bl-sm px-4 py-3 flex items-center gap-1.5">
                              <span className="w-2 h-2 rounded-full bg-indigo-400 animate-bounce"></span>
                              <span className="w-2 h-2 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: "150ms" }}></span>
                              <span className="w-2 h-2 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: "300ms" }}></span>
                            </div>
                          </div>
                        )}
                        <div ref={messagesEndRef} />
                      </div>
                    )}
                  </div>
                </div>

                {/* Chat Input Box */}
                <div className="p-4 bg-bgMain border-t border-slate-800/80">
                  <div className="max-w-3xl mx-auto">
                    <div className="relative flex items-end gap-2 rounded-2xl bg-bgCard border border-slate-700/80 focus-within:border-indigo-500/70 p-2 transition-colors">
                      <textarea
                        rows="1"
                        value={inputMessage}
                        onChange={(e) => setInputMessage(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            handleSendMessage();
                          }
                        }}
                        placeholder={`Message ${activeAgent.name}...`}
                        dir="auto"
                        className="w-full max-h-36 bg-transparent px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none"
                      />
                      <button
                        onClick={() => handleSendMessage()}
                        disabled={!inputMessage.trim() || sendingMessage}
                        className="p-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white transition-all flex-shrink-0"
                      >
                        <Icon name="send" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL 1: AUTH (LOGIN / REGISTER)           */}
          {/* ========================================== */}
          {showAuthModal && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              onClose={() => setShowAuthModal(false)}
              onSuccess={(newToken, userData) => {
                localStorage.setItem("agenttube_token", newToken);
                setToken(newToken);
                setUser(userData);
                setShowAuthModal(false);
                notify(`Welcome, ${userData.displayName}!`, "success");
              }}
              apiFetch={apiFetch}
              notify={notify}
            />
          )}

          {/* ========================================== */}
          {/* MODAL 2: CREATE AGENT (PROMPT ARCHITECT)   */}
          {/* ========================================== */}
          {showCreateModal && (
            <CreateAgentModal
              onClose={() => setShowCreateModal(false)}
              onCreated={(newAgent) => {
                setShowCreateModal(false);
                notify("Agent engineered & published!", "success");
                fetchAgents();
                openAgentWorkspace(newAgent.slug);
              }}
              apiFetch={apiFetch}
              notify={notify}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // Auth Modal Component
    // ==========================================
    function AuthModal({ mode, setMode, onClose, onSuccess, apiFetch, notify }) {
      const [form, setForm] = useState({
        username: "",
        displayName: "",
        email: "",
        password: "",
        bio: "",
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
          const res = await apiFetch(endpoint, {
            method: "POST",
            body: JSON.stringify(form),
          });
          onSuccess(res.token, res.user);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div className="w-full max-w-md rounded-2xl bg-bgCard border border-slate-800 p-6 shadow-2xl">
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-lg font-bold text-white">
                {mode === "login" ? "Sign In to AgentTube" : "Create Creator Account"}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="close" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === "register" && (
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="ahmed_ai"
                      value={form.username}
                      onChange={(e) => setForm({ ...form, username: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Display Name</label>
                    <input
                      type="text"
                      required
                      placeholder="Ahmed"
                      value={form.displayName}
                      onChange={(e) => setForm({ ...form, displayName: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="you@example.com"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  placeholder="••••••••"
                  value={form.password}
                  onChange={(e) => setForm({ ...form, password: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium text-sm transition-colors"
              >
                {loading ? "Please wait..." : mode === "login" ? "Sign In" : "Create Account"}
              </button>
            </form>

            <div className="mt-5 text-center text-xs text-slate-400">
              {mode === "login" ? (
                <span>
                  Don't have an account?{" "}
                  <button onClick={() => setMode("register")} className="text-indigo-400 hover:underline font-medium">
                    Register
                  </button>
                </span>
              ) : (
                <span>
                  Already have an account?{" "}
                  <button onClick={() => setMode("login")} className="text-indigo-400 hover:underline font-medium">
                    Sign In
                  </button>
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Create Agent Modal Component
    // ==========================================
    function CreateAgentModal({ onClose, onCreated, apiFetch, notify }) {
      const [form, setForm] = useState({
        name: "",
        description: "",
        category: "General",
        rawPrompt: "",
        starter1: "",
        starter2: "",
        temperature: 0.5,
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const starterPrompts = [form.starter1, form.starter2]
            .map((s) => s.trim())
            .filter(Boolean);

          const res = await apiFetch("/api/agents", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              description: form.description,
              category: form.category,
              rawPrompt: form.rawPrompt,
              temperature: Number(form.temperature),
              starterPrompts,
            }),
          });
          onCreated(res.data);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto">
          <div className="w-full max-w-xl rounded-2xl bg-bgCard border border-slate-800 p-6 shadow-2xl my-8">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                  <Icon name="sparkles" className="w-4 h-4" />
                </div>
                <div>
                  <h2 className="text-lg font-bold text-white">Create AI Agent</h2>
                  <p className="text-xs text-slate-400">
                    Your raw instructions will be auto-upgraded to Hybrid XML
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="close" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-400 mb-1">Agent Name</label>
                  <input
                    type="text"
                    required
                    dir="auto"
                    placeholder="e.g. Senior Node.js Reviewer"
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Category</label>
                  <select
                    value={form.category}
                    onChange={(e) => setForm({ ...form, category: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  >
                    {CATEGORIES.filter((c) => c !== "All").map((cat) => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Short Description</label>
                <input
                  type="text"
                  required
                  dir="auto"
                  placeholder="What does this agent help users achieve?"
                  value={form.description}
                  onChange={(e) => setForm({ ...form, description: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">
                  Raw Prompt / Idea (Arabic or English)
                </label>
                <textarea
                  rows="4"
                  required
                  dir="auto"
                  placeholder="Describe how the agent should behave, its role, rules, and output language..."
                  value={form.rawPrompt}
                  onChange={(e) => setForm({ ...form, rawPrompt: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Starter Prompt 1 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. Audit my Express API code"
                    value={form.starter1}
                    onChange={(e) => setForm({ ...form, starter1: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Starter Prompt 2 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. How do I optimize MongoDB indexes?"
                    value={form.starter2}
                    onChange={(e) => setForm({ ...form, starter2: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Creativity (Temperature)</span>
                  <span className="text-indigo-400 font-mono">{form.temperature}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1.5"
                  step="0.1"
                  value={form.temperature}
                  onChange={(e) => setForm({ ...form, temperature: e.target.value })}
                  className="w-full accent-indigo-500"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 text-white font-medium text-sm shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2"
              >
                {loading ? (
                  <React.Fragment>
                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                    <span>AI Architect is engineering XML prompt...</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <Icon name="sparkles" className="w-4 h-4" />
                    <span>Optimize & Publish Agent</span>
                  </React.Fragment>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
