<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AgentTube — AI Agent Studio & Hub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgMain: '#090D16',
            bgSurface: '#0F1727',
            bgCard: '#151E30',
            bgElevated: '#202C43',
            accent: '#8B7CF7',
            accentHover: '#4F46E5',
          },
          fontFamily: {
            sans: ['Inter', 'Cairo', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts (Inter + Cairo for Arabic/English support) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Rich Markdown + safe HTML sanitization + code syntax highlighting -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090D16;
      color: #E2E8F0;
      font-family: 'Inter', 'Cairo', sans-serif;
      overflow-x: hidden;
    }

    /* Custom eye-friendly scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #090D16;
    }

    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .glass-panel {
      background: rgba(22, 31, 51, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }


    /* -----------------------------------------------------------
       AgentTube 2.0 | Visual system
       ----------------------------------------------------------- */
    :root {
      color-scheme: dark;
      --surface: #101827;
      --border: rgba(145, 164, 203, .12);
      --accent: #9687ff;
      --muted: #94a3b8;
    }

    html { scroll-behavior: smooth; }
    body {
      background:
        radial-gradient(ellipse 750px 420px at 90% -120px, rgba(102, 72, 210, .16), transparent 75%),
        radial-gradient(ellipse 750px 450px at -10% 25%, rgba(28, 72, 146, .10), transparent 70%),
        #090D16;
    }
    * { scrollbar-color: #334155 #0c1320; }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; }
    .glass-panel {
      background: rgba(10, 15, 26, .84);
      border-color: rgba(124, 140, 176, .12);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .12);
      backdrop-filter: blur(24px) saturate(145%);
    }
    .premium-hero {
      isolation: isolate;
      position: relative;
      background: linear-gradient(118deg, #192444 0%, #141a31 51%, #19172f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.065), 0 24px 80px rgba(0,0,0,.18);
    }
    .premium-hero::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at 75% 22%, rgba(123, 97, 255, .25), transparent 50%);
    }
    .premium-hero::after {
      content: "";
      pointer-events: none;
      position: absolute;
      width: 310px; height: 310px; border-radius: 50%;
      right: -115px; top: -225px; border: 60px solid rgba(255,255,255,.025);
    }
    .hero-accent {
      background: linear-gradient(95deg, #c4b5fd, #818cf8 50%, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .workflow-panel {
      background: linear-gradient(145deg, rgba(24,34,60,.90), rgba(14,19,36,.88));
      border: 1px solid rgba(166,169,238,.18);
      box-shadow: 0 18px 55px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .agent-card {
      background: linear-gradient(155deg, rgba(23,33,54,.94), rgba(17,25,42,.96));
      border: 1px solid rgba(139, 155, 195, .12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.027);
    }
    .agent-card:hover {
      background: linear-gradient(155deg, rgba(32,42,69,.96), rgba(21,30,52,.98));
      border-color: rgba(146, 129, 250, .55);
      box-shadow: 0 16px 48px rgba(0,0,0,.24), 0 0 0 1px rgba(129, 108, 246, .08);
    }
    .chat-shell { background: #0b111f; }
    .chat-aside { background: linear-gradient(170deg, #121a2b, #0e1524); }
    .chat-message-assistant {
      background: linear-gradient(145deg, rgba(25, 35, 55, .96), rgba(20, 29, 46, .97));
      border: 1px solid rgba(136, 155, 194, .14);
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    .chat-message-user {
      background: linear-gradient(130deg, #6557db, #4f46b8);
      box-shadow: 0 8px 26px rgba(66, 56, 164, .16);
    }
    .chat-composer {
      background: linear-gradient(120deg, #18233a, #172135);
      border: 1px solid rgba(142,155,188,.24);
      box-shadow: 0 8px 26px rgba(0,0,0,.17);
    }
    .chat-composer:focus-within {
      border-color: rgba(165, 148, 255, .75);
      box-shadow: 0 0 0 3px rgba(138, 120, 242, .10);
    }
    .modal-shell {
      background: linear-gradient(155deg, #1a253c, #121a2b);
      border: 1px solid rgba(165,180,214,.19);
      box-shadow: 0 32px 90px rgba(0,0,0,.55);
    }


    /* -----------------------------------------------------------
       Creator profile / account overview
       ----------------------------------------------------------- */
    .profile-shell {
      background: linear-gradient(150deg, rgba(20,30,50,.98), rgba(13,21,36,.98));
      border: 1px solid rgba(147,165,205,.15);
      box-shadow: 0 26px 72px rgba(0,0,0,.22);
    }
    .profile-cover {
      position: relative;
      isolation: isolate;
      background: radial-gradient(circle at 76% -50%, rgba(183,149,255,.38), transparent 50%),
                  radial-gradient(circle at 0% 105%, rgba(65,141,227,.31), transparent 48%),
                  linear-gradient(115deg, #20265b 0%, #27234f 54%, #131c37 100%);
    }
    .profile-cover::before {
      content: "";
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to right, transparent 20%, black);
      opacity: .30; pointer-events: none;
    }
    .profile-cover::after {
      content: "";
      position: absolute; width: 360px; height: 360px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%; right: -90px; top: -190px;
      box-shadow: 0 0 0 48px rgba(255,255,255,.018), 0 0 0 100px rgba(255,255,255,.014);
      pointer-events: none;
    }
    .profile-avatar {
      width: 104px; height: 104px;
      border: 5px solid #151e30; border-radius: 26px;
      background: linear-gradient(135deg, #7168db, #3b71b4);
      box-shadow: 0 16px 40px rgba(3,7,22,.36);
      overflow: hidden;
    }
    .profile-stat {
      background: linear-gradient(145deg, rgba(32,44,70,.66), rgba(17,28,45,.58));
      border: 1px solid rgba(150,166,206,.13);
    }
    .profile-info-card {
      background: linear-gradient(155deg, rgba(22,32,52,.95), rgba(15,23,39,.98));
      border: 1px solid rgba(145,163,198,.14);
    }
    .profile-agent-card {
      background: linear-gradient(145deg, rgba(23,34,56,.97), rgba(15,23,40,.97));
      border: 1px solid rgba(144,160,193,.16);
      transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .profile-agent-card:hover {
      border-color: rgba(154,133,255,.48);
      background: linear-gradient(145deg, rgba(31,42,70,.99), rgba(22,30,51,.99));
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,0,0,.17);
    }
    .profile-nav-active { background: rgba(130,110,255,.13); color: #c4b5fd; }
    @media (max-width: 640px) {
      .profile-avatar { width: 90px; height: 90px; border-radius: 23px; }
      .profile-cover::after { right: -210px; }
    }

    /* Formatted messages (Markdown / code) */
    .chat-rich { min-width: 0; line-height: 1.78; overflow-wrap: anywhere; }
    .chat-rich > :first-child { margin-top: 0; }
    .chat-rich > :last-child { margin-bottom: 0; }
    .chat-rich p { margin: .35em 0 .9em; }
    .chat-rich h1, .chat-rich h2, .chat-rich h3, .chat-rich h4 {
      color: #f1f5ff; letter-spacing: -.025em; font-weight: 750; line-height: 1.45;
      margin: 1.2em 0 .45em;
    }
    .chat-rich h1 { font-size: 1.4rem; }
    .chat-rich h2 { font-size: 1.21rem; }
    .chat-rich h3 { font-size: 1.08rem; }
    .chat-rich h4 { font-size: 1rem; }
    .chat-rich strong { color: #f3f2ff; font-weight: 700; }
    .chat-rich em { color: #c7d2fe; }
    .chat-rich ul, .chat-rich ol { padding-inline-start: 1.5rem; margin: .5em 0 1em; }
    .chat-rich ul { list-style-type: disc; }
    .chat-rich ol { list-style-type: decimal; }
    .chat-rich li { padding-inline-start: .12rem; margin: .22em 0; }
    .chat-rich li::marker { color: #a5b4fc; }
    .chat-rich a { color: #a8b9ff; text-decoration: underline; text-underline-offset: 3px; }
    .chat-rich a:hover { color: #cfccff; }
    .chat-rich blockquote {
      margin: 1em 0; padding: .55rem 1rem;
      border-inline-start: 3px solid #9687ff;
      border-radius: 0 .5rem .5rem 0;
      background: rgba(129, 140, 248, .075); color: #bac9e2;
    }
    .chat-rich hr { margin: 1.15rem 0; border: 0; height: 1px; background: rgba(148,163,184,.22); }
    .chat-rich :not(pre) > code {
      font-family: 'JetBrains Mono', monospace;
      font-size: .82em; direction: ltr; unicode-bidi: isolate;
      color: #d9c4ff; background: rgba(129, 104, 207, .17);
      border: 1px solid rgba(165,147,239,.15); border-radius: .35rem;
      padding: .14rem .35rem; overflow-wrap: anywhere;
    }
    .chat-rich .table-scroll { overflow-x: auto; max-width: 100%; margin: .9em 0; }
    .chat-rich table { width: 100%; border-collapse: collapse; font-size: .88em; }
    .chat-rich th, .chat-rich td { border: 1px solid rgba(135,155,190,.22); padding: .55rem .7rem; text-align: start; }
    .chat-rich th { background: rgba(136, 123, 240, .14); color: #e5e7ff; }
    .chat-rich tr:nth-child(even) { background: rgba(255,255,255,.025); }
    .chat-message-user .chat-rich strong, .chat-message-user .chat-rich h1,
    .chat-message-user .chat-rich h2, .chat-message-user .chat-rich h3 { color: white; }
    .chat-message-user .chat-rich :not(pre) > code { color: white; background: rgba(255,255,255,.17); }

    .code-window {
      overflow: hidden; max-width: 100%; margin: .95rem 0;
      background: #0c1220; border: 1px solid #2a3751;
      border-radius: .85rem;
      box-shadow: 0 8px 20px rgba(0,0,0,.17);
    }
    .code-titlebar {
      background: linear-gradient(90deg, #151e31, #182136);
      border-bottom: 1px solid rgba(128,147,178,.18);
    }
    .code-window pre {
      margin: 0; padding: 1.05rem 1.2rem;
      overflow-x: auto; overflow-y: auto; max-height: 530px;
      tab-size: 2; white-space: pre; word-break: normal;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; line-height: 1.85;
    }
    .code-window code.hljs { display: block; background: transparent; padding: 0; color: #dce4f7; }
    .hljs { color: #dce4f7; }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: #c4a7ff; }
    .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: #82b6ff; }
    .hljs-string, .hljs-attr, .hljs-attribute, .hljs-template-variable { color: #a9dfb1; }
    .hljs-number, .hljs-symbol, .hljs-bullet { color: #f4be91; }
    .hljs-comment, .hljs-quote { color: #7486a3; font-style: italic; }
    .hljs-built_in, .hljs-variable.language_, .hljs-meta { color: #88d4e6; }
    .hljs-params, .hljs-variable, .hljs-property { color: #dce4f7; }
    .hljs-name, .hljs-tag, .hljs-selector-class, .hljs-selector-id { color: #f3a5c7; }
    .hljs-addition { color: #a8e7bd; background: rgba(29, 145, 95, .10); }
    .hljs-deletion { color: #fca5a5; background: rgba(190, 38, 38, .12); }
    @media (max-width: 640px) {
      .code-window { border-radius: .7rem; }
      .code-window pre { font-size: 11.5px; padding: .9rem .85rem; }
      .premium-hero::after { display: none; }
    }
    /* Phone-only layout fixes: same visual language as the desktop site. */
    @media (max-width: 639px) {
      #root { min-width: 0; }
      .mobile-search-row { width: 100%; }
      .mobile-chat-header { gap: .5rem; min-width: 0; }
      .mobile-chat-title { min-width: 0; flex: 1; text-align: center; }
      .chat-composer-wrap { padding-bottom: calc(.9rem + env(safe-area-inset-bottom, 0px)); }
      .chat-scroll-area { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      .chat-composer textarea { min-width: 0; }
      .profile-shell, .profile-info-card, .profile-stat { min-width: 0; }
      .profile-stat p, .profile-shell p { overflow-wrap: anywhere; }
      .mobile-auth-modal input, .mobile-auth-modal textarea,
      .mobile-auth-modal select, .mobile-agent-modal input,
      .mobile-agent-modal textarea, .mobile-agent-modal select,
      .chat-composer textarea, .mobile-search-row input, .profile-search-input {
        font-size: 16px !important; /* Prevent Safari from zooming on focus. */
      }
      .mobile-toast { bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); left: 1rem; right: 1rem; }
      .mobile-auth-modal, .mobile-agent-modal { overscroll-behavior: contain; }
      .mobile-agent-modal .modal-shell { max-height: calc(100dvh - 2rem); }
      .mobile-auth-modal .modal-shell { max-height: calc(100dvh - 2rem); overflow-y: auto; }
      .code-window { max-width: 100%; }
    }
    @media (max-width: 359px) {
      .premium-hero { padding: 1.15rem; }
      .premium-hero h1 { font-size: 1.75rem; }
      .profile-shell > div:nth-child(2) { padding-left: .85rem; padding-right: .85rem; }
      .profile-stat { padding: .8rem; }
      .profile-action-buttons { gap: .5rem; }
      .profile-action-buttons button { padding-left: .7rem; padding-right: .7rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

  </style>
</head>

<body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Backend URL Configuration
    const API_BASE = "https://agents-377s.onrender.com";

    const CATEGORIES = [
      "All",
      "General",
      "Coding",
      "Writing",
      "Business",
      "Education",
      "Productivity",
      "Creative"
    ];

    // ==========================================
    // SVG Icons Component
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sparkles: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        ),
        search: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        ),
        plus: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
        ),
        chat: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        ),
        send: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        ),
        trash: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        ),
        eye: (
          <React.Fragment>
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </React.Fragment>
        ),
        back: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        ),
        logout: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        ),
        close: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        ),
        user: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        ),

        calendar: (
          <React.Fragment><rect x="3" y="5" width="18" height="16" rx="2" strokeWidth="1.8" /><path strokeLinecap="round" strokeWidth="1.8" d="M7 3v4m10-4v4M3 10h18" /></React.Fragment>
        ),
        mail: (
          <React.Fragment><rect x="3" y="5" width="18" height="14" rx="2" strokeWidth="1.8" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="m3 7 9 6 9-6" /></React.Fragment>
        ),
        grid: (
          <React.Fragment><rect x="3" y="3" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" strokeWidth="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" strokeWidth="1.8"/></React.Fragment>
        ),
        refresh: (
          <React.Fragment><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M20 7v5h-5M4 17v-5h5"/><path strokeLinecap="round" strokeWidth="1.8" d="M5.7 9A7 7 0 0 1 18.5 7L20 12M4 12l1.5 5A7 7 0 0 0 18.3 15" /></React.Fragment>
        ),
        copy: (
          <React.Fragment><rect x="8" y="8" width="12" height="12" rx="2" strokeWidth="1.8" /><path strokeWidth="1.8" strokeLinecap="round" d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></React.Fragment>
        ),
        check: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m5 12 4 4L19 6" />
        ),
        arrow: (
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M5 12h14m-6-6 6 6-6 6" />
        ),
      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    // ==========================================
    // Rich Markdown & syntax-highlighted code
    // Safe HTML is sanitized before insertion.
    // ==========================================
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const syntaxAliases = {
      js: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript",
      py: "python", sh: "bash", shell: "bash", zsh: "bash",
      html: "xml", svg: "xml", yml: "yaml", md: "markdown",
      cs: "csharp", csharp: "csharp", cplusplus: "cpp", rb: "ruby"
    };

    function CodeSnippet({ code, language = "" }) {
      const [copied, setCopied] = useState(false);
      const resetRef = useRef(null);
      useEffect(() => () => clearTimeout(resetRef.current), []);
      const normalized = (syntaxAliases[language.toLowerCase()] || language).toLowerCase();
      let highlighted = escapeHtml(code);
      let detected = normalized;

      if (window.hljs) {
        try {
          if (normalized && window.hljs.getLanguage(normalized)) {
            highlighted = window.hljs.highlight(code, { language: normalized, ignoreIllegals: true }).value;
          } else {
            const result = window.hljs.highlightAuto(code);
            highlighted = result.value;
            detected = result.language || normalized || "text";
          }
        } catch (e) { highlighted = escapeHtml(code); }
      }

      const copyCode = async () => {
        try {
          await navigator.clipboard.writeText(code);
          setCopied(true);
          clearTimeout(resetRef.current);
          resetRef.current = setTimeout(() => setCopied(false), 2000);
        } catch (e) { /* Browser may restrict clipboard for local files. */ }
      };

      return (
        <div className="code-window" dir="ltr">
          <div className="code-titlebar flex items-center justify-between gap-3 px-3.5 py-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="flex gap-1.5" aria-hidden="true">
                <span className="w-2 h-2 rounded-full bg-rose-400/75" />
                <span className="w-2 h-2 rounded-full bg-amber-400/75" />
                <span className="w-2 h-2 rounded-full bg-emerald-400/75" />
              </span>
              <span className="font-mono text-[11px] text-indigo-200/90 truncate uppercase tracking-wider">
                {language || detected || "code"}
              </span>
            </div>
            <button type="button" onClick={copyCode}
              className="flex items-center gap-1.5 px-2 py-1 rounded-md text-[11px] text-slate-400 hover:text-indigo-200 hover:bg-white/10 transition-colors"
              aria-label={copied ? "Code copied" : "Copy code"}>
              <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5" />
              {copied ? "Copied" : "Copy"}
            </button>
          </div>
          <pre><code className="hljs" dangerouslySetInnerHTML={{ __html: highlighted }} /></pre>
        </div>
      );
    }

    function MarkdownPart({ source }) {
      if (!source) return null;
      let html;
      if (window.marked && window.DOMPurify) {
        try {
          const renderer = new window.marked.Renderer();
          // Preserve XML/system prompts literally instead of treating tags as HTML.
          renderer.html = (token) => escapeHtml(typeof token === "string" ? token : token.text || "");
          html = window.DOMPurify.sanitize(window.marked.parse(source, {
            gfm: true, breaks: true, renderer
          }));
          html = html.replace(/<table>/g, '<div class="table-scroll"><table>')
                     .replace(/<\/table>/g, '</table></div>');
        } catch (e) { html = "<p>" + escapeHtml(source).replace(/\n/g, "<br>") + "</p>"; }
      } else {
        html = "<p>" + escapeHtml(source).replace(/\n/g, "<br>") + "</p>";
      }
      return <div className="chat-rich" dir="auto" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    const FormattedMessage = ({ text }) => {
      if (!text) return null;
      // XML prompts that arrive without Markdown fences are also colored as code.
      if (!text.includes("```") && /^\s*<(?:\?xml\b|[A-Za-z][\w:-]*[\s>])/.test(text)
        && /<\/[A-Za-z][\w:-]*>/.test(text)) {
        return <CodeSnippet code={text.trim()} language="xml" />;
      }
      // Also recognizes an unfinished fenced block while the SSE response streams.
      const parts = text.split(/(```[\s\S]*?(?:```|$))/g).filter(Boolean);
      return (
        <div className="min-w-0 text-[14px] sm:text-[14.5px] leading-relaxed" dir="auto">
          {parts.map((part, index) => {
            if (part.startsWith("```")) {
              const inner = part.slice(3).replace(/```$/, "");
              const newline = inner.indexOf("\n");
              const header = newline === -1 ? inner.trim() : inner.slice(0, newline).trim();
              const validLanguage = /^[a-zA-Z][a-zA-Z0-9_+.#-]{0,24}$/.test(header);
              const lang = validLanguage ? header : "";
              const code = validLanguage && newline >= 0 ? inner.slice(newline + 1).replace(/\n$/, "")
                : newline === -1 && validLanguage ? "" : inner.replace(/^\n/, "").replace(/\n$/, "");
              return <CodeSnippet key={index} code={code} language={lang} />;
            }
            return <MarkdownPart key={index} source={part} />;
          })}
        </div>
      );
    };


    // Compare creators using actual account IDs, with username as a fallback
    // for public agent lists whose creator fields are populated differently.
    const getAccountId = (value) => {
      if (!value) return "";
      if (typeof value === "string") return value;
      return String(value._id || value.id || "");
    };

    const isAgentOwnedBy = (agent, account) => {
      if (!agent || !account) return false;
      const owner = agent.creator || agent.createdBy || agent.owner;
      const accountId = getAccountId(account);
      const ownerId = getAccountId(owner) || getAccountId(agent.creatorId);
      if (accountId && ownerId && accountId === ownerId) return true;
      if (!owner || typeof owner !== "object") return false;
      const nameA = String(owner.username || "").trim().toLowerCase();
      const nameB = String(account.username || "").trim().toLowerCase();
      return Boolean(nameA && nameB && nameA === nameB);
    };

      // Delete conversation
      const handleDeleteConversation = async (e, convId) => {

      // Send Chat Message
      const handleSendMessage = async (textOverride) => {
        const textToSend = (textOverride ?? inputMessage).trim();
        if (!textToSend || sendingMessage || !activeAgent) return;

        if (!token) {
          notify("Please sign in to chat with agents", "error");

        }

        // 1. إضافة رسالة المستخدم + رسالة فارغة للبوت ليتم تعبئتها تدريجياً أثناء الـ Stream
        const tempUserId = Date.now().toString();
        const tempModelId = (Date.now() + 1).toString();

        const tempUserMsg = { _id: tempUserId, role: "user", text: textToSend };
        const tempModelMsg = { _id: tempModelId, role: "model", text: "" };

        setMessages((prev) => [...prev, tempUserMsg, tempModelMsg]);
        if (!textOverride) setInputMessage("");
        setSendingMessage(true);

        try {
          // ملاحظة: إذا كان السيرفر على بورت مختلف ولا تستخدم proxy، أضف الرابط الأساسي قبل /api (مثلاً `${API_BASE}/api/...`)
          const response = await fetch(`${API_BASE}/api/agents/${activeAgent.slug}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              message: textToSend,
              conversationId: activeConversationId,
            }),
          });

          // إذا حدث خطأ قبل بدء الـ Stream (مثل 400 أو 401 أو 404)
          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || "Failed to send message");
          }

          // 2. قراءة الـ SSE Stream
          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";

            for (const part of parts) {
              const line = part.trim();
              if (!line.startsWith("data:")) continue;

              const jsonStr = line.replace(/^data:\s*/, "");
              const data = JSON.parse(jsonStr);

              if (data.error) {
                throw new Error(data.error);
              }

              // تحديث رسالة البوت حرفاً بحرف فور وصول كل جزء
              if (data.chunk) {
                setMessages((prev) =>
                  prev.map((msg) =>
                    msg._id === tempModelId
                      ? { ...msg, text: msg.text + data.chunk }
                      : msg
                  )
                );
              }

              // عند الانتهاء: استبدال الرسائل المؤقتة بالرسائل المحفوظة في قاعدة البيانات وتحديث المحادثة
              if (data.done) {
                if (data.messages) {
                  setMessages((prev) => [
                    ...prev.filter((m) => m._id !== tempUserId && m._id !== tempModelId),
                    ...data.messages,
                  ]);
                }

                if (!activeConversationId && data.conversationId) {
                  setActiveConversationId(data.conversationId);
                  setConversations((prev) => [
                    {
                      _id: data.conversationId,
                      title: data.title,
                      agent: activeAgent,
                      updatedAt: new Date().toISOString(),
                    },
                    ...prev,
                  ]);
                }
              }
            }
          }
        } catch (err) {
          notify(err.message, "error");
          // حذف رسالة البوت المؤقتة إذا كانت فارغة وفشل الطلب في بدايته
          setMessages((prev) =>
            prev.filter((m) => !(m._id === tempModelId && m.text === ""))
          );
        } finally {
          setSendingMessage(false);
        }
      };

                <div className="relative mb-4">
                  <Icon name="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="Search your agents..." aria-label="Search your agents" className="profile-search-input w-full pl-10 pr-4 py-3 rounded-xl border border-slate-700/70 bg-[#151f32] focus:outline-none focus:ring-2 focus:ring-indigo-500/25 focus:border-indigo-400/50 text-sm text-white placeholder:text-slate-500" />
                </div>
              )}
              {loading ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4" aria-label="Loading agents">
                  {[1, 2, 3, 4].map((item) => <div key={item} className="rounded-2xl h-48 animate-pulse bg-slate-800/50 border border-slate-700/30" />)}
                </div>
              ) : error ? (
                <div className="profile-info-card rounded-2xl px-5 py-12 text-center">
                  <p className="text-slate-200 text-sm font-semibold">Could not load your agents</p>
                  <p className="text-slate-400 text-xs mt-2 break-words">{error}</p>
                  <button onClick={onRefresh} className="mt-5 text-sm font-semibold text-indigo-300 hover:text-indigo-200">Try again</button>
                </div>
              ) : visibleAgents.length === 0 ? (
                <div className="profile-info-card rounded-2xl px-6 py-12 text-center">
                  <div className="w-14 h-14 mx-auto flex items-center justify-center rounded-2xl bg-indigo-500/10 text-indigo-300 border border-indigo-500/15 mb-4"><Icon name="sparkles" className="w-6 h-6" /></div>
                  <h3 className="text-base font-semibold text-white">{filter ? "No matching agents" : "No published agents found"}</h3>
                  <p className="text-sm text-slate-400 max-w-sm mx-auto mt-2 leading-relaxed">
                    {filter ? "Try a different search term." : "Your published agents will appear here when they're available in the agent list."}
                  </p>
                  {!filter && <button onClick={onCreate} className="mt-5 inline-flex items-center gap-2 text-sm font-semibold rounded-xl px-4 py-2.5 bg-indigo-500 hover:bg-indigo-400 text-white transition-colors"><Icon name="plus" className="w-4 h-4" /> Create your first agent</button>}
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {visibleAgents.map((agent) => (
                    <button key={agent._id || agent.slug} type="button" onClick={() => onOpenAgent(agent.slug)} className="profile-agent-card text-left rounded-2xl p-5 group flex flex-col justify-between min-h-[180px] w-full">
                      <div>
                        <div className="flex items-center gap-3 mb-3">
                          {agent.avatarUrl ? (
                            <img src={agent.avatarUrl} alt="" className="w-11 h-11 object-cover rounded-xl border border-indigo-300/15" />
                          ) : (
                            <div className="w-11 h-11 flex items-center justify-center rounded-xl bg-indigo-500/20 text-indigo-300"><Icon name="sparkles" className="w-5 h-5" /></div>
                          )}
                          <div className="flex-1 min-w-0">
                            <h3 className="font-semibold text-slate-100 group-hover:text-indigo-300 truncate text-sm" dir="auto">{agent.name}</h3>
                            <span className="text-[11px] text-indigo-300/80">{agent.category || "General"}</span>
                          </div>
                          <Icon name="arrow" className="w-4 h-4 text-slate-500 group-hover:text-indigo-300 transition-colors" />
                        </div>
                        <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed" dir="auto">{agent.description || "Explore this AI agent"}</p>
                      </div>
                      <div className="flex items-center justify-between pt-3 mt-4 border-t border-slate-700/40 text-[11px] text-slate-500">
                        <span className="inline-flex gap-1.5 items-center"><Icon name="eye" className="w-3.5 h-3.5" /> {(Number(agent.viewsCount) || 0).toLocaleString("en-US")} views</span>
                        <span className="font-medium text-indigo-300 group-hover:text-indigo-200">Open agent</span>
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </section>

            <aside className="profile-info-card rounded-2xl p-5 sm:p-6 self-start">
              <div className="flex items-center gap-2.5 mb-5">
                <div className="w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-400/10 text-indigo-300"><Icon name="user" className="w-5 h-5" /></div>
                <h2 className="font-semibold text-white">Account Details</h2>
              </div>
              <div className="space-y-5">
                <div>
                  <p className="text-[11px] text-slate-500 font-medium uppercase tracking-wide mb-1.5">Display name</p>
                  <p className="text-sm text-slate-200 break-words" dir="auto">{name}</p>
                </div>
                {user.username && (
                  <div>
                    <p className="text-[11px] text-slate-500 font-medium uppercase tracking-wide mb-1.5">Username</p>
                    <p className="text-sm text-slate-200 break-all" dir="auto">@{user.username}</p>
                  </div>
                )}
                {user.email && (
                  <div>
                    <div className="flex items-center gap-1.5 mb-1.5"><Icon name="mail" className="w-3.5 h-3.5 text-slate-500" /><p className="text-[11px] text-slate-500 font-medium uppercase tracking-wide">Email · private</p></div>
                    <p className="text-sm text-slate-200 break-all" dir="auto">{user.email}</p>
                  </div>
                )}
                {memberDate && (
                  <div>
                    <div className="flex items-center gap-1.5 mb-1.5"><Icon name="calendar" className="w-3.5 h-3.5 text-slate-500" /><p className="text-[11px] text-slate-500 font-medium uppercase tracking-wide">Member since</p></div>
                    <p className="text-sm text-slate-200">{memberDate}</p>
                  </div>
                )}
              </div>
              <div className="border-t border-slate-700/50 mt-6 pt-5">
                <div className="flex gap-2.5 items-start p-3 rounded-xl bg-indigo-500/5 border border-indigo-500/10">
                  <Icon name="sparkles" className="w-4 h-4 text-indigo-300 flex-shrink-0 mt-0.5" />
                  <p className="text-xs leading-relaxed text-slate-400">Your published agents are showcased on AgentTube for others to discover.</p>
                </div>
              </div>
            </aside>
          </div>
        </main>
      );
    }

    // ==========================================
    // Auth Modal Component
    // ==========================================
    function AuthModal({ mode, setMode, onClose, onSuccess, apiFetch, notify }) {
      const [form, setForm] = useState({
        username: "",
        displayName: "",
        email: "",
        password: "",
        bio: "",
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
          const res = await apiFetch(endpoint, {
            method: "POST",
            body: JSON.stringify(form),
          });
          onSuccess(res.token, res.user);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="mobile-auth-modal fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 bg-black/70 backdrop-blur-sm overflow-y-auto">
          <div className="modal-shell w-full max-w-md rounded-3xl p-5 sm:p-7 my-auto flex-shrink-0">
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-lg font-bold text-white">
                {mode === "login" ? "Sign In to AgentTube" : "Create Creator Account"}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="close" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === "register" && (
                <div className="grid grid-cols-1 min-[410px]:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="ahmed_ai"
                      value={form.username}
                      onChange={(e) => setForm({ ...form, username: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Display Name</label>
                    <input
                      type="text"
                      required
                      placeholder="Ahmed"
                      value={form.displayName}
                      onChange={(e) => setForm({ ...form, displayName: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="you@example.com"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  placeholder="••••••••"
                  value={form.password}
                  onChange={(e) => setForm({ ...form, password: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium text-sm transition-colors"
              >
                {loading ? "Please wait..." : mode === "login" ? "Sign In" : "Create Account"}
              </button>
            </form>

            <div className="mt-5 text-center text-xs text-slate-400">
              {mode === "login" ? (
                <span>
                  Don't have an account?{" "}
                  <button onClick={() => setMode("register")} className="text-indigo-400 hover:underline font-medium">
                    Register
                  </button>
                </span>
              ) : (
                <span>
                  Already have an account?{" "}
                  <button onClick={() => setMode("login")} className="text-indigo-400 hover:underline font-medium">
                    Sign In
                  </button>
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Create Agent Modal Component
    // ==========================================
    function CreateAgentModal({ onClose, onCreated, apiFetch, notify }) {
      const [form, setForm] = useState({
        name: "",
        description: "",
        category: "General",
        rawPrompt: "",
        starter1: "",
        starter2: "",
        temperature: 0.5,
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const starterPrompts = [form.starter1, form.starter2]
            .map((s) => s.trim())
            .filter(Boolean);

          const res = await apiFetch("/api/agents", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              description: form.description,
              category: form.category,
              rawPrompt: form.rawPrompt,
              temperature: Number(form.temperature),
              starterPrompts,
            }),
          });
          onCreated(res.data);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="mobile-agent-modal fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto">
          <div className="modal-shell w-full max-w-xl rounded-3xl p-5 sm:p-7 my-auto sm:my-8 max-h-[92vh] overflow-y-auto flex-shrink-0">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-8 h-8 flex-shrink-0 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                  <Icon name="sparkles" className="w-4 h-4" />
                </div>
                <div className="min-w-0">
                  <h2 className="text-lg font-bold text-white">Create AI Agent</h2>
                  <p className="text-xs text-slate-400">
                    Your raw instructions will be auto-upgraded to Hybrid XML
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="close" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-400 mb-1">Agent Name</label>
                  <input
                    type="text"
                    required
                    dir="auto"
                    placeholder="e.g. Senior Node.js Reviewer"
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Category</label>
                  <select
                    value={form.category}
                    onChange={(e) => setForm({ ...form, category: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                  >
                    {CATEGORIES.filter((c) => c !== "All").map((cat) => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Short Description</label>
                <input
                  type="text"
                  required
                  dir="auto"
                  placeholder="What does this agent help users achieve?"
                  value={form.description}
                  onChange={(e) => setForm({ ...form, description: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">
                  Raw Prompt / Idea (Arabic or English)
                </label>
                <textarea
                  rows="4"
                  required
                  dir="auto"
                  placeholder="Describe how the agent should behave, its role, rules, and output language..."
                  value={form.rawPrompt}
                  onChange={(e) => setForm({ ...form, rawPrompt: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-bgSurface border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Starter Prompt 1 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. Audit my Express API code"
                    value={form.starter1}
                    onChange={(e) => setForm({ ...form, starter1: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Starter Prompt 2 (Optional)</label>
                  <input
                    type="text"
                    dir="auto"
                    placeholder="e.g. How do I optimize MongoDB indexes?"
                    value={form.starter2}
                    onChange={(e) => setForm({ ...form, starter2: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-xl bg-bgSurface border border-slate-700/80 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>Creativity (Temperature)</span>
                  <span className="text-indigo-400 font-mono">{form.temperature}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1.5"
                  step="0.1"
                  value={form.temperature}
                  onChange={(e) => setForm({ ...form, temperature: e.target.value })}
                  className="w-full accent-indigo-500"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 text-white font-medium text-sm shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2"
              >
                {loading ? (
                  <React.Fragment>
                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                    <span>AI Architect is engineering XML prompt...</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <Icon name="sparkles" className="w-4 h-4" />
                    <span>Optimize & Publish Agent</span>
                  </React.Fragment>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
